<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | CampusMarket NG</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="theme.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-wa-bg text-gray-800 font-ui min-h-screen">

    <!-- Header -->
    <header class="bg-wa-teal text-white p-4 shadow-lg sticky top-0 z-50">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold">Admin Dashboard</h1>
            <button id="logoutBtn" class="tap bg-red-600 hover:bg-red-700 px-6 py-2 rounded-lg font-bold shadow transition">
                LOGOUT
            </button>
        </div>
    </header>

    <div class="max-w-6xl mx-auto p-4">

        <!-- Metrics -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
            <div class="bg-white rounded-xl shadow p-6 text-center">
                <p class="text-gray-500 text-sm uppercase">Total Listings</p>
                <p id="stat-total" class="text-4xl font-extrabold text-wa-teal mt-2">0</p>
            </div>
            <div class="bg-white rounded-xl shadow p-6 text-center">
                <p class="text-gray-500 text-sm uppercase">Verified</p>
                <p id="stat-verified" class="text-4xl font-extrabold text-green-600 mt-2">0</p>
            </div>
            <div class="bg-white rounded-xl shadow p-6 text-center">
                <p class="text-gray-500 text-sm uppercase">Status</p>
                <p class="text-2xl font-bold text-wa-teal mt-2">ONLINE</p>
            </div>
        </div>

        <!-- Global Ticker Manager -->
        <div class="bg-white rounded-xl shadow p-6 mb-8">
            <h2 class="text-lg font-bold mb-4">Global Marketplace Alert</h2>
            <div class="flex gap-4">
                <input type="text" id="alertInput" placeholder="Enter announcement (e.g. Flash Sale Today!)" class="flex-1 px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:border-wa-teal">
                <button onclick="updateGlobalAlert()" class="tap bg-wa-teal text-white px-6 py-3 rounded-xl font-bold hover:bg-wa-dark shadow transition">
                    UPDATE TICKER
                </button>
            </div>
            <p class="text-xs text-gray-500 mt-3">This message scrolls on the main marketplace header.</p>
        </div>

        <!-- Search & Table -->
        <div class="bg-white rounded-xl shadow overflow-hidden">
            <div class="p-4 border-b border-gray-100">
                <input type="text" id="adminSearch" placeholder="Search by title, phone, or campus..." class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:border-wa-teal">
            </div>
            
            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead class="bg-gray-50 text-left text-xs font-bold text-gray-600 uppercase">
                        <tr>
                            <th class="p-4">Item</th>
                            <th class="p-4">Contact</th>
                            <th class="p-4 text-center">Status</th>
                            <th class="p-4 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-gray-100">
                        <!-- Rows loaded by JS -->
                        <tr>
                            <td colspan="4" class="p-12 text-center text-gray-400">Loading listings...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
