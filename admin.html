<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | CampusMarket</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="theme.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-50 font-ui min-h-screen">

    <nav class="bg-wa-dark text-white p-4 shadow-lg sticky top-0 z-50">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="font-bold tracking-tight">ADMIN <span class="text-wa-light">DASHBOARD</span></h1>
            <div class="flex items-center gap-4">
                <span id="adminEmail" class="text-[10px] opacity-70"></span>
                <button onclick="handleLogout()" class="bg-red-500/20 hover:bg-red-500 text-white px-3 py-1 rounded-lg text-xs font-bold transition">LOGOUT</button>
            </div>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto p-4 space-y-6">
        
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="bg-white p-4 rounded-2xl shadow-wa border border-gray-100">
                <p class="text-[10px] font-bold text-gray-400 uppercase">Total Items</p>
                <h2 id="stat-total" class="text-2xl font-black text-wa-teal">0</h2>
            </div>
            <div class="bg-white p-4 rounded-2xl shadow-wa border border-gray-100">
                <p class="text-[10px] font-bold text-gray-400 uppercase">Verified</p>
                <h2 id="stat-verified" class="text-2xl font-black text-wa-light">0</h2>
            </div>
            <div class="bg-white p-4 rounded-2xl shadow-wa border border-gray-100">
                <p class="text-[10px] font-bold text-gray-400 uppercase">Flagged</p>
                <h2 id="stat-flagged" class="text-2xl font-black text-red-500">0</h2>
            </div>
            <div class="bg-white p-4 rounded-2xl shadow-wa border border-gray-100">
                <p class="text-[10px] font-bold text-gray-400 uppercase">Anomalies</p>
                <h2 id="stat-watchdog" class="text-2xl font-black text-orange-500">0</h2>
            </div>
        </div>

        <section class="bg-white p-6 rounded-2xl shadow-wa border border-gray-100">
            <h3 class="font-bold text-xs uppercase mb-4 flex items-center gap-2">📢 Global Ticker Alert</h3>
            <div class="flex gap-2">
                <input type="text" id="alertInput" placeholder="Enter marquee text..." class="flex-1 bg-gray-50 border border-gray-200 p-3 rounded-xl text-sm outline-none">
                <button onclick="updateGlobalAlert()" class="bg-wa-teal text-white px-6 rounded-xl font-bold text-xs shadow-md active:scale-95 transition">PUSH</button>
            </div>
        </section>

        <section class="bg-white rounded-2xl shadow-wa border border-gray-100 overflow-hidden">
            <div class="p-4 border-b border-gray-50 flex justify-between items-center bg-gray-50/50">
                <h3 class="font-bold text-xs uppercase">Recent Listings</h3>
                <input type="text" id="adminSearch" placeholder="Filter by title or number..." class="bg-white border border-gray-200 p-2 rounded-lg text-[10px] outline-none w-48">
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-gray-50 text-[10px] uppercase text-gray-400 font-bold">
                        <tr>
                            <th class="p-4">Item</th>
                            <th class="p-4">Seller Info</th>
                            <th class="p-4">Status</th>
                            <th class="p-4 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="text-sm">
                        </tbody>
                </table>
            </div>
        </section>

    </main>

    <script src="admin.js"></script>
</body>
</html>
