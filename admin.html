<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | CampusMarket NG</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="theme.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        .animate-shake { animation: shake 0.6s ease-in-out; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-10px); }
            20%, 40%, 60%, 80% { transform: translateX(10px); }
        }
    </style>
</head>
<body class="bg-wa-bg min-h-screen">
    <!-- Header -->
    <header class="bg-wa-teal text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold">Admin Dashboard</h1>
                <p class="text-sm opacity-90">CampusMarket NG • Secure Control Panel</p>
            </div>
            <button id="logoutBtn" class="tap bg-red-600 hover:bg-red-700 px-6 py-3 rounded-xl font-bold shadow-lg transition">
                LOGOUT
            </button>
        </div>
    </header>

    <div class="max-w-7xl mx-auto p-6">

        <!-- Metrics Grid -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
            <div class="bg-white rounded-2xl shadow-lg p-6 text-center">
                <p class="text-gray-500 text-sm uppercase font-bold">Total Listings</p>
                <p id="stat-total" class="text-5xl font-extrabold text-wa-teal mt-4">0</p>
            </div>
            <div class="bg-white rounded-2xl shadow-lg p-6 text-center">
                <p class="text-gray-500 text-sm uppercase font-bold">Verified</p>
                <p id="stat-verified" class="text-5xl font-extrabold text-green-600 mt-4">0</p>
            </div>
            <div class="bg-white rounded-2xl shadow-lg p-6 text-center">
                <p class="text-gray-500 text-sm uppercase font-bold">Blacklisted</p>
                <p id="stat-blacklisted" class="text-5xl font-extrabold text-red-600 mt-4">0</p>
            </div>
            <div class="bg-white rounded-2xl shadow-lg p-6 text-center">
                <p class="text-gray-500 text-sm uppercase font-bold">Status</p>
                <p class="text-3xl font-bold text-wa-teal mt-4">ONLINE</p>
            </div>
        </div>

        <!-- Global Ticker Manager -->
        <div class="bg-white rounded-2xl shadow-lg p-6 mb-8">
            <h2 class="text-xl font-bold mb-4">Global Marketplace Ticker</h2>
            <div class="flex flex-col sm:flex-row gap-4">
                <input type="text" id="alertInput" placeholder="Enter announcement (e.g. 'Flash Sale Today!')" class="flex-1 px-5 py-3 border border-gray-300 rounded-xl focus:outline-none focus:border-wa-teal transition">
                <button onclick="updateGlobalAlert()" class="tap bg-wa-teal hover:bg-wa-dark text-white font-bold px-8 py-3 rounded-xl shadow-lg transition">
                    UPDATE TICKER
                </button>
            </div>
            <p class="text-sm text-gray-500 mt-3">This message scrolls on the main marketplace homepage.</p>
        </div>

        <!-- Search & Table -->
        <div class="bg-white rounded-2xl shadow-lg overflow-hidden">
            <div class="p-6 border-b border-gray-100">
                <input type="text" id="adminSearch" placeholder="Search by title, WhatsApp number, or campus..." class="w-full px-5 py-3 border border-gray-300 rounded-xl focus:outline-none focus:border-wa-teal transition">
            </div>

            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead class="bg-gray-50 text-left text-xs font-bold text-gray-600 uppercase tracking-wider">
                        <tr>
                            <th class="p-5">Item Details</th>
                            <th class="p-5">Contact & Type</th>
                            <th class="p-5 text-center">Verification</th>
                            <th class="p-5 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-gray-100">
                        <tr>
                            <td colspan="4" class="p-12 text-center text-gray-400 text-lg">Loading listings...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
