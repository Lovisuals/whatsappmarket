<!DOCTYPE html>
<html lang="en">
<body class="select-none text-gray-800 font-ui bg-wa-bg pb-24">

    <div id="adBar" class="hidden marquee-container bg-black text-white py-1">
        <div id="adTrack" class="marquee-track text-[10px] font-bold"></div>
    </div>

    <header class="bg-wa-teal text-white pt-4 pb-2 sticky top-0 z-40 shadow-lg backdrop-blur-md bg-opacity-95">
        <div class="flex justify-between items-center px-4 mb-4">
            <h1 class="font-bold text-xl tracking-tight">CampusMarket <span class="text-[10px] bg-white text-wa-teal px-1.5 py-0.5 rounded font-extrabold">NG</span></h1>
            <div class="flex items-center gap-2">
                <button id="adminGateBtn" onclick="window.handleAdminGate()" class="opacity-30 hover:opacity-100 text-[8px] text-white transition font-bold uppercase">ADMIN</button>
                <button onclick="window.openModal('verifiedModal')" class="tap bg-white/20 backdrop-blur-md text-white px-3 py-1 rounded-full text-[10px] font-bold border border-white/30 flex items-center gap-1">👑 PREMIUM</button>
            </div>
        </div>
        <div class="flex gap-3 overflow-x-auto px-4 pb-2 scrollbar-hide" id="campusList"></div>
    </header>

    <div class="bg-white p-4 shadow-md border-b border-gray-100 sticky top-[108px] z-30">
        <input type="text" id="searchInput" oninput="window.renderFeed()" placeholder="Search items..." class="w-full bg-gray-100 p-3 rounded-xl text-sm mb-3 outline-none focus:ring-2 focus:ring-wa-teal transition">
        <div class="flex gap-2">
            <button data-filter="All" class="type-btn tap flex-1 bg-wa-teal text-white py-2.5 rounded-full text-xs font-bold shadow-sm">ALL</button>
            <button data-filter="Physical" class="type-btn tap flex-1 bg-gray-50 border border-gray-200 py-2.5 rounded-full text-xs font-bold text-gray-400">PHYSICAL</button>
            <button data-filter="Digital" class="type-btn tap flex-1 bg-gray-50 border border-gray-200 py-2.5 rounded-full text-xs font-bold text-gray-400">DIGITAL</button>
        </div>
    </div>

    <main id="feed" class="p-3 grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 min-h-[60vh]"></main>

    <button id="addBtn" onclick="window.openModal('sellModal')" class="fixed bottom-6 right-6 bg-wa-teal text-white w-14 h-14 rounded-2xl flex items-center justify-center text-3xl shadow-xl active:scale-90 transition z-50">+</button>

    <div id="adminOverlay" class="hidden fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4 backdrop-blur-md">
        <div class="bg-white rounded-[2rem] p-6 w-full max-w-4xl shadow-2xl max-h-[90vh] overflow-y-auto animate-pop">
            <div class="flex justify-between items-center mb-6 border-b pb-4">
                <div>
                    <h2 class="text-2xl font-black text-wa-teal uppercase">MODERATION</h2>
                    <p class="text-[10px] font-bold text-gray-400">Authorized Personnel Only</p>
                </div>
                <button onclick="handleLogout()" class="bg-red-50 text-red-600 px-4 py-2 rounded-xl text-xs font-bold">LOGOUT</button>
                <button onclick="window.closeModal('adminOverlay')" class="text-2xl">&times;</button>
            </div>
            <div id="adminFeed" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
        </div>
    </div>

    <script>
        // Ensure theme.js loads first
        const supabase = window.initSupabase?.() || null;
        let allProducts = [];
        let isAdmin = false;
        let currentUserId = null;
        let currentFilter = 'All';
        let currentCampus = 'All';

        // GLOBAL UI BINDINGS
        window.openModal = id => { document.getElementById(id)?.classList.remove('hidden'); document.body.style.overflow = 'hidden'; }
        window.closeModal = id => { document.getElementById(id)?.classList.add('hidden'); document.body.style.overflow = 'auto'; }
        window.handleAdminGate = () => isAdmin ? openModal('adminOverlay') : openModal('loginModal');

        // CORE RE-RENDER LOGIC
        window.renderFeed = () => {
            const term = (document.getElementById('searchInput')?.value || '').toLowerCase();
            const filtered = allProducts.filter(p =>
                (currentFilter === 'All' || p.item_type === currentFilter) &&
                (currentCampus === 'All' || p.campus === currentCampus) &&
                p.title.toLowerCase().includes(term)
            );
            document.getElementById('feed').innerHTML = filtered.map(p => renderCard(p, false)).join('');
            if (isAdmin) document.getElementById('adminFeed').innerHTML = allProducts.map(p => renderCard(p, true)).join('');
        };

        const renderCard = (p, admin = false) => {
            const phone = (p.whatsapp_number || '').replace(/\D/g, '');
            return `
                <div class="bg-white rounded-2xl shadow-sm overflow-hidden border border-gray-100 flex flex-col animate-fade">
                    <div class="relative h-40">
                        <img src="${p.images?.[0] || 'https://placehold.co/400x300'}" class="w-full h-full object-cover">
                        ${p.is_master ? '<span class="absolute top-2 left-2 bg-green-500 text-white text-[8px] px-2 py-1 rounded-full font-bold shadow-lg">VERIFIED</span>' : ''}
                    </div>
                    <div class="p-3 flex-1 flex flex-col">
                        <h3 class="font-bold text-xs truncate">${p.title}</h3>
                        <p class="text-wa-teal font-black text-sm mt-1">₦${Number(p.price).toLocaleString()}</p>
                        ${!admin ? `<a href="https://wa.me/${phone}" target="_blank" class="mt-3 block text-center bg-wa-teal text-white py-2.5 rounded-xl text-[10px] font-bold">CHAT TO BUY</a>` : 
                        `<div class="mt-3 flex gap-2">
                            <button onclick="window.toggleVerify('${p.id}', ${!p.is_master})" class="flex-1 py-2 rounded-xl text-[10px] font-bold text-white ${p.is_master ? 'bg-orange-500' : 'bg-green-600'}">${p.is_master ? 'REVOKE' : 'VERIFY'}</button>
                            <button onclick="window.deleteProduct('${p.id}')" class="flex-1 bg-red-600 text-white py-2 rounded-xl text-[10px] font-bold">DELETE</button>
                        </div>`}
                    </div>
                </div>`;
        };

        // ADMIN MUTATIONS
        window.toggleVerify = async (id, verify) => {
            const { error } = await supabase.from('products').update({ is_master: verify }).eq('id', id);
            if (!error) await supabase.from('audit_logs').insert({ admin_id: currentUserId, product_id: id, action: verify ? 'verify' : 'unverify' });
        };

        window.deleteProduct = async id => {
            if (!confirm('Delete permanently?')) return;
            const { error } = await supabase.from('products').delete().eq('id', id);
            if (!error) await supabase.from('audit_logs').insert({ admin_id: currentUserId, product_id: id, action: 'delete' });
        };

        window.handleLogout = async () => {
            await supabase.auth.signOut();
            location.reload();
        };

        // SYSTEM BOOTSTRAP
        (async () => {
            if (!supabase) return;
            
            // Session Recovery
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                const { data: admin } = await supabase.from('admins').select('id').eq('id', session.user.id).maybeSingle();
                if (admin) { 
                    isAdmin = true; 
                    currentUserId = session.user.id; 
                    document.getElementById('adminGateBtn').textContent = "DASHBOARD";
                }
            }

            // Realtime & Initial Load
            const loadMarket = async () => {
                const { data } = await supabase.from('products').select('*').order('created_at', { ascending: false });
                allProducts = data || [];
                window.renderFeed();
            };
            
            await loadMarket();
            supabase.channel('products').on('postgres_changes', { event: '*', schema: 'public', table: 'products' }, loadMarket).subscribe();
            
            // Populate Filters from theme.js config
            const campuses = window.CampusConfig?.campuses || [];
            document.getElementById('campusList').innerHTML = campuses.map(c => `
                <button onclick="window.setCampusFilter('${c.id}')" class="flex-none px-4 py-2 rounded-full text-xs font-bold transition ${currentCampus === c.id ? 'bg-white text-wa-teal shadow-md' : 'bg-white/20 text-white'}">
                    ${c.name}
                </button>`).join('');
            
            window.setCampusFilter = id => { currentCampus = id; document.querySelectorAll('#campusList button').forEach(b => b.className = "flex-none px-4 py-2 rounded-full text-xs font-bold transition bg-white/20 text-white"); location.reload(); }; // Simplified for reload sync
        })();
    </script>
</body>
</html>
