<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Control | CampusMarket NG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="theme.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        .animate-shake { animation: shake 0.5s; }
        @keyframes shake { 0%, 100% {transform: translateX(0);} 20%, 60% {transform: translateX(-10px);} 40%, 80% {transform: translateX(10px);} }
        .spinner { border: 3px solid rgba(0,128,105,0.1); border-left-color: #008069; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-wa-bg min-h-screen font-ui select-none">

    <!-- Login Section -->
    <div id="authSection" class="h-screen flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8 border-t-4 border-wa-teal animate-pop">
            <div class="text-center mb-8">
                <div class="mx-auto w-16 h-16 bg-wa-teal/10 rounded-full flex items-center justify-center text-3xl mb-4">🔐</div>
                <h1 class="text-2xl font-bold text-gray-800">Admin Gate</h1>
                <p class="text-xs text-gray-400 font-bold tracking-widest mt-2 uppercase">Authorized Access Only</p>
            </div>
            <form id="loginForm" class="space-y-6">
                <input type="email" id="email" class="w-full px-4 py-3 border rounded-xl outline-none focus:border-wa-teal transition" placeholder="Admin Email" required>
                <input type="password" id="password" class="w-full px-4 py-3 border rounded-xl outline-none focus:border-wa-teal transition" placeholder="Password" required>
                <div id="errorDiv" class="hidden bg-red-50 text-red-600 p-3 rounded-xl text-xs font-bold text-center"></div>
                <button type="submit" id="loginBtn" class="w-full bg-wa-teal text-white font-bold py-4 rounded-xl shadow-lg hover:bg-wa-dark transition flex items-center justify-center gap-2">
                    <span>VERIFY & ENTER</span>
                </button>
            </form>
        </div>
    </div>

    <!-- Dashboard Section -->
    <div id="dashboardSection" class="hidden">
        <header class="bg-wa-teal text-white p-5 sticky top-0 z-50 shadow-lg">
            <div class="max-w-7xl mx-auto flex justify-between items-center">
                <h1 class="font-extrabold text-xl">Admin Command</h1>
                <button id="logoutBtn" class="bg-red-500 hover:bg-red-600 px-6 py-2 rounded-xl text-xs font-bold transition">LOGOUT</button>
            </div>
        </header>

        <main class="max-w-7xl mx-auto p-6">
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
                <div class="bg-white p-6 rounded-2xl shadow-sm text-center">
                    <p class="text-gray-400 text-[10px] font-bold uppercase">Total Items</p>
                    <p id="stat-total" class="text-3xl font-black text-wa-teal">0</p>
                </div>
                <div class="bg-white p-6 rounded-2xl shadow-sm text-center border-b-4 border-green-500">
                    <p class="text-gray-400 text-[10px] font-bold uppercase">Verified</p>
                    <p id="stat-verified" class="text-3xl font-black text-green-600">0</p>
                </div>
            </div>

            <section class="bg-white p-6 rounded-2xl shadow-sm mb-8">
                <h3 class="font-bold text-sm mb-4">Marketplace Ticker Alert</h3>
                <div class="flex gap-2">
                    <input type="text" id="alertInput" class="flex-1 bg-gray-50 border p-3 rounded-xl text-sm outline-none focus:border-wa-teal" placeholder="Live announcement...">
                    <button onclick="updateTicker()" class="bg-wa-teal text-white px-6 py-3 rounded-xl text-xs font-bold">UPDATE</button>
                </div>
            </section>

            <div class="bg-white rounded-2xl shadow-sm overflow-hidden">
                <table class="w-full text-left">
                    <thead class="bg-gray-50 text-[10px] font-bold uppercase text-gray-400">
                        <tr><th class="p-4">Item</th><th class="p-4">Contact</th><th class="p-4 text-center">Status</th><th class="p-4"></th></tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr>
                            <td colspan="4" class="p-20 text-center">
                                <div class="spinner mx-auto"></div>
                                <p class="text-gray-500 mt-4">Loading listings...</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script>
        const supabase = window.initSupabase?.() || null;
        let allProducts = [];

        // Show/Hide Sections
        function showLogin() {
            document.getElementById('dashboardSection').classList.add('hidden');
            document.getElementById('authSection').classList.remove('hidden');
        }

        function showDashboard() {
            document.getElementById('authSection').classList.add('hidden');
            document.getElementById('dashboardSection').classList.remove('hidden');
        }

        // Session Check on Load
        (async () => {
            if (!supabase) {
                showError("Connection failed.");
                return;
            }

            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                const { data: adminData } = await supabase.from('admins').select('id').eq('id', session.user.id).maybeSingle();
                if (adminData) {
                    showDashboard();
                    loadData();
                    setupRealtime();
                } else {
                    showLogin();
                }
            } else {
                showLogin();
            }
        })();

        // Login Submit
        document.getElementById('loginForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            btn.innerHTML = '<div class="spinner mx-auto"></div>';
            btn.disabled = true;
            hideError();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            const { data, error } = await supabase.auth.signInWithPassword({ email, password });

            if (error) {
                showError(error.message || "Invalid credentials");
                btn.textContent = 'VERIFY & ENTER';
                btn.disabled = false;
                return;
            }

            const { data: adminData } = await supabase.from('admins').select('id').eq('id', data.user.id).maybeSingle();

            if (!adminData) {
                await supabase.auth.signOut();
                showError("Access Denied: Not authorized");
                btn.textContent = 'VERIFY & ENTER';
                btn.disabled = false;
                return;
            }

            showDashboard();
            loadData();
            setupRealtime();
            btn.textContent = 'VERIFY & ENTER';
            btn.disabled = false;
        };

        // Error Display
        function showError(msg) {
            const div = document.getElementById('errorDiv');
            div.textContent = msg;
            div.classList.remove('hidden');
            document.querySelector('#authSection .bg-white').classList.add('animate-shake');
            setTimeout(() => document.querySelector('#authSection .bg-white').classList.remove('animate-shake'), 600);
        }

        function hideError() {
            document.getElementById('errorDiv').classList.add('hidden');
        }

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await supabase.auth.signOut();
            showLogin();
            hideError();
        });

        // Load Data
        async function loadData() {
            const { data, error } = await supabase.from('products').select('*').order('created_at', { ascending: false });

            if (error) {
                console.error(error);
                return;
            }

            allProducts = data || [];
            renderTable();
            updateMetrics();
            await loadTicker();
        }

        // Render Table
        function renderTable() {
            const tbody = document.getElementById('tableBody');
            if (allProducts.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="p-20 text-center text-gray-400">Marketplace is empty</td></tr>';
                return;
            }

            tbody.innerHTML = allProducts.map(p => `
                <tr class="border-t">
                    <td class="p-4 flex items-center gap-3">
                        <img src="${p.images?.[0] || 'https://placehold.co/80x80'}" class="w-10 h-10 object-cover rounded-lg">
                        <span class="font-bold text-xs">${p.title}</span>
                    </td>
                    <td class="p-4 text-xs font-mono">${p.whatsapp_number}</td>
                    <td class="p-4 text-center">
                        <button onclick="toggleVerify('${p.id}', ${p.is_master})" class="px-4 py-1.5 rounded-full text-[9px] font-bold ${p.is_master ? 'bg-wa-teal text-white' : 'bg-gray-100 text-gray-400'}">
                            ${p.is_master ? 'VERIFIED' : 'PENDING'}
                        </button>
                    </td>
                    <td class="p-4 text-right">
                        <button onclick="deleteItem('${p.id}')" class="text-gray-300 hover:text-red-500">🗑️</button>
                    </td>
                </tr>
            `).join('');
        }

        // Actions
        async function toggleVerify(id, current) {
            await supabase.from('products').update({ is_master: !current }).eq('id', id);
            loadData();
        }

        async function deleteItem(id) {
            if (confirm("Delete permanently?")) {
                await supabase.from('products').delete().eq('id', id);
                loadData();
            }
        }

        // Ticker
        async function loadTicker() {
            const { data } = await supabase.from('admin_settings').select('value').eq('key', 'global_alert').single();
            if (data) document.getElementById('alertInput').value = data.value || '';
        }

        async function updateTicker() {
            const value = document.getElementById('alertInput').value.trim();
            await supabase.from('admin_settings').upsert({ key: 'global_alert', value });
            alert("Ticker updated!");
        }

        // Metrics
        function updateMetrics() {
            document.getElementById('stat-total').textContent = allProducts.length;
            document.getElementById('stat-verified').textContent = allProducts.filter(p => p.is_master).length;
        }

        // Realtime
        function setupRealtime() {
            supabase.channel('admin_live')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'products' }, () => loadData())
                .subscribe();
        }
    </script>
</body>
</html>
