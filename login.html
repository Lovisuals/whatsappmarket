<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="theme.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="h-screen flex items-center justify-center p-4 bg-gray-100 font-ui">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm p-8 border-t-4 border-wa-teal animate-fade">
        <div class="text-center mb-8">
            <div class="inline-block p-3 bg-blue-50 rounded-full text-wa-teal mb-3 text-2xl">🛡️</div>
            <h1 class="text-2xl font-bold text-gray-800">Admin Portal</h1>
            <p class="text-xs text-semantic-muted uppercase tracking-widest mt-1">Authorized Personnel Only</p>
        </div>
        <form id="loginForm" class="space-y-5">
            <div><label class="block text-xs font-bold text-gray-500 uppercase mb-1">Email</label><input type="email" id="email" class="w-full bg-gray-50 border border-gray-300 p-3 rounded-lg focus:border-wa-teal outline-none transition" placeholder="admin@market.ng" required></div>
            <div><label class="block text-xs font-bold text-gray-500 uppercase mb-1">Password</label><input type="password" id="password" class="w-full bg-gray-50 border border-gray-300 p-3 rounded-lg focus:border-wa-teal outline-none transition" placeholder="••••••••" required></div>
            <div id="errorBox" class="hidden bg-red-50 text-semantic-danger text-xs p-3 rounded-lg text-center border border-red-100 font-bold"></div>
            <button type="submit" id="submitBtn" class="tap w-full bg-wa-teal text-white font-bold py-3.5 rounded-lg hover:bg-wa-dark transition shadow-lg">SECURE LOGIN</button>
        </form>
        <p class="text-center mt-6 text-[10px] text-semantic-muted">System Activity Logged • IP Recorded</p>
    </div>
    <script>
        const supabase = window.supabase.createClient('https://vimovhpweucvperwhyzi.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZpbW92aHB3ZXVjdnBlcndoeXppIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY0ODE1MjUsImV4cCI6MjA4MjA1NzUyNX0.u6KDe2RCwCcWdClkGA61q2LORqzmPU0KNP9tZTZfOfc');
        (async()=>{ const {data:{session}} = await supabase.auth.getSession(); if(session) checkAdminStatus(session.user.id); })();
        document.getElementById('loginForm').addEventListener('submit', async(e)=>{
            e.preventDefault(); const btn=document.getElementById('submitBtn'); btn.innerHTML='<span class="animate-pulse">VERIFYING...</span>'; btn.disabled=true;
            const {data, error} = await supabase.auth.signInWithPassword({email:document.getElementById('email').value, password:document.getElementById('password').value});
            if(error) { showError(error.message); btn.textContent='SECURE LOGIN'; btn.disabled=false; return; }
            await checkAdminStatus(data.user.id);
        });
        async function checkAdminStatus(uid) {
            const {data:admin} = await supabase.from('admins').select('id').eq('id', uid).single();
            if(admin) window.location.href='admin.html';
            else { await supabase.auth.signOut(); showError("Access Denied"); document.getElementById('submitBtn').disabled=false; }
        }
        function showError(msg) { const b=document.getElementById('errorBox'); b.textContent=msg; b.classList.remove('hidden'); document.querySelector('.bg-white').classList.add('animate-shake'); setTimeout(()=>document.querySelector('.bg-white').classList.remove('animate-shake'),500); }
    </script>
</body>
</html>
