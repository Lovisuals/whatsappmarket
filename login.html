<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Login | CampusMarket</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="theme.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-wa-bg h-screen flex items-center justify-center p-4 font-ui select-none overflow-hidden">

    <div class="glass bg-white w-full max-w-sm rounded-[2rem] shadow-2xl overflow-hidden animate-pop">
        <div class="bg-wa-teal p-8 text-white text-center">
            <div class="text-4xl mb-2">🔐</div>
            <h1 class="font-bold text-xl tracking-tight">Admin Gate</h1>
            <p class="text-[10px] opacity-80 uppercase tracking-widest mt-1">CampusMarket NG Control</p>
        </div>

        <form id="loginForm" class="p-8 space-y-6">
            <div id="errorBox" class="hidden bg-red-50 border-l-4 border-red-500 p-3 rounded-md animate-fade">
                <p id="errorMsg" class="text-[11px] text-red-700 font-bold"></p>
            </div>

            <div class="space-y-4">
                <div class="relative">
                    <input type="email" id="email" placeholder="Email Address" required
                        class="w-full bg-gray-50 border border-gray-200 p-4 rounded-2xl text-sm outline-none focus:border-wa-teal transition">
                </div>

                <div class="relative">
                    <input type="password" id="password" placeholder="Admin Password" required
                        class="w-full bg-gray-50 border border-gray-200 p-4 rounded-2xl text-sm outline-none focus:border-wa-teal transition">
                    <button type="button" onclick="togglePasswordVisibility()" 
                        class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-wa-teal transition">
                        <span id="eyeOpen">👁️</span>
                        <span id="eyeClosed" class="hidden">🙈</span>
                    </button>
                </div>
            </div>

            <button type="submit" id="submitBtn" 
                class="tap w-full bg-wa-teal text-white py-4 rounded-2xl font-bold uppercase text-xs tracking-widest shadow-lg active:scale-95 transition">
                SECURE LOGIN
            </button>

            <div class="text-center">
                <button type="button" onclick="toggleForgot()" class="text-[10px] font-bold text-gray-400 uppercase hover:text-wa-teal transition">
                    Forgot Password?
                </button>
            </div>
        </form>

        <div id="forgotPanel" class="hidden p-8 border-t border-gray-100 bg-gray-50 text-center animate-fade">
            <p class="text-[11px] text-gray-500 mb-4">Password resets must be handled manually by the System Owner for security.</p>
            <button onclick="toggleForgot()" class="text-[10px] font-bold text-wa-teal uppercase">Back to Login</button>
        </div>
    </div>

    <script>
        const supabase = window.initSupabase?.() || null;

        // 1. AUTO-CHECK SESSION ON LOAD
        (async function checkSession() {
            if (!supabase) return;
            const { data: { session } } = await supabase.auth.getSession();
            if (session) await checkAdminStatus(session.user.id);
        })();

        // 2. LOGIN HANDLER
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            hideError();
            btn.disabled = true;
            btn.innerText = 'VERIFYING...';

            try {
                const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                
                if (error) throw error;
                if (data.user) await checkAdminStatus(data.user.id);

            } catch (err) {
                showError(err.message || "Invalid credentials");
                btn.disabled = false;
                btn.innerText = 'SECURE LOGIN';
            }
        });

        // 3. WHITELIST VERIFICATION
        async function checkAdminStatus(uid) {
            const { data, error } = await supabase
                .from('admins')
                .select('id')
                .eq('id', uid)
                .maybeSingle();

            if (data && !error) {
                // Success: Redirect to Dashboard
                window.location.href = 'admin.html';
            } else {
                // Failure: Not in the admins table
                await supabase.auth.signOut();
                showError("ACCESS DENIED: Your account is not on the Admin Whitelist.");
                const btn = document.getElementById('submitBtn');
                btn.disabled = false;
                btn.innerText = 'SECURE LOGIN';
            }
        }

        // 4. UI UTILS
        function togglePasswordVisibility() {
            const input = document.getElementById('password');
            const eyeOpen = document.getElementById('eyeOpen');
            const eyeClosed = document.getElementById('eyeClosed');

            if (input.type === 'password') {
                input.type = 'text';
                eyeOpen.classList.add('hidden');
                eyeClosed.classList.remove('hidden');
            } else {
                input.type = 'password';
                eyeOpen.classList.remove('hidden');
                eyeClosed.classList.add('hidden');
            }
            input.focus();
        }

        function toggleForgot() {
            document.getElementById('forgotPanel').classList.toggle('hidden');
            document.getElementById('loginForm').classList.toggle('hidden');
        }

        function showError(msg) {
            const box = document.getElementById('errorBox');
            document.getElementById('errorMsg').innerText = msg;
            box.classList.remove('hidden');
        }

        function hideError() {
            document.getElementById('errorBox').classList.add('hidden');
        }
    </script>
</body>
</html>
