<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Campus Market | Nigeria</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23008069%22/><path d=%22M30 35h5l7 30h30l7-22H38%22 fill=%22none%22 stroke=%22white%22 stroke-width=%226%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/><circle cx=%2245%22 cy=%2275%22 r=%225%22 fill=%22white%22/><circle cx=%2270%22 cy=%2275%22 r=%225%22 fill=%22white%22/><path d=%22M75 15c-5 0-9 4-9 9 0 2 1 4 2 5l-2 7 8-2c2 1 4 1 5 1 5 0 9-4 9-9s-4-9-9-9z%22 fill=%22%2325D366%22/></svg>">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="theme.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="select-none text-gray-800 font-ui bg-wa-bg pb-24">

    <div id="adBar" class="hidden marquee-container"><div id="adTrack" class="marquee-track"></div></div>

    <header class="bg-wa-teal text-white pt-4 pb-2 sticky top-0 z-40 shadow-lg backdrop-blur-md bg-opacity-95">
        <div class="flex justify-between items-center px-4 mb-4">
            <h1 class="font-bold text-xl tracking-tight">
                CampusMarket <span class="text-[10px] bg-white text-wa-teal px-1.5 py-0.5 rounded font-extrabold">NG</span>
            </h1>
            <div class="flex items-center gap-2">
                <button id="adminGateBtn" class="opacity-10 hover:opacity-100 text-[8px] text-white transition">ADMIN</button>
                <button id="premiumBtn" class="tap bg-white/20 backdrop-blur-md text-white px-3 py-1 rounded-full text-[10px] font-bold border border-white/30 flex items-center gap-1">
                    👑 <span>PREMIUM</span>
                </button>
            </div>
        </div>
        <div class="flex gap-3 overflow-x-auto px-4 pb-2 scrollbar-hide" id="campusList"></div>
    </header>

    <div id="filterBar" class="bg-white p-4 shadow-md border-b border-gray-100 sticky top-[110px] z-30">
        <input type="text" id="searchInput" placeholder="Search items..." class="w-full bg-gray-100 p-3 rounded-xl text-sm mb-3 outline-none focus:ring-2 focus:ring-wa-teal transition">
        <div class="flex gap-2">
            <button data-filter="All" class="type-btn tap flex-1 bg-wa-teal text-white py-2.5 rounded-full text-xs font-bold shadow-sm">ALL</button>
            <button data-filter="Physical" class="type-btn tap flex-1 bg-gray-50 border border-gray-200 py-2.5 rounded-full text-xs font-bold text-gray-400">PHYSICAL</button>
            <button data-filter="Digital" class="type-btn tap flex-1 bg-gray-50 border border-gray-200 py-2.5 rounded-full text-xs font-bold text-gray-400">DIGITAL</button>
        </div>
    </div>

    <main id="feed" class="p-3 grid grid-cols-2 md:grid-cols-4 gap-3 min-h-[60vh]"></main>

    <button id="addBtn" class="fab fixed bottom-6 right-6 bg-wa-teal text-white w-14 h-14 rounded-2xl flex items-center justify-center text-3xl shadow-xl active:scale-90 transition transform z-50">
        <span>+</span>
    </button>

    <!-- Admin Overlay -->
    <div id="adminOverlay" class="hidden fixed inset-0 bg-black/80 z-[60] backdrop-blur-md p-4 overflow-y-auto">
        <div class="bg-white rounded-[2rem] w-full max-w-4xl mx-auto overflow-hidden shadow-2xl animate-pop">
            <div class="bg-wa-teal p-6 text-white flex justify-between items-center">
                <h2 class="font-bold text-lg uppercase tracking-tight">Admin Command Center</h2>
                <div class="flex gap-3">
                    <button onclick="handleLogout()" class="bg-red-500 text-white px-4 py-1.5 rounded-xl text-[10px] font-bold uppercase">Logout</button>
                    <button onclick="closeModal('adminOverlay')" class="text-2xl">&times;</button>
                </div>
            </div>
            <div class="p-6">
                <div class="grid grid-cols-2 gap-4 mb-6">
                    <div class="bg-gray-50 p-4 rounded-2xl border text-center">
                        <p class="text-[10px] font-bold text-gray-400 uppercase">Total Items</p>
                        <p id="stat-total" class="text-2xl font-black text-wa-teal">0</p>
                    </div>
                    <div class="bg-gray-50 p-4 rounded-2xl border text-center">
                        <p class="text-[10px] font-bold text-gray-400 uppercase">Verified</p>
                        <p id="stat-verified" class="text-2xl font-black text-green-500">0</p>
                    </div>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm">
                        <thead class="text-[10px] uppercase text-gray-400 font-bold border-b">
                            <tr><th class="p-3">Product</th><th class="p-3">Contact</th><th class="p-3 text-center">Verify</th><th class="p-3 text-right">Delete</th></tr>
                        </thead>
                        <tbody id="adminTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Login Modal -->
    <div id="loginModal" class="hidden fixed inset-0 bg-black/60 z-[70] flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-[2rem] p-8 w-full max-w-sm shadow-2xl animate-pop">
            <h2 class="text-xl font-bold mb-4 text-center">Admin Verify</h2>
            <form id="loginForm" class="space-y-4">
                <input type="email" id="loginEmail" placeholder="Email" class="w-full p-4 bg-gray-50 rounded-xl outline-none border focus:border-wa-teal">
                <input type="password" id="loginPass" placeholder="Password" class="w-full p-4 bg-gray-50 rounded-xl outline-none border focus:border-wa-teal">
                <button type="submit" id="loginBtn" class="w-full bg-wa-teal text-white py-4 rounded-xl font-bold">ENTER DASHBOARD</button>
                <button type="button" onclick="closeModal('loginModal')" class="w-full text-gray-400 text-[10px] font-bold uppercase tracking-widest mt-2">Cancel</button>
            </form>
        </div>
    </div>

    <!-- Sell Modal (Restored Functionality) -->
    <div id="sellModal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-[2rem] p-8 w-full max-w-sm shadow-2xl animate-pop">
            <h2 class="text-xl font-bold mb-4 text-center">Post New Item</h2>
            <form id="sellForm" class="space-y-4">
                <input type="text" id="title" placeholder="Item Title" class="w-full p-4 bg-gray-50 rounded-xl outline-none border focus:border-wa-teal" required>
                <input type="number" id="price" placeholder="Price (₦)" class="w-full p-4 bg-gray-50 rounded-xl outline-none border focus:border-wa-teal" required>
                <select id="type" class="w-full p-4 bg-gray-50 rounded-xl outline-none border focus:border-wa-teal" required>
                    <option value="Physical">Physical</option>
                    <option value="Digital">Digital</option>
                </select>
                <select id="campusSelect" class="w-full p-4 bg-gray-50 rounded-xl outline-none border focus:border-wa-teal" required>
                    <option value="" disabled selected>Select Campus</option>
                    <option value="UNILAG">UNILAG</option>
                    <option value="UI">UI</option>
                    <option value="OAU">OAU</option>
                    <option value="UNIBEN">UNIBEN</option>
                    <option value="TASUED">TASUED</option>
                    <option value="OOU">OOU</option>
                </select>
                <input type="tel" id="whatsapp" placeholder="WhatsApp Number (234...)" class="w-full p-4 bg-gray-50 rounded-xl outline-none border focus:border-wa-teal" required>
                <button type="submit" class="w-full bg-wa-teal text-white py-4 rounded-xl font-bold">POST ITEM</button>
            </form>
            <button onclick="closeModal('sellModal')" class="w-full text-gray-400 text-[10px] font-bold uppercase tracking-widest mt-4">Cancel</button>
        </div>
    </div>

    <!-- Verified Modal (Restored Functionality) -->
    <div id="verifiedModal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-[2rem] p-8 w-full max-w-sm shadow-2xl animate-pop text-center">
            <div class="text-5xl mb-4">👑</div>
            <h2 class="text-xl font-bold mb-2">Get Verified Badge</h2>
            <p class="text-sm text-gray-500 mb-6">Appear at the top and gain trust</p>
            <button onclick="window.open('https://wa.me/2347068516779?text=I want to get verified on CampusMarket')" class="w-full bg-wa-teal text-white py-4 rounded-xl font-bold">CONTACT ADMIN</button>
            <button onclick="closeModal('verifiedModal')" class="mt-4 text-gray-400 text-xs font-bold uppercase">Later</button>
        </div>
    </div>

    <script>
        const supabase = window.initSupabase?.() || null;
        let allProducts = [];
        let isAdmin = false;

        // UI Utils
        const openModal = id => document.getElementById(id)?.classList.remove('hidden');
        const closeModal = id => document.getElementById(id)?.classList.add('hidden');

        // Add Button Fixed
        document.getElementById('addBtn').onclick = () => openModal('sellModal');

        // Premium Button Fixed
        document.getElementById('premiumBtn').onclick = () => openModal('verifiedModal');

        // Admin Gate Fixed
        document.getElementById('adminGateBtn').onclick = () => isAdmin ? openModal('adminOverlay') : openModal('loginModal');

        // Login Handler (from previous)
        // ... (keep your login logic)

        // Sell Form Submit (Placeholder - add posting logic later)
        document.getElementById('sellForm')?.addEventListener('submit', e => {
            e.preventDefault();
            alert("Posting logic not implemented yet — add Supabase insert here");
            closeModal('sellModal');
        });

        // All other logic from previous (loadMarket, renderFeed, admin, realtime, etc.)
        // Paste your existing script here

    </script>
</body>
</html>
