<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Ops | Admin</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script src="theme.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>body { padding: 1.5rem; }</style>
</head>
<body class="admin-body text-sm bg-gray-100">

    <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
        <div>
            <h1 class="text-2xl font-bold text-gray-800 flex items-center gap-2">🛡️ CAMPUS OPS</h1>
            <p class="text-xs text-green-600 font-bold flex items-center gap-1 mt-1"><span class="w-2 h-2 bg-green-500 rounded-full animate-pulse-slow"></span> SECURE LINK</p>
        </div>
        <div class="flex gap-2">
             <button onclick="viewAuditLogs()" class="bg-blue-800 text-white px-4 py-2 rounded shadow hover:bg-blue-900 font-bold text-xs flex items-center gap-2"><span>🕵️</span> AUDIT LOGS</button>
             <button onclick="viewBlacklist()" class="bg-gray-800 text-white px-4 py-2 rounded shadow hover:bg-black font-bold text-xs flex items-center gap-2"><span>🚫</span> BLACKLIST</button>
             <button onclick="handleLogout()" class="bg-red-100 text-red-600 px-4 py-2 rounded shadow hover:bg-red-200 font-bold text-xs">LOGOUT</button>
        </div>
    </div>

    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
        <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-blue-500"><p class="text-gray-400 text-[10px] font-bold uppercase">Total Posts</p><p id="countTotal" class="text-2xl font-bold">0</p></div>
        <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-yellow-400"><p class="text-gray-400 text-[10px] font-bold uppercase">Verified</p><p id="countVerified" class="text-2xl font-bold">0</p></div>
        <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-green-500"><p class="text-gray-400 text-[10px] font-bold uppercase">Est. Revenue</p><p id="revenue" class="text-xl font-bold text-green-600">₦0</p></div>
        <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-purple-500"><p class="text-gray-400 text-[10px] font-bold uppercase">Audit Tracker</p><p class="text-xl font-bold text-purple-600">ACTIVE</p></div>
    </div>

    <div class="bg-white p-4 rounded-xl shadow-sm mb-6 border border-yellow-200">
        <h3 class="font-bold text-xs text-yellow-600 mb-2">📢 GLOBAL SCROLLING AD</h3>
        <div class="flex gap-2">
            <input id="adInput" class="border p-2 flex-1 rounded text-sm outline-none focus:border-yellow-400" placeholder="Type ad text...">
            <button onclick="updateAd()" class="bg-yellow-500 text-white px-4 rounded font-bold text-xs hover:bg-yellow-600">BROADCAST</button>
            <button onclick="clearAd()" class="bg-gray-100 text-gray-500 px-4 rounded font-bold text-xs hover:bg-gray-200">CLEAR</button>
        </div>
    </div>

    <div class="bg-white rounded-xl shadow overflow-hidden">
        <div class="p-3 bg-gray-50 border-b"><input oninput="search(this.value)" placeholder="🔍 Search items..." class="w-full p-2 bg-white border rounded text-sm outline-none"></div>
        <div class="overflow-x-auto">
            <table class="w-full text-left">
                <thead class="bg-gray-50 border-b text-gray-400 text-[10px] uppercase"><tr><th class="p-3">Item</th><th class="p-3">Info</th><th class="p-3">Seller</th><th class="p-3">Status</th><th class="p-3 text-right">Action</th></tr></thead>
                <tbody id="tableBody" class="divide-y text-gray-600"></tbody>
            </table>
        </div>
    </div>

    <div id="blacklistModal" class="hidden fixed inset-0 bg-black bg-opacity-90 z-50 flex items-center justify-center p-4 backdrop-blur-sm"><div class="bg-white rounded-xl p-6 w-full max-w-md"><div class="flex justify-between mb-4"><h2 class="font-bold text-red-600">🚫 Banned</h2><button onclick="document.getElementById('blacklistModal').classList.add('hidden')">&times;</button></div><ul id="blacklistList" class="max-h-60 overflow-y-auto mb-4 space-y-2 text-xs"></ul></div></div>

    <div id="auditModal" class="hidden fixed inset-0 bg-black bg-opacity-95 z-50 flex flex-col p-4 backdrop-blur-sm">
        <div class="bg-white rounded-xl w-full max-w-6xl mx-auto h-full flex flex-col shadow-2xl overflow-hidden">
            <div class="p-4 border-b bg-gray-50 flex justify-between items-center">
                <div><h2 class="text-lg font-bold text-gray-800">👮 AUDIT VAULT</h2><p class="text-[10px] text-gray-500 font-mono">CONFIDENTIAL: IP & Geo Data</p></div>
                <button onclick="document.getElementById('auditModal').classList.add('hidden')" class="bg-red-100 text-red-600 px-3 py-1 rounded font-bold text-xs">CLOSE</button>
            </div>
            <div class="flex-1 overflow-auto p-4 bg-gray-100">
                <table class="w-full text-left border-collapse bg-white shadow text-xs font-mono"><thead class="bg-gray-800 text-white sticky top-0"><tr><th class="p-2 border">TIME</th><th class="p-2 border">WHATSAPP</th><th class="p-2 border">IP</th><th class="p-2 border">GEO</th><th class="p-2 border">ISP</th><th class="p-2 border">DEVICE</th></tr></thead><tbody id="auditBody" class="divide-y"></tbody></table>
            </div>
        </div>
    </div>
    
    <div id="imgModal" class="hidden fixed inset-0 bg-black bg-opacity-95 z-50 flex items-center justify-center p-4 cursor-pointer" onclick="this.classList.add('hidden')"><img id="modalImg" class="max-h-screen rounded border-4 border-white"></div>

    <audio id="ping" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"></audio>

    <script>
        const supabase = window.supabase.createClient('https://vimovhpweucvperwhyzi.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZpbW92aHB3ZXVjdnBlcndoeXppIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY0ODE1MjUsImV4cCI6MjA4MjA1NzUyNX0.u6KDe2RCwCcWdClkGA61q2LORqzmPU0KNP9tZTZfOfc');
        let data = [];

        (async()=>{
            const {data:{user}} = await supabase.auth.getUser();
            if(!user || !(await supabase.from('admins').select('id').eq('id', user.id).single()).data) return location.href='login.html';
            
            await Promise.all([loadData(), loadAd()]);
            
            supabase.channel('admin').on('postgres_changes',{event:'*',schema:'public',table:'products'}, p=>{
                if(p.eventType==='INSERT') { data.unshift(p.new); document.getElementById('ping').play().catch(()=>{}); render(data, p.new.id); }
                if(p.eventType==='DELETE') { data = data.filter(i=>i.id!==p.old.id); render(data); }
                if(p.eventType==='UPDATE') { const idx=data.findIndex(i=>i.id===p.new.id); if(idx!==-1) data[idx]=p.new; render(data); }
                updateStats();
            }).subscribe();
        })();

        async function loadData() {
            const { data: d } = await supabase.from('products').select('*').order('created_at',{ascending:false});
            data = d || []; updateStats(); render(data);
        }
        async function loadAd() {
            const { data } = await supabase.from('admin_settings').select('value').eq('key','global_alert').single();
            if(data) document.getElementById('adInput').value = data.value;
        }

        function render(items, highId=null) {
            document.getElementById('tableBody').innerHTML = items.map(p => `
                <tr class="hover:bg-blue-50 transition border-b ${p.id===highId?'new-item':''}">
                    <td class="p-3"><img src="${p.image_url}" onclick="showImg('${p.image_url}')" class="w-8 h-8 rounded border object-cover cursor-zoom-in"></td>
                    <td class="p-3"><div class="font-bold text-xs">${p.title}</div><div class="text-[10px] text-gray-500">${p.campus} • ₦${Number(p.price).toLocaleString()}</div></td>
                    <td class="p-3 font-mono text-[10px] text-blue-600">${p.whatsapp_number}</td>
                    <td class="p-3">${p.is_master ? '<span class="bg-yellow-100 text-yellow-800 text-[9px] px-1 rounded border border-yellow-200">👑 VERIFIED</span>' : '<span class="bg-gray-100 text-gray-500 text-[9px] px-1 rounded">USER</span>'}</td>
                    <td class="p-3 text-right flex justify-end gap-1">
                        <button onclick="toggle('${p.id}',${!p.is_master})" class="text-[9px] border px-2 py-1 rounded font-bold hover:bg-gray-100">${p.is_master?'Unverify':'VERIFY'}</button>
                        <button onclick="ban('${p.whatsapp_number}')" class="text-[9px] bg-gray-800 text-white px-2 py-1 rounded font-bold hover:bg-black">BAN</button>
                    </td>
                </tr>`).join('');
        }
        function updateStats() {
            document.getElementById('countTotal').innerText = data.length;
            const ver = data.filter(i=>i.is_master).length;
            document.getElementById('countVerified').innerText = ver;
            document.getElementById('revenue').innerText = `₦${(ver*5000).toLocaleString()}`;
        }

        async function updateAd() { await supabase.from('admin_settings').update({value:document.getElementById('adInput').value}).eq('key','global_alert'); alert('Live!'); }
        async function clearAd() { document.getElementById('adInput').value=''; updateAd(); }
        async function toggle(id, s) { await supabase.rpc('admin_toggle_verify',{p_id:id,p_status:s}); }
        async function ban(n) { 
            const r=prompt('Reason for Ban? (Items will be purged)'); if(!r) return;
            await supabase.rpc('admin_ban_user',{p_number:n,p_reason:r}); alert('Banned & Purged.'); 
        }
        async function viewAuditLogs() {
            const btn=document.querySelector('button[onclick="viewAuditLogs()"]'); btn.innerText="DECRYPTING...";
            const {data:logs, error} = await supabase.from('audit_trail').select('*').order('created_at',{ascending:false}).limit(100);
            if(error) { alert("Access Denied"); btn.innerHTML='<span>🕵️</span> AUDIT LOGS'; return; }
            document.getElementById('auditBody').innerHTML = logs.map(l => `
                <tr class="hover:bg-yellow-50"><td class="p-2 border text-gray-500">${new Date(l.created_at).toLocaleString()}</td><td class="p-2 border font-bold text-blue-800">${l.whatsapp_number}</td><td class="p-2 border text-red-600">${l.ip_address}</td><td class="p-2 border">${l.geo_location}</td><td class="p-2 border text-gray-600">${l.network_provider}</td><td class="p-2 border text-gray-400 truncate max-w-[100px]" title="${l.device_info}">${l.device_info}</td></tr>
            `).join('');
            document.getElementById('auditModal').classList.remove('hidden'); btn.innerHTML='<span>🕵️</span> AUDIT LOGS';
        }
        async function viewBlacklist() {
            const { data } = await supabase.from('blacklist').select('*');
            document.getElementById('blacklistList').innerHTML = data.map(b=>`<li class="flex justify-between p-2 bg-gray-50 border mb-1 rounded"><span>${b.whatsapp_number} (${b.reason})</span><button onclick="unban('${b.whatsapp_number}')" class="text-blue-600 font-bold">UNBAN</button></li>`).join('');
            document.getElementById('blacklistModal').classList.remove('hidden');
        }
        async function unban(n) { if(confirm('Unban?')) { await supabase.from('blacklist').delete().eq('whatsapp_number',n); viewBlacklist(); } }
        async function handleLogout() { await supabase.auth.signOut(); location.href='login.html'; }
        function search(v) { render(data.filter(i=>JSON.stringify(i).toLowerCase().includes(v.toLowerCase()))); }
        function showImg(src) { document.getElementById('modalImg').src=src; document.getElementById('imgModal').classList.remove('hidden'); }
    </script>
</body>
</html>
