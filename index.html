<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Digital WhatsApp Marketplace | Nigeria</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛍️</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { wa: { teal: '#075E54', light: '#128C7E', green: '#25D366', chat: '#ECE5DD', gold: '#FFD700' } },
                    animation: { 'fade': 'fadeIn 0.4s ease-out forwards', 'marquee': 'marquee 15s linear infinite' },
                    keyframes: {
                        fadeIn: { '0%': { opacity: '0', transform: 'translateY(10px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
                        marquee: { '0%': { transform: 'translateX(100%)' }, '100%': { transform: 'translateX(-100%)' } }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #ECE5DD; font-family: -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
        .fab { box-shadow: 0 4px 15px rgba(37, 211, 102, 0.5); }
        .filter-active { background-color: #128C7E !important; color: white !important; border-color: #128C7E !important; }
    </style>
</head>
<body class="pb-32 select-none">

    <div id="adBar" class="hidden bg-yellow-100 border-b border-yellow-200 text-yellow-900 text-xs font-bold py-2 overflow-hidden relative whitespace-nowrap">
        <div id="adText" class="inline-block animate-marquee pl-[100%]">Loading Ad...</div>
    </div>

    <header class="bg-wa-teal text-white p-4 sticky top-0 z-50 shadow-lg flex justify-between items-center">
        <div>
            <h1 class="font-bold text-lg tracking-wide uppercase flex items-center gap-2">
                MARKETPLACE <span class="text-xs bg-white text-wa-teal px-1 rounded font-extrabold">NG</span>
            </h1>
            <div class="flex items-center gap-1 opacity-90">
                <span class="w-2 h-2 bg-green-400 rounded-full animate-pulse"></span>
                <p class="text-[10px] font-medium">LIVE FEED</p>
            </div>
        </div>
        
        <div class="flex gap-2">
            <button onclick="document.getElementById('verifiedModal').classList.remove('hidden')" class="bg-wa-gold text-wa-teal px-3 py-1.5 rounded-full text-[10px] font-bold shadow animate-pulse border border-yellow-500 flex items-center gap-1">
                <span>👑</span> GO PREMIUM
            </button>
            <button onclick="toggleFilter()" class="text-xs font-bold bg-black bg-opacity-20 border border-white border-opacity-20 px-3 py-1.5 rounded-full hover:bg-opacity-40 transition backdrop-blur-sm">
                FILTER
            </button>
        </div>
    </header>

    <div id="filterBar" class="hidden bg-white p-4 shadow-md border-b border-gray-200 sticky top-[60px] z-40">
        <input type="text" id="searchInput" placeholder="Search phones, courses..." class="w-full bg-gray-100 p-3 rounded-lg text-sm mb-3 focus:outline-none focus:ring-2 focus:ring-wa-light transition">
        <div class="flex gap-2">
            <button id="btnAll" onclick="filterFeed('All')" class="filter-btn flex-1 bg-gray-50 border border-gray-200 py-2 rounded-lg text-xs font-bold text-gray-600 transition filter-active">ALL</button>
            <button id="btnPhys" onclick="filterFeed('Physical')" class="filter-btn flex-1 bg-gray-50 border border-gray-200 py-2 rounded-lg text-xs font-bold text-gray-600 transition">PHYSICAL</button>
            <button id="btnDigi" onclick="filterFeed('Digital')" class="filter-btn flex-1 bg-gray-50 border border-gray-200 py-2 rounded-lg text-xs font-bold text-gray-600 transition">DIGITAL</button>
        </div>
    </div>

    <main id="feed" class="p-3 grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 min-h-[50vh]">
        <div class="col-span-full flex flex-col items-center justify-center mt-20 opacity-60">
            <div class="w-10 h-10 border-4 border-wa-teal border-t-transparent rounded-full animate-spin"></div>
            <p class="text-xs mt-3 font-bold text-wa-teal tracking-widest">CONNECTING...</p>
        </div>
    </main>

    <button onclick="document.getElementById('sellModal').classList.remove('hidden')" class="fab fixed bottom-8 right-6 bg-wa-green text-white w-16 h-16 rounded-full flex items-center justify-center text-4xl shadow-xl z-50 active:scale-90 transition-transform">
        <span class="mb-1">+</span>
    </button>

    <div id="verifiedModal" class="hidden fixed inset-0 bg-black bg-opacity-80 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl w-full max-w-sm overflow-hidden shadow-2xl relative">
            <div class="bg-wa-gold p-6 text-center">
                <div class="text-5xl mb-2">👑</div>
                <h2 class="font-bold text-2xl text-yellow-900">Get Verified</h2>
                <p class="text-yellow-800 text-xs font-bold uppercase tracking-wider">Business & Power Sellers</p>
            </div>
            
            <div class="p-6 space-y-4">
                <ul class="space-y-3">
                    <li class="flex items-center gap-3">
                        <span class="bg-green-100 text-green-600 rounded-full p-1"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg></span>
                        <span class="text-sm text-gray-700">Post <b class="text-black">15 Items</b> per day (vs 3)</span>
                    </li>
                    <li class="flex items-center gap-3">
                        <span class="bg-green-100 text-green-600 rounded-full p-1"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg></span>
                        <span class="text-sm text-gray-700">Get the <b class="bg-wa-teal text-white text-[10px] px-1 rounded">★ VERIFIED</b> Badge</span>
                    </li>
                    <li class="flex items-center gap-3">
                        <span class="bg-green-100 text-green-600 rounded-full p-1"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg></span>
                        <span class="text-sm text-gray-700">Items appear <b class="text-black">First</b> in results</span>
                    </li>
                </ul>

                <div class="bg-gray-50 p-3 rounded-lg text-center border border-gray-200">
                    <p class="text-xs text-gray-500 mb-1">Lifetime Access</p>
                    <p class="text-2xl font-bold text-gray-800">₦5,000</p>
                </div>

                <a id="waLink" href="#" target="_blank" class="block w-full bg-wa-green text-white py-3 rounded-xl font-bold text-center shadow-lg hover:bg-green-600 transition">
                    CHAT ADMIN TO PAY
                </a>
                
                <button onclick="document.getElementById('verifiedModal').classList.add('hidden')" class="w-full text-gray-400 text-xs mt-2 hover:text-gray-600">Maybe Later</button>
            </div>
        </div>
    </div>

    <div id="sellModal" class="hidden fixed inset-0 bg-black bg-opacity-80 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl w-full max-w-sm overflow-hidden shadow-2xl relative">
            <div class="bg-wa-teal p-4 text-white flex justify-between items-center">
                <h2 class="font-bold tracking-wide">NEW LISTING</h2>
                <button onclick="document.getElementById('sellModal').classList.add('hidden')" class="text-2xl opacity-70 hover:opacity-100">&times;</button>
            </div>
            <form id="sellForm" class="p-5 space-y-4 max-h-[80vh] overflow-y-auto">
                <div class="relative w-full h-36 bg-gray-50 border-2 border-dashed border-gray-300 rounded-xl flex flex-col items-center justify-center cursor-pointer hover:bg-gray-100 transition overflow-hidden" onclick="document.getElementById('fileInput').click()">
                    <input type="file" id="fileInput" accept="image/*" class="hidden">
                    <img id="imagePreview" class="hidden absolute inset-0 w-full h-full object-cover">
                    <div id="uploadPlaceholder" class="text-center p-4">
                        <p class="text-3xl text-gray-300 mb-1">📷</p>
                        <span class="text-xs text-gray-500 font-bold uppercase">Add Photo (Max 2MB)</span>
                    </div>
                </div>
                <div class="space-y-3">
                    <input type="text" id="title" placeholder="Item Name" class="w-full bg-gray-50 border border-gray-200 rounded-lg p-3 text-sm focus:border-wa-teal focus:outline-none" required>
                    <div class="flex gap-3">
                        <input type="number" id="price" placeholder="Price (₦)" class="flex-1 bg-gray-50 border border-gray-200 rounded-lg p-3 text-sm focus:border-wa-teal focus:outline-none" required inputmode="numeric">
                        <select id="type" class="flex-1 bg-gray-50 border border-gray-200 rounded-lg p-3 text-sm">
                            <option value="Physical">Physical</option>
                            <option value="Digital">Digital</option>
                        </select>
                    </div>
                    <input type="tel" id="whatsapp" placeholder="WhatsApp (e.g. 23480...)" class="w-full bg-gray-50 border border-gray-200 rounded-lg p-3 text-sm focus:border-wa-teal focus:outline-none" required>
                    <div class="pt-2 border-t border-gray-100">
                        <label class="text-[10px] font-bold text-gray-300 uppercase tracking-widest">Verified PIN (Optional)</label>
                        <input type="password" id="masterPin" placeholder="Business Code" class="w-full bg-gray-50 border border-gray-200 rounded-lg p-2 text-xs focus:border-wa-gold focus:outline-none">
                    </div>
                </div>
                <button type="submit" class="w-full bg-wa-light text-white py-4 rounded-xl font-bold shadow-lg hover:bg-wa-teal transition transform active:scale-95 text-sm tracking-wide">POST TO MARKET</button>
            </form>
        </div>
    </div>

    <a href="login.html" class="fixed bottom-2 left-2 z-0 opacity-10 hover:opacity-100 transition-opacity duration-300 p-2" title="Admin">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" /></svg>
    </a>

    <script>
        const SUPABASE_URL = 'https://vimovhpweucvperwhyzi.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZpbW92aHB3ZXVjdnBlcndoeXppIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY0ODE1MjUsImV4cCI6MjA4MjA1NzUyNX0.u6KDe2RCwCcWdClkGA61q2LORqzmPU0KNP9tZTZfOfc';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // --- 0. CONFIG: ADMIN WHATSAPP ---
        const ADMIN_WHATSAPP = "2348000000000"; // <--- CHANGE THIS TO YOUR NUMBER

        let allProducts = [];
        let currentFilter = 'All';

        async function init() {
            // Setup WA Link
            document.getElementById('waLink').href = `https://wa.me/${ADMIN_WHATSAPP}?text=Hello%20Admin,%20I%20want%20to%20pay%20N5000%20for%20Verified%20Business%20Status%20on%20Marketplace.`;

            await loadMarket();
            loadAd();

            // Realtime Feed
            supabase.channel('public-feed')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'products' }, payload => {
                    allProducts.unshift(payload.new);
                    filterFeed(currentFilter);
                    const card = document.querySelector('#feed > div');
                    if(card) card.classList.add('animate-flash');
                })
                .subscribe();
            
            // Realtime Ad Updates
            supabase.channel('ad-channel')
                .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'admin_settings', filter: "key=eq.global_alert" }, payload => {
                    updateAd(payload.new.value);
                })
                .subscribe();
        }

        async function loadAd() {
            const { data } = await supabase.from('admin_settings').select('value').eq('key', 'global_alert').single();
            if(data) updateAd(data.value);
        }

        function updateAd(text) {
            const bar = document.getElementById('adBar');
            const txt = document.getElementById('adText');
            if (text && text.trim() !== "") {
                bar.classList.remove('hidden');
                txt.textContent = text;
            } else {
                bar.classList.add('hidden');
            }
        }

        async function loadMarket() {
            const { data, error } = await supabase.from('products').select('*').order('created_at', { ascending: false });
            if (error) return;
            allProducts = [...data.filter(i => i.is_master), ...data.filter(i => !i.is_master)];
            filterFeed(currentFilter);
        }

        function renderFeed(items) {
            const feed = document.getElementById('feed');
            if (items.length === 0) {
                feed.innerHTML = '<div class="col-span-full text-center mt-10 text-gray-400 text-sm">No items found.</div>';
                return;
            }
            feed.innerHTML = '';
            items.forEach((item, i) => {
                const isMaster = item.is_master;
                const badge = isMaster ? '<div class="absolute top-0 left-0 bg-wa-teal text-white text-[10px] font-bold px-2 py-1 rounded-br-lg z-10 shadow">★ VERIFIED</div>' : '';
                const msg = `Hi, I saw *${item.title}* on the Marketplace.`;
                const link = `https://wa.me/${item.whatsapp_number}?text=${encodeURIComponent(msg)}`;
                
                feed.innerHTML += `
                    <div class="bg-white rounded-xl shadow-sm overflow-hidden flex flex-col relative ${isMaster ? 'border-2 border-wa-teal' : 'border border-gray-100'} animate-fade" style="animation-delay: ${Math.min(i * 50, 1000)}ms">
                        ${badge}
                        <div class="h-36 bg-gray-100 relative">
                            <img src="${item.image_url}" class="w-full h-full object-cover" loading="lazy">
                        </div>
                        <div class="p-3 flex-1 flex flex-col">
                            <h3 class="font-bold text-gray-800 text-sm line-clamp-2">${item.title}</h3>
                            <p class="text-lg font-extrabold text-gray-900 mt-1">₦${parseInt(item.price).toLocaleString()}</p>
                            <a href="${link}" class="mt-auto w-full bg-green-50 text-green-700 border border-green-200 py-2 rounded-lg text-xs font-bold text-center hover:bg-green-100 transition">
                                CHAT SELLER
                            </a>
                        </div>
                    </div>
                `;
            });
        }

        window.filterFeed = function(type) {
            currentFilter = type;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('filter-active'));
            if(type === 'All') document.getElementById('btnAll').classList.add('filter-active');
            else if(type === 'Physical') document.getElementById('btnPhys').classList.add('filter-active');
            else if(type === 'Digital') document.getElementById('btnDigi').classList.add('filter-active');
            const filtered = type === 'All' ? allProducts : allProducts.filter(i => i.item_type === type);
            renderFeed(filtered);
        };

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = allProducts.filter(p => p.title.toLowerCase().includes(term));
            renderFeed(filtered);
        });

        document.getElementById('sellForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const originalText = btn.innerText;
            btn.innerText = "PROCESSING...";
            btn.disabled = true;

            try {
                const file = document.getElementById('fileInput').files[0];
                if (file && file.size > 2 * 1024 * 1024) throw new Error("Image file is too large! Max size is 2MB.");
                let imgUrl = 'https://placehold.co/400x300/128C7E/FFFFFF?text=No+Image';
                if (file) {
                    const fileName = `${Date.now()}_${Math.random().toString(36).substr(2, 9)}`;
                    const { error: upErr } = await supabase.storage.from('item-images').upload(fileName, file);
                    if (upErr) throw upErr;
                    imgUrl = supabase.storage.from('item-images').getPublicUrl(fileName).data.publicUrl;
                }
                const { error } = await supabase.rpc('post_market_item', {
                    p_title: document.getElementById('title').value,
                    p_price: document.getElementById('price').value,
                    p_type: document.getElementById('type').value,
                    p_whatsapp: document.getElementById('whatsapp').value.replace(/[^0-9]/g, ''),
                    p_image: imgUrl,
                    p_pin: document.getElementById('masterPin').value
                });
                if (error) throw error;
                alert("Item Posted Successfully!");
                document.getElementById('sellModal').classList.add('hidden');
                e.target.reset();
                document.getElementById('imagePreview').classList.add('hidden');
                document.getElementById('uploadPlaceholder').classList.remove('hidden');
            } catch (err) {
                alert("Error: " + err.message);
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        });

        document.getElementById('fileInput').addEventListener('change', (e) => {
            if (e.target.files[0]) {
                document.getElementById('imagePreview').src = URL.createObjectURL(e.target.files[0]);
                document.getElementById('imagePreview').classList.remove('hidden');
                document.getElementById('uploadPlaceholder').classList.add('hidden');
            }
        });
        function toggleFilter() { document.getElementById('filterBar').classList.toggle('hidden'); }
        init();
    </script>
</body>
</html>
