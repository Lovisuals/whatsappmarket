<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CampusMarket NG | Unified</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="theme.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-wa-bg font-ui select-none pb-20">

    <header class="bg-wa-teal text-white p-4 sticky top-0 z-40 shadow-lg">
        <div class="flex justify-between items-center max-w-5xl mx-auto">
            <h1 class="font-bold text-xl tracking-tight">CampusMarket <span class="text-[10px] bg-white text-wa-teal px-1 rounded">NG</span></h1>
            <div id="authButtons" class="flex gap-2">
                </div>
        </div>
    </header>

    <main id="feed" class="p-3 grid grid-cols-2 md:grid-cols-4 gap-3 max-w-5xl mx-auto min-h-screen"></main>

    <div id="adminOverlay" class="hidden fixed inset-0 bg-black/80 z-50 backdrop-blur-sm p-4 overflow-y-auto">
        <div class="bg-white rounded-3xl w-full max-w-4xl mx-auto overflow-hidden shadow-2xl animate-pop">
            <div class="bg-wa-teal p-6 text-white flex justify-between items-center">
                <div>
                    <h2 class="text-2xl font-black uppercase italic">Control Center</h2>
                    <p class="text-[10px] opacity-80 font-bold uppercase tracking-widest">Master Admin Privileges Active</p>
                </div>
                <button onclick="toggleAdminUI(false)" class="bg-white/20 hover:bg-white/40 p-2 rounded-full transition">&times;</button>
            </div>
            
            <div class="p-6">
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
                    <div class="bg-gray-50 p-4 rounded-2xl border">
                        <p class="text-[10px] font-bold text-gray-400 uppercase">Total Items</p>
                        <p id="stat-total" class="text-2xl font-black text-wa-teal">0</p>
                    </div>
                    <div class="bg-gray-50 p-4 rounded-2xl border">
                        <p class="text-[10px] font-bold text-gray-400 uppercase">Verified</p>
                        <p id="stat-verified" class="text-2xl font-black text-green-500">0</p>
                    </div>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead class="text-[10px] uppercase text-gray-400 font-bold border-b">
                            <tr><th class="p-3">Product</th><th class="p-3">Contact</th><th class="p-3 text-center">Status</th><th class="p-3 text-right">Action</th></tr>
                        </thead>
                        <tbody id="adminTableBody" class="text-sm"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div id="loginModal" class="hidden fixed inset-0 bg-black/60 z-[60] flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-8 w-full max-w-sm shadow-2xl animate-pop">
            <h2 class="text-xl font-bold mb-6 text-center">Admin Access</h2>
            <form id="loginForm" class="space-y-4">
                <input type="email" id="loginEmail" placeholder="Email" class="w-full p-4 bg-gray-50 rounded-xl outline-none border focus:border-wa-teal transition">
                <input type="password" id="loginPass" placeholder="Password" class="w-full p-4 bg-gray-50 rounded-xl outline-none border focus:border-wa-teal transition">
                <button type="submit" class="w-full bg-wa-teal text-white py-4 rounded-xl font-bold shadow-lg">Verify Identity</button>
                <button type="button" onclick="toggleLoginModal(false)" class="w-full text-gray-400 text-xs font-bold">Cancel</button>
            </form>
        </div>
    </div>

    <script>
        const supabase = window.initSupabase?.() || null;
        let allProducts = [];
        let isAdmin = false;

        // ----- INITIALIZE -----
        (async function init() {
            if (!supabase) return;
            
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                isAdmin = await checkAdminStatus(session.user.id);
            }
            
            renderAuthButtons();
            await loadMarket();
        })();

        // ----- AUTH LOGIC -----
        async function checkAdminStatus(uid) {
            // First-Admin Bootstrap check
            const { count } = await supabase.from('admins').select('*', { count: 'exact', head: true });
            if (count === 0) {
                await supabase.from('admins').insert({ id: uid });
                console.warn("Bootstrap: First Admin created.");
                return true;
            }
            const { data } = await supabase.from('admins').select('id').eq('id', uid).maybeSingle();
            return !!data;
        }

        document.getElementById('loginForm').onsubmit = async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const pass = document.getElementById('loginPass').value;
            
            const { data, error } = await supabase.auth.signInWithPassword({ email, password: pass });
            if (error) return alert(error.message);
            
            isAdmin = await checkAdminStatus(data.user.id);
            toggleLoginModal(false);
            renderAuthButtons();
            if (isAdmin) {
                toggleAdminUI(true);
                await loadAdminData();
            }
        };

        function renderAuthButtons() {
            const container = document.getElementById('authButtons');
            if (isAdmin) {
                container.innerHTML = `<button onclick="toggleAdminUI(true)" class="bg-white/20 text-white px-4 py-1.5 rounded-full text-xs font-bold border border-white/40">DASHBOARD</button>`;
            } else {
                container.innerHTML = `<button onclick="toggleLoginModal(true)" class="opacity-20 hover:opacity-100 transition text-[8px] text-white">ADMIN</button>`;
            }
        }

        // ----- UI TOGGLES -----
        function toggleLoginModal(show) { document.getElementById('loginModal').classList.toggle('hidden', !show); }
        function toggleAdminUI(show) { document.getElementById('adminOverlay').classList.toggle('hidden', !show); if(show) loadAdminData(); }

        // ----- DATA PIPELINE -----
        async function loadMarket() {
            const { data } = await supabase.from('products').select('*').order('created_at', { ascending: false });
            allProducts = data || [];
            renderFeed();
        }

        function renderFeed() {
            const feed = document.getElementById('feed');
            feed.innerHTML = allProducts.map(p => `
                <div class="bg-white rounded-2xl shadow-sm overflow-hidden flex flex-col border border-gray-100">
                    <img src="${p.images?.[0] || 'https://placehold.co/400x300'}" class="h-40 w-full object-cover">
                    <div class="p-3">
                        <h3 class="font-bold text-xs truncate">${p.title}</h3>
                        <p class="text-wa-teal font-black text-sm mt-1">₦${Number(p.price).toLocaleString()}</p>
                        ${p.is_master ? '<span class="text-[8px] bg-green-100 text-green-600 px-2 py-0.5 rounded-full font-bold">VERIFIED</span>' : ''}
                    </div>
                </div>
            `).join('');
        }

        async function loadAdminData() {
            document.getElementById('stat-total').textContent = allProducts.length;
            document.getElementById('stat-verified').textContent = allProducts.filter(p => p.is_master).length;

            const tbody = document.getElementById('adminTableBody');
            tbody.innerHTML = allProducts.map(p => `
                <tr class="border-b hover:bg-gray-50 transition">
                    <td class="p-3 font-bold text-xs">${p.title}</td>
                    <td class="p-3 text-[10px] font-mono">${p.whatsapp_number}</td>
                    <td class="p-3 text-center">
                        <span class="px-3 py-1 rounded-full text-[9px] font-bold ${p.is_master ? 'bg-green-100 text-green-600' : 'bg-gray-100 text-gray-400'}">
                            ${p.is_master ? 'VERIFIED' : 'PENDING'}
                        </span>
                    </td>
                    <td class="p-3 text-right flex gap-2 justify-end">
                        <button onclick="toggleVerify('${p.id}', ${p.is_master})" class="bg-wa-teal text-white p-2 rounded-lg text-[10px]">Verify</button>
                        <button onclick="deleteItem('${p.id}')" class="bg-red-500 text-white p-2 rounded-lg text-[10px]">Delete</button>
                    </td>
                </tr>
            `).join('');
        }

        // ----- ADMIN ACTIONS -----
        async function toggleVerify(id, cur) {
            await supabase.from('products').update({ is_master: !cur }).eq('id', id);
            await loadMarket(); await loadAdminData();
        }

        async function deleteItem(id) {
            if (!confirm("Delete?")) return;
            await supabase.from('products').delete().eq('id', id);
            await loadMarket(); await loadAdminData();
        }
    </script>
</body>
</html>
