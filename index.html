<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Market | Nigeria</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='#008069'/><path d='M30 35h5l7 30h30l7-22H38' fill='none' stroke='white' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/><circle cx='45' cy='75' r='5' fill='white'/><circle cx='70' cy='75' r='5' fill='white'/><path d='M75 15c-5 0-9 4-9 9 0 2 1 4 2 5l-2 7 8-2c2 1 4 1 5 1 5 0 9-4 9-9s-4-9-9-9z' fill='#25D366'/></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="theme.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="select-none text-gray-800 font-ui bg-wa-bg pb-24">
    <header class="bg-wa-teal text-white pt-4 pb-2 sticky top-0 z-40 shadow-lg backdrop-blur-md bg-opacity-95">
        <div class="flex justify-between items-center px-4 mb-4">
            <h1 class="font-bold text-xl tracking-tight">
                CampusMarket <span class="text-[10px] bg-white text-wa-teal px-1.5 py-0.5 rounded font-extrabold">NG</span>
            </h1>
            <div class="flex items-center gap-2">
                <button id="adminGateBtn" onclick="window.handleAdminGate()" class="opacity-20 hover:opacity-100 text-[8px] text-white transition font-bold uppercase">Admin</button>
                <button id="premiumBtn" onclick="window.openModal('verifiedModal')" class="tap bg-white/20 backdrop-blur-md text-white px-3 py-1 rounded-full text-[10px] font-bold border border-white/30 flex items-center gap-1">
                    👑 <span>PREMIUM</span>
                </button>
            </div>
        </div>
        <div class="flex gap-3 overflow-x-auto px-4 pb-2 scrollbar-hide" id="campusList"></div>
    </header>

    <div class="bg-white p-4 shadow-md border-b border-gray-100 sticky top-[110px] z-30">
        <input type="text" id="searchInput" oninput="window.renderFeed()" placeholder="Search items..." class="w-full bg-gray-100 p-3 rounded-xl text-sm mb-3 outline-none focus:ring-2 focus:ring-wa-teal transition">
    </div>

    <main id="feed" class="p-3 grid grid-cols-2 md:grid-cols-4 gap-3 min-h-[60vh]"></main>

    <button id="addBtn" onclick="window.openModal('sellModal')" class="fixed bottom-6 right-6 bg-wa-teal text-white w-14 h-14 rounded-2xl flex items-center justify-center text-3xl shadow-xl active:scale-90 transition transform z-50">+</button>

    <!-- Post Item Modal -->
    <div id="sellModal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-[2rem] p-8 w-full max-w-sm shadow-2xl animate-pop">
            <h2 class="text-xl font-bold mb-4 text-center">Post Item</h2>
            <form id="sellForm" onsubmit="window.handlePostAd(event)" class="space-y-4">
                <input type="text" id="sellTitle" placeholder="Title" class="w-full p-4 bg-gray-50 rounded-xl border outline-none" required>
                <input type="number" id="sellPrice" placeholder="Price (₦)" class="w-full p-4 bg-gray-50 rounded-xl border outline-none" required>
                <select id="sellCampus" class="w-full p-4 bg-gray-50 rounded-xl border outline-none" required></select>
                <input type="tel" id="sellWhatsapp" placeholder="WhatsApp (234...)" class="w-full p-4 bg-gray-50 rounded-xl border outline-none" required>
                <button type="submit" id="postBtn" class="w-full bg-wa-teal text-white py-4 rounded-xl font-bold">POST NOW</button>
            </form>
            <button onclick="window.closeModal('sellModal')" class="w-full text-gray-400 text-[10px] font-bold uppercase mt-4">Cancel</button>
        </div>
    </div>

    <!-- Admin Login Modal -->
    <div id="loginModal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-[2rem] p-8 w-full max-w-sm shadow-2xl animate-pop">
            <h2 class="text-xl font-bold mb-4 text-center">Admin Verify</h2>
            <form id="loginForm" onsubmit="window.handleLogin(event)" class="space-y-4">
                <input type="email" id="loginEmail" placeholder="Email" class="w-full p-4 bg-gray-50 rounded-xl border outline-none" required>
                <input type="password" id="loginPass" placeholder="Password" class="w-full p-4 bg-gray-50 rounded-xl border outline-none" required>
                <button type="submit" id="loginBtn" class="w-full bg-wa-teal text-white py-4 rounded-xl font-bold">ENTER</button>
            </form>
            <button onclick="window.closeModal('loginModal')" class="w-full text-gray-400 text-[10px] font-bold uppercase mt-4">Cancel</button>
        </div>
    </div>

    <!-- Admin Dashboard Modal -->
    <div id="adminOverlay" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-[2rem] p-8 w-full max-w-md shadow-2xl animate-pop">
            <h2 class="text-xl font-bold mb-4 text-center">Admin Dashboard</h2>
            <p class="text-sm text-gray-600 mb-4">Admin tools will appear here.</p>
            <button onclick="window.closeModal('adminOverlay')" class="w-full text-gray-400 text-[10px] font-bold uppercase">Close</button>
        </div>
    </div>

    <!-- Premium Info Modal -->
    <div id="verifiedModal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-[2rem] p-8 w-full max-w-sm shadow-2xl animate-pop">
            <h2 class="text-xl font-bold mb-4 text-center">Premium Member Info</h2>
            <p class="text-sm text-gray-600 mb-4 text-center">Coming Soon! Stay tuned for premium features.</p>
            <button onclick="window.closeModal('verifiedModal')" class="w-full text-gray-400 text-[10px] font-bold uppercase">Close</button>
        </div>
    </div>

    <script>
        // Supabase Initialization
        const supabase = window.initSupabase?.();
        let allProducts = [];
        let isAdmin = false;
        let selectedCampus = 'All';

        // Modal Helpers
        window.openModal = id => {
            const el = document.getElementById(id);
            if (el) el.classList.remove('hidden');
        };
        window.closeModal = id => {
            const el = document.getElementById(id);
            if (el) el.classList.add('hidden');
        };

        // Admin Gate
        window.handleAdminGate = () => {
            if (isAdmin) {
                window.openModal('adminOverlay');
            } else {
                window.openModal('loginModal');
            }
        };

        // User Login (Admin)
        window.handleLogin = async (e) => {
            e.preventDefault();
            try {
                const email = document.getElementById('loginEmail').value;
                const password = document.getElementById('loginPass').value;
                const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                if (error) {
                    window.CampusWatchdog.report('AUTH_ERROR', error.message);
                    return alert(error.message);
                }
                const userId = data.user.id;
                const { data: admin, error: adminErr } = await supabase.from('admins').select('id').eq('id', userId).maybeSingle();
                if (adminErr) {
                    window.CampusWatchdog.report('DB_ERROR', adminErr.message);
                    throw adminErr;
                }
                if (admin) {
                    isAdmin = true;
                    document.getElementById('adminGateBtn').textContent = "DASHBOARD";
                    window.closeModal('loginModal');
                    alert("Welcome Admin");
                } else {
                    await supabase.auth.signOut();
                    alert("Access Denied");
                }
            } catch (err) {
                console.error(err);
            }
        };

        // Load Campus List (Filter Buttons)
        function populateCampusList() {
            const listEl = document.getElementById('campusList');
            listEl.innerHTML = window.CampusConfig.campuses.map(campus => {
                const active = (campus.id === selectedCampus) ? 'bg-wa-teal text-white' : 'bg-white text-wa-teal';
                return `
                    <button onclick="setCampus('${campus.id}')" class="flex flex-col items-center px-3 py-2 rounded-lg mr-2 ${active}">
                        ${campus.logo ? `<img src="${campus.logo}" alt="${campus.name}" class="w-8 h-8 rounded-full mb-1">` : ''}
                        <span class="text-[8px] font-semibold">${campus.name}</span>
                    </button>
                `;
            }).join('');
        }
        window.setCampus = (campusId) => {
            selectedCampus = campusId;
            renderFeed();
            populateCampusList();
        };

        // Fetch and Load Market Data
        async function loadMarket() {
            if (!supabase) return;
            try {
                const { data, error } = await supabase.from('products').select('*').order('created_at', { ascending: false });
                if (error) {
                    window.CampusWatchdog.report('DB_ERROR', error.message);
                    throw error;
                }
                allProducts = data || [];
                window.renderFeed();
            } catch (err) {
                console.error(err);
            }
        }

        // Render Product Feed
        window.renderFeed = () => {
            const feed = document.getElementById('feed');
            const term = (document.getElementById('searchInput').value || "").toLowerCase();
            const filtered = allProducts.filter(p => {
                const matchTitle = p.title.toLowerCase().includes(term);
                const matchCampus = (selectedCampus === 'All') || (p.campus === selectedCampus);
                return matchTitle && matchCampus;
            });
            feed.innerHTML = filtered.map(p => `
                <div class="product-card bg-white rounded-2xl shadow-sm overflow-hidden flex flex-col border border-gray-100 animate-fade">
                    <img src="${p.images?.[0] || 'https://placehold.co/400x300'}" class="h-40 w-full object-cover">
                    <div class="p-3 flex flex-col flex-1">
                        <h3 class="font-bold text-xs truncate">${p.title}</h3>
                        <p class="text-wa-teal font-black text-sm mt-1">₦${Number(p.price).toLocaleString()}</p>
                        ${p.is_master ? '<span class="text-[8px] bg-green-100 text-green-600 px-2 py-0.5 rounded-full font-bold pulse-green mt-1">VERIFIED</span>' : ''}
                        <div class="mt-auto pt-2 text-right">
                            <a href="https://wa.me/${p.whatsapp_number}" target="_blank" rel="noopener noreferrer" class="text-[10px] font-bold text-wa-teal uppercase">Chat to Buy</a>
                        </div>
                    </div>
                </div>
            `).join('');
        };

        // Post New Ad
        window.handlePostAd = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('postBtn');
            btn.textContent = "POSTING...";
            try {
                const payload = {
                    title: document.getElementById('sellTitle').value,
                    price: Number(document.getElementById('sellPrice').value),
                    campus: document.getElementById('sellCampus').value,
                    whatsapp_number: document.getElementById('sellWhatsapp').value,
                    item_type: "Physical",
                    is_master: false
                };
                const { error } = await supabase.from('products').insert([payload]);
                if (error) {
                    window.CampusWatchdog.report('DB_ERROR', error.message);
                    alert(error.message);
                } else {
                    alert("Success!");
                    window.closeModal('sellModal');
                    e.target.reset();
                    await loadMarket();
                }
            } catch (err) {
                console.error(err);
                alert("An error occurred while posting.");
            }
            btn.textContent = "POST NOW";
        };

        // Initialize
        (async () => {
            if (supabase) {
                // Populate campus select
                const campusSelect = document.getElementById('sellCampus');
                const campusOptions = window.CampusConfig.campuses.filter(c => c.id !== 'All');
                campusSelect.innerHTML = campusOptions.map(c => `<option value="${c.id}">${c.name}</option>`).join('');

                // Populate campus filter list
                populateCampusList();

                // Check existing session
                try {
                    const { data: { session }, error } = await supabase.auth.getSession();
                    if (error) throw error;
                    if (session) {
                        const { data: admin, error: adminErr } = await supabase.from('admins').select('id').eq('id', session.user.id).maybeSingle();
                        if (admin) {
                            isAdmin = true;
                            document.getElementById('adminGateBtn').textContent = "DASHBOARD";
                        }
                    }
                } catch (err) {
                    console.error(err);
                }

                await loadMarket();
            }
        })();
    </script>
</body>
</html>
