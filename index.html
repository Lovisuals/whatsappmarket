<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Campus Market | Nigeria</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23008069%22/><path d=%22M30 35h5l7 30h30l7-22H38%22 fill=%22none%22 stroke=%22white%22 stroke-width=%226%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/><circle cx=%2245%22 cy=%2275%22 r=%225%22 fill=%22white%22/><circle cx=%2270%22 cy=%2275%22 r=%225%22 fill=%22white%22/><path d=%22M75 15c-5 0-9 4-9 9 0 2 1 4 2 5l-2 7 8-2c2 1 4 1 5 1 5 0 9-4 9-9s-4-9-9-9z%22 fill=%22%2325D366%22/></svg>">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="theme.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="select-none text-gray-800 font-ui bg-wa-bg pb-24">

    <div id="adBar" class="hidden marquee-container"><div id="adTrack" class="marquee-track"></div></div>

    <header class="bg-wa-teal text-white pt-4 pb-2 sticky top-0 z-40 shadow-lg backdrop-blur-md bg-opacity-95">
        <div class="flex justify-between items-center px-4 mb-4">
            <h1 class="font-bold text-xl tracking-tight flex items-center gap-2">
                CampusMarket <span class="text-[10px] bg-white text-wa-teal px-1.5 py-0.5 rounded font-extrabold shadow-sm">NG</span>
            </h1>
            <div class="flex gap-3 items-center">
                <button id="adminGateBtn" onclick="toggleLoginModal(true)" class="tap text-white/50 hover:text-white text-[10px] font-bold uppercase transition">ADMIN</button>
                <button id="premiumBtn" onclick="document.getElementById('verifiedModal').classList.remove('hidden')" class="tap bg-white/20 backdrop-blur-md text-white px-3 py-1 rounded-full text-[10px] font-bold border border-white/30 flex items-center gap-1">
                    👑 <span>PREMIUM</span>
                </button>
            </div>
        </div>
        <div class="flex gap-3 overflow-x-auto px-4 pb-2 scrollbar-hide" id="campusList"></div>
    </header>

    <div id="filterBar" class="bg-white p-4 shadow-md border-b border-gray-100 sticky top-[110px] z-30">
        <input type="text" id="searchInput" placeholder="Search items..." class="w-full bg-gray-100 p-3 rounded-xl text-sm mb-3 outline-none focus:ring-2 focus:ring-wa-teal transition">
        <div class="flex gap-2">
            <button data-filter="All" class="type-btn tap flex-1 bg-wa-teal text-white py-2.5 rounded-full text-xs font-bold shadow-sm">ALL</button>
            <button data-filter="Physical" class="type-btn tap flex-1 bg-gray-50 border border-gray-200 py-2.5 rounded-full text-xs font-bold text-gray-400">PHYSICAL</button>
            <button data-filter="Digital" class="type-btn tap flex-1 bg-gray-50 border border-gray-200 py-2.5 rounded-full text-xs font-bold text-gray-400">DIGITAL</button>
        </div>
    </div>

    <main id="feed" class="p-3 grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 min-h-[60vh]"></main>

    <button id="addBtn" onclick="document.getElementById('sellModal').classList.remove('hidden')" class="fab fixed bottom-6 right-6 bg-wa-teal text-white w-14 h-14 rounded-2xl flex items-center justify-center text-3xl shadow-xl active:scale-90 transition transform z-50">
        <span>+</span>
    </button>

    <!-- Admin Overlay -->
    <div id="adminOverlay" class="hidden fixed inset-0 bg-black/60 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 backdrop-blur-sm">
        <div class="glass bg-white rounded-t-[2rem] sm:rounded-[1.5rem] w-full max-w-sm overflow-hidden animate-pop">
            <div class="bg-wa-teal p-5 text-white flex justify-between items-center shadow-sm">
                <h2 class="font-bold uppercase text-xs tracking-widest">Post Item</h2>
                <button onclick="document.getElementById('sellModal').classList.add('hidden')" class="text-2xl">&times;</button>
            </div>
            <form id="sellForm" class="p-6 space-y-4 max-h-[70vh] overflow-y-auto">
                <div class="tap w-full bg-gray-50 border-2 border-dashed border-gray-300 rounded-2xl relative overflow-hidden h-48" onclick="document.getElementById('fileInput').click()">
                    <input type="file" id="fileInput" accept="image/*" multiple class="hidden">
                    <div id="uploadPlaceholder" class="absolute inset-0 flex flex-col items-center justify-center text-center">
                        <p class="text-4xl mb-2">📷</p>
                        <span class="text-xs font-bold text-gray-400">TAP TO UPLOAD IMAGES (MAX 3)</span>
                    </div>
                    <div id="previewContainer" class="hidden absolute inset-0 flex gap-2 p-3 overflow-x-auto items-center bg-gray-50"></div>
                </div>
                <input type="text" id="title" placeholder="Item Title" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 text-sm outline-none" required>
                <div class="flex gap-2">
                    <input type="number" id="price" placeholder="₦ Price" class="w-1/2 bg-gray-50 border border-gray-200 rounded-xl p-3 text-sm" required>
                    <select id="type" class="w-1/2 bg-gray-50 border border-gray-200 rounded-xl p-3 text-sm">
                        <option value="Physical">Physical</option>
                        <option value="Digital">Digital</option>
                    </select>
                </div>
                <select id="campusSelect" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 text-sm outline-none" required>
                    <option value="" disabled selected>Select Your Campus</option>
                    <option value="UNILAG">UNILAG</option>
                    <option value="UI">UI Ibadan</option>
                    <option value="OAU">OAU Ife</option>
                    <option value="UNIBEN">UNIBEN</option>
                    <option value="TASUED">TASUED</option>
                    <option value="OOU">OOU</option>
                </select>
                <input type="tel" id="whatsapp" placeholder="WhatsApp Number (e.g. 234...)" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 text-sm" required>
                <button type="submit" id="submitBtn" class="tap w-full bg-wa-teal text-white py-4 rounded-xl font-bold uppercase text-xs tracking-widest shadow-lg">Post Ad Now</button>
            </form>
        </div>
    </div>

    <!-- Verified Modal -->
    <div id="verifiedModal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="glass bg-white rounded-[1.5rem] p-8 w-full max-w-sm text-center animate-pop">
            <h2 class="text-4xl mb-4">👑</h2>
            <h3 class="font-bold text-lg text-wa-teal uppercase tracking-tight">Verified Membership</h3>
            <p class="text-[11px] text-gray-500 my-4">Verified users get a trusted badge and appear at the top.</p>
            <div class="space-y-3">
                <a href="https://wa.me/2347068516779" class="tap block w-full bg-wa-teal text-white py-3.5 rounded-xl font-bold shadow-md">VERIFY NOW (₦5,000)</a>
                <button onclick="document.getElementById('verifiedModal').classList.add('hidden')" class="text-[10px] font-bold text-gray-400 uppercase">Maybe Later</button>
            </div>
        </div>
    </div>

    <script>
        const supabase = window.initSupabase?.() || null;
        let allProducts = [];
        let isAdmin = false;
        let currentFilter = 'All';
        let currentCampus = 'All';
        const campuses = ["All", "UNILAG", "LASU", "UNILORIN", "UI", "OAU", "ABU", "UNIBEN", "UNIPORT"];

        // UI UTILS
        const openModal = id => document.getElementById(id)?.classList.remove('hidden');
        const closeModal = id => document.getElementById(id)?.classList.add('hidden');
        const toggleLoginModal = show => show ? openModal('loginModal') : closeModal('loginModal');
        const toggleAdminUI = show => { show ? openModal('adminOverlay') : closeModal('adminOverlay'); if (show) loadAdminData(); }

        // INITIALIZE
        (async function init() {
            if (!supabase) return;
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                isAdmin = await checkAdminStatus(session.user.id);
                if (isAdmin) document.getElementById('adminGateBtn').textContent = "OPEN DASHBOARD";
            }
            await loadMarket();
            renderCampusList();
            initTicker();
            setupRealtime();
        })();

        async function checkAdminStatus(uid) {
            const { data } = await supabase.from('admins').select('id').eq('id', uid).maybeSingle();
            return !!data;
        }

        // ADMIN BUTTON
        document.getElementById('adminGateBtn').onclick = () => isAdmin ? toggleAdminUI(true) : toggleLoginModal(true);

        // LOGIN HANDLER
        document.getElementById('loginForm').onsubmit = async e => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            btn.textContent = "VERIFYING...";
            const { data, error } = await supabase.auth.signInWithPassword({
                email: document.getElementById('loginEmail').value.trim(),
                password: document.getElementById('loginPass').value
            });
            if (error) { alert(error.message); btn.textContent = "ENTER DASHBOARD"; return; }
            isAdmin = await checkAdminStatus(data.user.id);
            if (isAdmin) { toggleLoginModal(false); toggleAdminUI(true); document.getElementById('adminGateBtn').textContent = "OPEN DASHBOARD"; }
            else { await supabase.auth.signOut(); alert("Not an admin."); btn.textContent = "ENTER DASHBOARD"; }
        };

        async function handleLogout() {
            await supabase.auth.signOut();
            isAdmin = false;
            document.getElementById('adminGateBtn').textContent = "ADMIN";
            toggleAdminUI(false);
        }

        // CAMPUS LIST
        function renderCampusList() {
            const list = document.getElementById('campusList');
            list.innerHTML = campuses.map(c => `
                <button onclick="filterCampus('${c}')" class="flex-none px-4 py-1.5 rounded-full text-[10px] font-bold border transition ${currentCampus === c ? 'bg-wa-teal text-white border-wa-teal' : 'bg-white text-gray-500 border-gray-200'}">
                    ${c}
                </button>
            `).join('');
        }

        function filterCampus(c) {
            currentCampus = c;
            renderCampusList();
            renderFeed();
        }

        // TICKER
        async function initTicker() {
            const { data } = await supabase.from('admin_settings').select('value').eq('key', 'global_alert').single();
            if (data && data.value) {
                document.getElementById('adBar').classList.remove('hidden');
                document.getElementById('adTrack').textContent = data.value;
            }
        }

        // REALTIME
        function setupRealtime() {
            supabase.channel('public_feed')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'products' }, loadMarket)
                .subscribe();
        }

        // MARKET LOGIC
        async function loadMarket() {
            const { data } = await supabase.from('products').select('*').order('created_at', { ascending: false });
            allProducts = data || [];
            renderFeed();
        }

        function renderFeed() {
            const feed = document.getElementById('feed');
            const term = (document.getElementById('searchInput')?.value || '').toLowerCase();

            const filtered = allProducts.filter(p => {
                const matchesType = currentFilter === 'All' || p.item_type === currentFilter;
                const matchesCampus = currentCampus === 'All' || p.campus === currentCampus;
                const matchesSearch = p.title.toLowerCase().includes(term);
                return matchesType && matchesCampus && matchesSearch;
            });

            if (filtered.length === 0) {
                feed.innerHTML = '<div class="col-span-full text-center mt-20 text-gray-500 text-sm">No items found.</div>';
                return;
            }

            feed.innerHTML = filtered.map(p => `
                <div class="product-card bg-white rounded-2xl shadow-sm overflow-hidden flex flex-col animate-fade">
                    <div class="relative">
                        <img src="${p.images?.[0] || 'https://placehold.co/400x300'}" class="h-40 w-full object-cover">
                        ${p.is_master ? '<div class="absolute top-2 right-2 bg-green-500 text-white text-[8px] px-2 py-1 rounded-full font-bold shadow-lg">VERIFIED ✓</div>' : ''}
                    </div>
                    <div class="p-3">
                        <h3 class="font-bold text-xs truncate text-gray-800">${p.title}</h3>
                        <p class="text-[10px] text-gray-400 font-bold uppercase mt-0.5">${p.campus}</p>
                        <div class="flex justify-between items-center mt-2">
                            <p class="text-wa-teal font-black text-sm">₦${Number(p.price).toLocaleString()}</p>
                            <a href="https://wa.me/${p.whatsapp_number.replace(/\D/g,'')}?text=Hi, I'm interested in your ${encodeURIComponent(p.title)}" class="bg-wa-teal/10 p-1.5 rounded-lg">
                                <svg class="w-4 h-4 text-wa-teal" fill="currentColor" viewBox="0 0 24 24"><path d="M12.031 6.172c-3.181 0-5.767 2.586-5.768 5.766-.001 1.298.38 2.27 1.025 3.128l-.904 3.313 3.4-.892c.791.433 1.554.679 2.253.679 3.18 0 5.765-2.586 5.766-5.767.001-3.181-2.585-5.727-5.772-5.727zm3.532 8.163c-.145.408-.84.77-1.154.819-.314.05-1.428.136-2.51-.762-1.082-.899-1.785-2.05-1.944-2.254-.158-.204-1.285-1.708-1.285-3.26s.819-2.28 1.111-2.586c.291-.306.634-.383.846-.383.213 0 .426.001.611.01.185.01.435-.07.681.52.246.591.841 2.046.915 2.197.074.151.123.327.023.527-.1.2-.15.326-.3.5-.15.174-.316.388-.451.52-.15.151-.307.316-.132.613.175.297.778 1.284 1.669 2.076.891.791 1.644 1.037 1.94 1.187.296.15.469.124.644-.077.175-.201.751-.873.951-1.173.2-.301.4-.251.676-.151.275.1.1.201 1.751.874 1.651.873 1.838.941 1.913 1.016.075.075.226.439.081.847z"/></svg>
                            </a>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // IMAGE COMPRESSION
        async function compressImage(file) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 1024;
                    let { width, height } = img;
                    if (width > MAX_WIDTH) { height *= (MAX_WIDTH / width); width = MAX_WIDTH; }
                    canvas.width = width; canvas.height = height;
                    canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                    canvas.toBlob(blob => {
                        resolve(new File([blob], file.name, { type: 'image/jpeg' }));
                    }, 'image/jpeg', 0.7);
                };
                img.src = URL.createObjectURL(file);
            });
        }

        // ADMIN DATA
        async function loadAdminData() {
            await loadMarket();
            document.getElementById('stat-total').textContent = allProducts.length;
            document.getElementById('stat-verified').textContent = allProducts.filter(p => p.is_master).length;
            const tbody = document.getElementById('adminTableBody');
            tbody.innerHTML = allProducts.map(p => `
                <tr class="border-b">
                    <td class="p-3 font-bold text-xs">${p.title}</td>
                    <td class="p-3 text-[10px] font-mono">${p.whatsapp_number}</td>
                    <td class="p-3 text-center">
                        <button onclick="toggleVerify('${p.id}', ${p.is_master})" class="px-3 py-1 rounded-full text-[9px] font-bold ${p.is_master ? 'bg-green-100 text-green-600' : 'bg-gray-100 text-gray-400'}">
                            ${p.is_master ? 'YES' : 'NO'}
                        </button>
                    </td>
                    <td class="p-3 text-right">
                        <button onclick="deleteItem('${p.id}')" class="text-red-500 text-lg">🗑️</button>
                    </td>
                </tr>
            `).join('');
        }

        async function toggleVerify(id, cur) {
            await supabase.from('products').update({ is_master: !cur }).eq('id', id);
            await loadMarket(); loadAdminData();
        }

        async function deleteItem(id) {
            if (!confirm("Delete permanently?")) return;
            await supabase.from('products').delete().eq('id', id);
            await loadMarket(); loadAdminData();
        }

        // Global UI Toggles
        window.toggleLoginModal = (show) => document.getElementById('loginModal').classList.toggle('hidden', !show);
        window.toggleAdminUI = (show) => {
            document.getElementById('adminOverlay').classList.toggle('hidden', !show);
            if (show) loadAdminData();
        }
        window.openModal = (id) => document.getElementById(id)?.classList.remove('hidden');
        window.closeModal = (id) => document.getElementById(id)?.classList.add('hidden');
    </script>
</body>
</html>
