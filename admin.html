<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mission Control | Admin</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛡️</text></svg>">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        body { background-color: #f3f4f6; font-family: -apple-system, sans-serif; }
        .new-item { animation: flash 2s ease-out; }
        @keyframes flash { 0% { background-color: #bbf7d0; } 100% { background-color: white; } }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        /* Modal Backdrop */
        .backdrop-blur-sm { backdrop-filter: blur(4px); }
    </style>
</head>
<body class="p-4 md:p-6 text-sm">

    <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
        <div>
            <h1 class="text-2xl font-bold text-gray-800 flex items-center gap-2">
                🛡️ COMMAND CENTER
            </h1>
            <p class="text-xs text-green-600 font-bold flex items-center gap-1 mt-1">
                <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span> SOCKET CONNECTED
            </p>
        </div>
        <div class="flex gap-2">
             <button onclick="viewBlacklist()" class="bg-gray-800 text-white px-4 py-2 rounded shadow hover:bg-black font-bold text-xs flex items-center gap-2">
                <span>🚫</span> VIEW BANNED
             </button>
             <button onclick="handleLogout()" class="bg-red-100 text-red-600 px-4 py-2 rounded shadow hover:bg-red-200 font-bold text-xs">
                LOGOUT
             </button>
        </div>
    </div>

    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
        <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-blue-500">
            <p class="text-gray-400 text-[10px] font-bold uppercase tracking-wider">Total Items</p>
            <p id="totalCount" class="text-2xl font-bold text-gray-800">0</p>
        </div>
        <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-yellow-400">
            <p class="text-gray-400 text-[10px] font-bold uppercase tracking-wider">Verified</p>
            <p id="verifiedCount" class="text-2xl font-bold text-gray-800">0</p>
        </div>
        <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-green-500">
            <p class="text-gray-400 text-[10px] font-bold uppercase tracking-wider">Est. Revenue</p>
            <p id="revenueEst" class="text-xl font-bold text-green-600">₦0</p>
            <p class="text-[10px] text-gray-400">Based on verified count</p>
        </div>
        <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-purple-500">
            <p class="text-gray-400 text-[10px] font-bold uppercase tracking-wider">Spam Shield</p>
            <p class="text-xl font-bold text-purple-600">ACTIVE</p>
        </div>
    </div>

    <div class="bg-white p-5 rounded-xl shadow-sm mb-6 border border-yellow-200">
        <h3 class="text-xs font-bold uppercase text-yellow-600 mb-2 flex items-center gap-1">
            📢 Live Broadcast (Scrolling Ad)
        </h3>
        <div class="flex flex-col md:flex-row gap-2">
            <input id="adInput" type="text" placeholder="Enter text to scroll on user screens (e.g. 'Flash Sale: Verified Status 50% Off!')" class="flex-1 border-2 border-gray-100 p-2.5 rounded-lg text-sm focus:outline-none focus:border-yellow-400 transition">
            <button onclick="updateAd()" class="bg-yellow-400 text-yellow-900 px-6 py-2.5 rounded-lg font-bold text-xs hover:bg-yellow-500 shadow-sm">
                BROADCAST
            </button>
            <button onclick="clearAd()" class="bg-gray-100 text-gray-500 px-4 py-2.5 rounded-lg font-bold text-xs hover:bg-gray-200">
                CLEAR
            </button>
        </div>
    </div>

    <div class="bg-white rounded-xl shadow overflow-hidden">
        <div class="p-4 border-b border-gray-100 bg-gray-50">
            <input id="search" placeholder="🔍 Search items by title, price, or WhatsApp number..." class="w-full bg-white border border-gray-200 p-3 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-100 transition" oninput="handleSearch(this.value)">
        </div>

        <div class="overflow-x-auto">
            <table class="w-full text-left">
                <thead class="bg-gray-50 border-b border-gray-200 text-gray-400 uppercase text-[10px] tracking-wider">
                    <tr>
                        <th class="p-4">Item</th>
                        <th class="p-4">Details</th>
                        <th class="p-4">Seller Info</th>
                        <th class="p-4">Status</th>
                        <th class="p-4 text-right">Controls</th>
                    </tr>
                </thead>
                <tbody id="tableBody" class="divide-y divide-gray-50 text-gray-600">
                    <tr><td colspan="5" class="p-8 text-center text-gray-400 italic">Connecting to secure feed...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <div id="blacklistModal" class="hidden fixed inset-0 bg-black bg-opacity-90 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-xl p-6 w-full max-w-md shadow-2xl">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-bold text-red-600 flex items-center gap-2">
                    🚫 Banned Numbers
                </h2>
                <button onclick="document.getElementById('blacklistModal').classList.add('hidden')" class="text-gray-400 hover:text-gray-600 text-xl">&times;</button>
            </div>
            <div class="bg-gray-50 rounded-lg p-2 mb-4 border border-gray-100">
                <ul id="blacklistList" class="max-h-60 overflow-y-auto space-y-1"></ul>
            </div>
            <button onclick="document.getElementById('blacklistModal').classList.add('hidden')" class="w-full bg-gray-100 text-gray-600 py-3 rounded-lg font-bold text-xs hover:bg-gray-200">CLOSE LIST</button>
        </div>
    </div>

    <div id="imgModal" class="hidden fixed inset-0 bg-black bg-opacity-95 z-50 flex items-center justify-center p-4 cursor-pointer" onclick="this.classList.add('hidden')">
        <img id="modalImg" class="max-h-screen max-w-full rounded shadow-2xl border-4 border-white">
    </div>

    <audio id="pingSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"></audio>

    <script>
        // --- CONFIGURATION ---
        const SUPABASE_URL = 'https://vimovhpweucvperwhyzi.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZpbW92aHB3ZXVjdnBlcndoeXppIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY0ODE1MjUsImV4cCI6MjA4MjA1NzUyNX0.u6KDe2RCwCcWdClkGA61q2LORqzmPU0KNP9tZTZfOfc';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let localData = [];

        // --- 1. AUTH & SECURITY CHECK ---
        (async () => {
            // Check if logged in
            const { data: { user } } = await supabase.auth.getUser();
            if (!user) return location.href = 'login.html';

            // Check Whitelist (Admins Table)
            const { data: admin } = await supabase.from('admins').select('id').eq('id', user.id).single();
            if (!admin) {
                // Not an admin? Kick them out.
                await supabase.auth.signOut();
                location.href = 'login.html';
            } else {
                // Authorized: Load dashboard
                await Promise.all([loadData(), loadAd()]);
                initRealtime();
            }
        })();

        // --- 2. DATA LOADING ---
        async function loadData() {
            const { data } = await supabase.from('products').select('*').order('created_at', { ascending: false });
            localData = data || [];
            updateStats();
            render(localData);
        }

        async function loadAd() {
            const { data } = await supabase.from('admin_settings').select('value').eq('key', 'global_alert').single();
            if(data) document.getElementById('adInput').value = data.value;
        }

        // --- 3. REALTIME ENGINE ---
        function initRealtime() {
            supabase.channel('admin-dashboard')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'products' }, (payload) => {
                if (payload.eventType === 'INSERT') {
                    // New item: Add to top, play sound, animate
                    localData.unshift(payload.new);
                    document.getElementById('pingSound').play().catch(()=>{});
                    render(localData, payload.new.id);
                } else if (payload.eventType === 'DELETE') {
                    // Item deleted
                    localData = localData.filter(item => item.id !== payload.old.id);
                    render(localData);
                } else if (payload.eventType === 'UPDATE') {
                    // Item updated (e.g. verified)
                    const index = localData.findIndex(item => item.id === payload.new.id);
                    if (index !== -1) localData[index] = payload.new;
                    render(localData);
                }
                updateStats();
            })
            .subscribe();
        }

        // --- 4. RENDER LOGIC ---
        function render(items, highlightId = null) {
            const tbody = document.getElementById('tableBody');
            if(items.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-gray-400">No items found.</td></tr>`;
                return;
            }

            tbody.innerHTML = items.map(p => {
                const isNew = p.id === highlightId ? 'new-item' : '';
                return `
                <tr class="hover:bg-blue-50 transition border-b border-gray-50 last:border-0 ${isNew}">
                    <td class="p-4">
                        <img src="${p.image_url}" onclick="showImg('${p.image_url}')" class="w-10 h-10 rounded-lg object-cover border border-gray-200 cursor-zoom-in hover:scale-110 transition">
                    </td>
                    <td class="p-4">
                        <div class="font-bold text-gray-800 text-sm">${p.title}</div>
                        <div class="text-[10px] uppercase font-bold text-gray-400 mt-0.5">
                            ${p.item_type} • ₦${Number(p.price).toLocaleString()}
                        </div>
                    </td>
                    <td class="p-4">
                        <div class="font-mono text-xs text-blue-600 font-medium">${p.whatsapp_number}</div>
                        <div class="text-[10px] text-gray-400">${new Date(p.created_at).toLocaleDateString()}</div>
                    </td>
                    <td class="p-4">
                        ${p.is_master 
                            ? '<span class="bg-yellow-100 text-yellow-700 text-[10px] font-bold px-2 py-1 rounded border border-yellow-200 flex items-center gap-1 w-max">👑 VERIFIED</span>' 
                            : '<span class="bg-gray-100 text-gray-500 text-[10px] font-bold px-2 py-1 rounded border border-gray-200 w-max">USER</span>'}
                    </td>
                    <td class="p-4 text-right">
                        <div class="flex justify-end gap-2">
                            <button onclick="toggleVerify('${p.id}', ${!p.is_master})" class="px-3 py-1.5 text-[10px] border rounded-md font-bold transition ${p.is_master ? 'bg-white border-gray-300 text-gray-500 hover:bg-gray-50' : 'bg-blue-600 border-blue-600 text-white hover:bg-blue-700'}">
                                ${p.is_master ? 'Unverify' : 'VERIFY'}
                            </button>
                            <button onclick="deleteItem('${p.id}')" class="px-3 py-1.5 text-[10px] bg-white text-red-600 border border-red-200 rounded-md hover:bg-red-50 font-bold">
                                DEL
                            </button>
                            <button onclick="banUser('${p.whatsapp_number}')" class="px-3 py-1.5 text-[10px] bg-gray-800 text-white border border-gray-800 rounded-md hover:bg-black font-bold" title="Ban Number">
                                🚫
                            </button>
                        </div>
                    </td>
                </tr>
            `}).join('');
        }

        function updateStats() {
            const total = localData.length;
            const verified = localData.filter(i => i.is_master).length;
            document.getElementById('totalCount').innerText = total;
            document.getElementById('verifiedCount').innerText = verified;
            document.getElementById('revenueEst').innerText = '₦' + (verified * 5000).toLocaleString();
        }

        // --- 5. ACTION HANDLERS ---
        
        // A. Broadcast Ad
        async function updateAd() {
            const text = document.getElementById('adInput').value;
            const btn = document.querySelector('button[onclick="updateAd()"]');
            btn.innerText = "...";
            const { error } = await supabase.from('admin_settings').update({ value: text }).eq('key', 'global_alert');
            if(error) alert(error.message);
            else { btn.innerText = "✓ LIVE"; setTimeout(() => btn.innerText = "BROADCAST", 2000); }
        }
        async function clearAd() {
            document.getElementById('adInput').value = '';
            updateAd();
        }

        // B. Verify (Secure RPC)
        async function toggleVerify(id, state) {
            await supabase.rpc('admin_toggle_verify', { p_id: id, p_status: state });
        }

        // C. Delete (Direct Policy)
        async function deleteItem(id) {
            if(!confirm("Permanently delete this item?")) return;
            await supabase.from('products').delete().eq('id', id);
        }

        // D. Ban (Atomic RPC)
        async function banUser(number) {
            const reason = prompt(`BAN USER ${number}?\n\nThis will:\n1. Add number to blacklist\n2. Delete ALL their items\n\nEnter reason:`);
            if (!reason) return;
            
            // Uses atomic transaction to ensure data integrity
            const { error } = await supabase.rpc('admin_ban_user', { p_number: number, p_reason: reason });
            
            if(error) alert("Error: " + error.message);
            else alert(`User ${number} BANNED and items purged.`);
        }

        // --- 6. UTILITIES ---
        function handleSearch(term) {
            const v = term.toLowerCase();
            const filtered = localData.filter(p => 
                p.title.toLowerCase().includes(v) || 
                p.whatsapp_number.includes(v) ||
                p.price.toString().includes(v)
            );
            render(filtered);
        }

        async function viewBlacklist() {
            const { data } = await supabase.from('blacklist').select('*').order('created_at', { ascending: false });
            const list = document.getElementById('blacklistList');
            list.innerHTML = data.length ? '' : '<li class="text-gray-400 text-xs italic text-center py-2">No banned numbers</li>';
            
            data.forEach(b => {
                list.innerHTML += `
                    <li class="flex justify-between items-center bg-white p-2 mb-1 rounded border border-gray-100 shadow-sm">
                        <div>
                            <span class="font-mono text-xs font-bold text-red-600 block">${b.whatsapp_number}</span>
                            <span class="text-[10px] text-gray-400">${b.reason || 'No reason'}</span>
                        </div>
                        <button onclick="unban('${b.whatsapp_number}')" class="text-[10px] font-bold text-blue-600 hover:underline">UNBAN</button>
                    </li>`;
            });
            document.getElementById('blacklistModal').classList.remove('hidden');
        }

        async function unban(n) { 
            if(!confirm(`Unban ${n}?`)) return;
            await supabase.from('blacklist').delete().eq('whatsapp_number', n); 
            viewBlacklist(); 
        }

        async function handleLogout() { await supabase.auth.signOut(); location.href = 'login.html'; }
        function showImg(url) { document.getElementById('modalImg').src = url; document.getElementById('imgModal').classList.remove('hidden'); }
    </script>
</body>
</html>
