<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CampusMarket | Sentinel V14.1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="theme.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f0f2f5; }
        .glass { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.5); }
        .ticker-container { overflow: hidden; white-space: nowrap; }
        .ticker-content { display: inline-block; animation: scroll-left 30s linear infinite; }
        @keyframes scroll-left { 0% { transform: translateX(100vw); } 100% { transform: translateX(-100%); } }
        .animate-fade { animation: fadeIn 0.4s ease forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .click-dot { width: 5px; height: 5px; border-radius: 50%; display: inline-block; margin: 0 1px; transition: all 0.3s; }
        .dot-active { background: #25D366; box-shadow: 0 0 5px #25D366; }
        .dot-empty { background: rgba(255,255,255,0.3); }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="select-none text-gray-900 pb-24">

    <div id="adBar" class="hidden bg-black text-white py-2 ticker-container sticky top-0 z-[60] shadow-xl">
        <div id="adText" class="ticker-content px-4 text-[10px] font-black uppercase italic tracking-widest"></div>
    </div>

    <header class="glass sticky top-[34px] z-50 px-4 py-4 border-b flex flex-col gap-3">
        <div class="flex justify-between items-center">
            <h1 class="text-xl font-extrabold tracking-tighter text-wa-teal">CAMPUS<span class="text-black">MARKET</span></h1>
            <div class="flex items-center gap-3">
                <button id="adminGhostBtn" onclick="Sentinel.UI.toggleModal('loginOverlay', true)" class="opacity-[0.05] hover:opacity-100 transition text-[8px] font-bold">ADMIN</button>
                <div id="quotaBadge" class="text-[8px] bg-gray-200 px-2 py-1 rounded-full font-bold">POSTS: 0/3</div>
            </div>
        </div>
        <div class="flex gap-2 overflow-x-auto scrollbar-hide pb-1" id="campusList"></div>
    </header>

    <div class="p-4">
        <input type="text" id="searchInput" oninput="Sentinel.UI.renderFeed()" placeholder="Global Search (Books, Laptops, Hostels...)" class="w-full bg-white p-4 rounded-2xl shadow-sm border-none outline-none text-sm focus:ring-2 focus:ring-wa-teal transition">
    </div>

    <main id="feed" class="px-4 grid grid-cols-2 md:grid-cols-4 gap-4 min-h-[60vh]"></main>

    <button onclick="Sentinel.UI.toggleModal('sellModal', true)" class="fixed bottom-6 right-6 bg-wa-teal text-white w-16 h-16 rounded-2xl flex items-center justify-center text-4xl z-50 shadow-2xl transition hover:rotate-90">+</button>

    <script>
        const Sentinel = {
            state: { products: [], campus: 'All', postCount: 0, isAdmin: false },

            async init() {
                window.supabase = window.initSupabase?.();
                this.checkQuota();
                
                const { data: { session } } = await window.supabase.auth.getSession();
                if (session) {
                    const { data: admin } = await window.supabase.from('admins').select('id').eq('id', session.user.id).maybeSingle();
                    this.state.isAdmin = !!admin;
                }

                this.UI.renderCampuses();
                await this.Actions.refreshMarket();
                this.Actions.initRealtime();
                this.Actions.loadTicker();
            },

            checkQuota() {
                const today = new Date().toLocaleDateString('en-NG');
                const stored = JSON.parse(localStorage.getItem('campus_market_quota') || '{}');
                this.state.postCount = (stored.date !== today) ? 0 : (stored.count || 0);
                this.UI.updateQuotaDisplay();
            },

            Actions: {
                async refreshMarket() {
                    const { data } = await window.supabase.from('products').select('*').order('created_at', { ascending: false });
                    Sentinel.state.products = data || [];
                    Sentinel.UI.renderFeed();
                },

                async handleBuyClick(id, whatsapp) {
                    // Trigger Atomic Click Budget on Server
                    await window.supabase.rpc('increment_click', { p_id: id });
                    window.open(`https://wa.me/${whatsapp}?text=Saw%20your%20listing%20on%20CampusMarket!`, '_blank');
                    // Refresh local view to update dots
                    this.refreshMarket();
                },

                async loadTicker() {
                    const { data } = await window.supabase.from('admin_settings').select('value').eq('key', 'global_alert').maybeSingle();
                    if (data?.value) {
                        document.getElementById('adBar').classList.remove('hidden');
                        document.getElementById('adText').textContent = data.value;
                    }
                },

                initRealtime() {
                    window.supabase.channel('v14').on('postgres_changes', { event: '*', schema: 'public', table: 'products' }, () => this.refreshMarket()).subscribe();
                }
            },

            UI: {
                renderFeed() {
                    const feed = document.getElementById('feed');
                    const term = document.getElementById('searchInput').value.toLowerCase();
                    let items = Sentinel.state.products.filter(p => p.title.toLowerCase().includes(term));
                    
                    // Proximity Sort: Selected Campus First
                    if (Sentinel.state.campus !== 'All') {
                        items.sort((a, b) => (a.campus === Sentinel.state.campus) ? -1 : (b.campus === Sentinel.state.campus) ? 1 : 0);
                    }

                    feed.innerHTML = items.map(p => {
                        const budget = p.click_count || 0;
                        const dots = Array(5).fill(0).map((_, i) => `<span class="click-dot ${i < budget ? 'dot-active' : 'dot-empty'}"></span>`).join('');
                        const isOwnCampus = p.campus === Sentinel.state.campus;

                        return `
                        <div class="glass rounded-[2rem] overflow-hidden flex flex-col animate-fade border ${isOwnCampus ? 'ring-2 ring-wa-teal/20' : ''}">
                            <div class="h-32 relative">
                                <img src="${p.images?.[0]}" class="w-full h-full object-cover">
                                ${isOwnCampus ? '<div class="absolute top-2 left-2 bg-wa-teal text-white text-[7px] font-black px-2 py-0.5 rounded-full">NEAR YOU</div>' : ''}
                                <div class="absolute bottom-2 left-2 flex items-center bg-black/60 px-2 py-1 rounded-full border border-white/10">
                                    <span class="text-[6px] text-white font-black mr-2 uppercase">Budget</span>
                                    ${dots}
                                </div>
                            </div>
                            <div class="p-4 space-y-1">
                                <h3 class="font-bold text-[10px] truncate uppercase text-gray-500">${p.title}</h3>
                                <p class="text-wa-teal font-black text-xs">₦${Number(p.price).toLocaleString()}</p>
                                <button onclick="Sentinel.Actions.handleBuyClick('${p.id}', '${p.whatsapp_number}')" class="block w-full bg-wa-teal text-white text-center py-2.5 rounded-xl text-[9px] font-black mt-2">CHAT TO BUY</button>
                            </div>
                        </div>
                    `}).join('');
                },
                
                renderCampuses() {
                    const camps = window.CampusConfig?.campuses || [];
                    document.getElementById('campusList').innerHTML = camps.map(c => `<button onclick="Sentinel.Actions.setCampus('${c.id}')" class="flex-none px-5 py-2 rounded-full text-[10px] font-black border transition ${Sentinel.state.campus === c.id ? 'bg-wa-teal text-white border-wa-teal shadow-lg' : 'glass border-gray-100'}">${c.name}</button>`).join('');
                },

                updateQuotaDisplay() { document.getElementById('quotaBadge').textContent = `POSTS: ${Sentinel.state.postCount}/3`; },
                toggleModal(id, show) { document.getElementById(id).classList.toggle('hidden', !show); }
            }
        };

        window.Sentinel = Sentinel;
        document.addEventListener('DOMContentLoaded', () => Sentinel.init());
    </script>
</body>
</html>
