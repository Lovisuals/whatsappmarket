<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Campus Market | Nigeria</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23008069%22/><path d=%22M30 35h5l7 30h30l7-22H38%22 fill=%22none%22 stroke=%22white%22 stroke-width=%226%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/><circle cx=%2245%22 cy=%2275%22 r=%225%22 fill=%22white%22/><circle cx=%2270%22 cy=%2275%22 r=%225%22 fill=%22white%22/><path d=%22M75 15c-5 0-9 4-9 9 0 2 1 4 2 5l-2 7 8-2c2 1 4 1 5 1 5 0 9-4 9-9s-4-9-9-9z%22 fill=%22%2325D366%22/></svg>">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="select-none text-gray-800 font-ui pb-24">

    <div id="adBar" class="hidden marquee-container">
        <div id="adTrack" class="marquee-track"></div>
    </div>

    <header class="bg-wa-teal text-white pt-4 pb-2 sticky top-0 z-40 shadow-lg backdrop-blur-md bg-opacity-95">
        <div class="flex justify-between items-center px-4 mb-4">
            <h1 class="font-bold text-xl tracking-tight flex items-center gap-2">
                CampusMarket <span class="text-[10px] bg-white text-wa-teal px-1.5 py-0.5 rounded font-extrabold shadow-sm">NG</span>
            </h1>
            <button id="pBtn" class="tap bg-white/20 backdrop-blur-md text-white px-3 py-1 rounded-full text-[10px] font-bold border border-white/30">
                👑 <span>PREMIUM</span>
            </button>
        </div>
        <div class="flex gap-3 overflow-x-auto px-4 pb-2 scrollbar-hide" id="campusList"></div>
    </header>

    <div id="filterBar" class="bg-white p-4 shadow-md border-b border-gray-100 sticky top-[110px] z-30">
        <input type="text" id="searchInput" placeholder="Search items..." class="w-full bg-gray-100 p-3 rounded-xl text-sm mb-3 outline-none focus:ring-2 focus:ring-wa-teal transition">
        <div class="flex gap-2">
            <button onclick="filterType('All', this)" class="type-btn tap flex-1 bg-wa-teal text-white py-2.5 rounded-full text-xs font-bold shadow-sm">ALL</button>
            <button onclick="filterType('Physical', this)" class="type-btn tap flex-1 bg-gray-50 border border-gray-200 py-2.5 rounded-full text-xs font-bold text-gray-400">PHYSICAL</button>
            <button onclick="filterType('Digital', this)" class="type-btn tap flex-1 bg-gray-50 border border-gray-200 py-2.5 rounded-full text-xs font-bold text-gray-400">DIGITAL</button>
        </div>
    </div>

    <main id="feed" class="p-3 grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 min-h-[60vh]"></main>

    <button id="plusBtn" class="fab fixed bottom-6 right-6 bg-wa-teal text-white w-14 h-14 rounded-2xl flex items-center justify-center text-3xl shadow-xl active:scale-90 transition transform z-50">
        <span>+</span>
    </button>

    <div id="sellModal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-end sm:items-center justify-center backdrop-blur-sm p-4">
        <div class="glass bg-white rounded-t-[2rem] sm:rounded-[1.5rem] w-full max-w-sm overflow-hidden animate-pop">
            <div class="bg-wa-teal p-5 text-white flex justify-between items-center">
                <h2 class="font-bold">POST AD</h2>
                <button onclick="closeModal('sellModal')" class="text-2xl">&times;</button>
            </div>
            <form id="sellForm" class="p-6 space-y-4 max-h-[70vh] overflow-y-auto">
                <div class="tap w-full h-32 bg-gray-50 border-2 border-dashed border-gray-300 rounded-2xl flex flex-col items-center justify-center relative overflow-hidden" id="dropzone">
                    <input type="file" id="fileInput" accept="image/*" multiple class="hidden">
                    <div id="uploadPlaceholder" class="text-center"><p class="text-2xl mb-1">📷</p><span class="text-[10px] font-bold text-gray-400">UPLOAD (MAX 3)</span></div>
                    <div id="previewContainer" class="hidden w-full h-full flex gap-2 p-2 overflow-x-auto bg-gray-50 absolute inset-0"></div>
                </div>
                <input type="text" id="title" placeholder="Title" class="w-full bg-gray-100 p-3 rounded-xl outline-none" required>
                <input type="number" id="price" placeholder="Price (₦)" class="w-full bg-gray-100 p-3 rounded-xl outline-none" required>
                <select id="type" class="w-full bg-gray-100 p-3 rounded-xl outline-none"><option value="Physical">Physical</option><option value="Digital">Digital</option></select>
                <select id="campusSelect" class="w-full bg-gray-100 p-3 rounded-xl outline-none" required>
                    <option value="" disabled selected>Select Campus</option>
                    <option value="UNILAG">UNILAG</option><option value="UI">UI Ibadan</option><option value="OAU">OAU Ife</option>
                </select>
                <input type="tel" id="whatsapp" placeholder="WhatsApp Number" class="w-full bg-gray-100 p-3 rounded-xl outline-none" required>
                <button type="submit" id="subBtn" class="w-full bg-wa-teal text-white py-4 rounded-xl font-bold">SUBMIT AD</button>
            </form>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://vimovhpweucvperwhyzi.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZpbW92aHB3ZXVjdnBlcndoeXppIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY0ODE1MjUsImV4cCI6MjA4MjA1NzUyNX0.u6KDe2RCwCcWdClkGA61q2LORqzmPU0KNP9tZTZfOfc';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let allProducts = [];
        let currentFilter = 'All';

        // --- UI HANDLERS ---
        document.getElementById('plusBtn').onclick = () => document.getElementById('sellModal').classList.remove('hidden');
        window.closeModal = (id) => document.getElementById(id).classList.add('hidden');
        document.getElementById('dropzone').onclick = () => document.getElementById('fileInput').click();

        // --- PREVIEW LOGIC ---
        document.getElementById('fileInput').onchange = (e) => {
            const container = document.getElementById('previewContainer');
            container.innerHTML = '';
            if (e.target.files.length > 0) {
                container.classList.remove('hidden');
                Array.from(e.target.files).slice(0,3).forEach(f => {
                    const img = document.createElement('img');
                    img.src = URL.createObjectURL(f);
                    img.className = "h-full w-20 object-cover rounded-lg border shadow-sm";
                    container.appendChild(img);
                });
            }
        };

        // --- SUBMISSION LOGIC ---
        document.getElementById('sellForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('subBtn');
            const files = document.getElementById('fileInput').files;
            if (files.length === 0) return alert("Upload images");

            btn.disabled = true; btn.innerText = "POSTING...";
            try {
                let imageUrls = [];
                for (let file of files) {
                    const path = `products/${Date.now()}_${file.name}`;
                    const { error: upErr } = await supabase.storage.from('item-images').upload(path, file);
                    if (upErr) throw upErr;
                    const { data: url } = supabase.storage.from('item-images').getPublicUrl(path);
                    imageUrls.push(url.publicUrl);
                }

                const { error: insErr } = await supabase.from('products').insert({
                    title: document.getElementById('title').value,
                    price: document.getElementById('price').value,
                    item_type: document.getElementById('type').value,
                    campus: document.getElementById('campusSelect').value,
                    whatsapp_number: document.getElementById('whatsapp').value.replace(/\D/g, ''),
                    images: imageUrls
                });
                if (insErr) throw insErr;

                alert("Success!");
                location.reload();
            } catch (err) {
                alert(err.message);
                btn.disabled = false; btn.innerText = "SUBMIT AD";
            }
        };

        // --- FEED LOGIC ---
        async function loadMarket() {
            const { data } = await supabase.from('products').select('*').order('created_at', { ascending: false });
            if (data) {
                allProducts = data;
                renderFeed();
            }
        }

        function renderFeed() {
            const filtered = allProducts.filter(p => currentFilter === 'All' || p.item_type === currentFilter);
            document.getElementById('feed').innerHTML = filtered.map(i => `
                <div class="bg-white p-3 rounded-2xl shadow-sm border border-gray-100">
                    <img src="${i.images?.[0] || 'https://placehold.co/200'}" class="w-full h-32 object-cover rounded-xl mb-2">
                    <h3 class="font-bold text-sm truncate">${i.title}</h3>
                    <p class="text-wa-teal font-bold">₦${Number(i.price).toLocaleString()}</p>
                </div>
            `).join('');
        }

        window.filterType = (type, btn) => {
            currentFilter = type;
            document.querySelectorAll('.type-btn').forEach(b => b.classList.replace('bg-wa-teal', 'bg-gray-50'));
            btn.classList.replace('bg-gray-50', 'bg-wa-teal');
            renderFeed();
        };

        loadMarket();
    </script>
</body>
</html>
