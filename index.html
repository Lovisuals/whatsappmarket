<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Campus Market | Nigeria</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23008069%22/><path d=%22M30 35h5l7 30h30l7-22H38%22 fill=%22none%22 stroke=%22white%22 stroke-width=%226%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/><circle cx=%2245%22 cy=%2275%22 r=%225%22 fill=%22white%22/><circle cx=%2270%22 cy=%2275%22 r=%225%22 fill=%22white%22/><path d=%22M75 15c-5 0-9 4-9 9 0 2 1 4 2 5l-2 7 8-2c2 1 4 1 5 1 5 0 9-4 9-9s-4-9-9-9z%22 fill=%22%2325D366%22/></svg>">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="theme.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="select-none text-gray-800 font-ui bg-wa-bg pb-24">

    <div id="adBar" class="hidden marquee-container"><div id="adTrack" class="marquee-track"></div></div>

    <header class="bg-wa-teal text-white pt-4 pb-2 sticky top-0 z-40 shadow-lg backdrop-blur-md bg-opacity-95">
        <div class="flex justify-between items-center px-4 mb-4">
            <h1 class="font-bold text-xl tracking-tight flex items-center gap-2">
                CampusMarket <span class="text-[10px] bg-white text-wa-teal px-1.5 py-0.5 rounded font-extrabold shadow-sm">NG</span>
            </h1>
            <button id="premiumBtn" onclick="document.getElementById('verifiedModal').classList.remove('hidden')" class="tap bg-white/20 backdrop-blur-md text-white px-3 py-1 rounded-full text-[10px] font-bold border border-white/30 flex items-center gap-1 transition active:scale-95">
                👑 <span>PREMIUM</span>
            </button>
        </div>
        <div class="flex gap-3 overflow-x-auto px-4 pb-2 scrollbar-hide" id="campusList"></div>
    </header>

    <div id="filterBar" class="bg-white p-4 shadow-md border-b border-gray-100 sticky top-[110px] z-30">
        <input type="text" id="searchInput" placeholder="Search phones, laptops, books..." class="w-full bg-gray-100 p-3 rounded-xl text-sm mb-3 outline-none focus:ring-2 focus:ring-wa-teal transition">
        <div class="flex gap-2">
            <button data-filter="All" class="type-btn tap flex-1 bg-wa-teal text-white py-2.5 rounded-full text-xs font-bold shadow-sm transition">ALL</button>
            <button data-filter="Physical" class="type-btn tap flex-1 bg-gray-50 border border-gray-200 py-2.5 rounded-full text-xs font-bold text-gray-400 transition">PHYSICAL</button>
            <button data-filter="Digital" class="type-btn tap flex-1 bg-gray-50 border border-gray-200 py-2.5 rounded-full text-xs font-bold text-gray-400 transition">DIGITAL</button>
        </div>
    </div>

    <main id="feed" class="p-3 grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 min-h-[60vh]"></main>

    <button id="addBtn" onclick="document.getElementById('sellModal').classList.remove('hidden')" class="fab fixed bottom-6 right-6 bg-wa-teal text-white w-14 h-14 rounded-2xl flex items-center justify-center text-3xl shadow-xl active:scale-90 transition transform z-50">
        <span>+</span>
    </button>

    <div id="sellModal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 backdrop-blur-sm">
        <div class="glass bg-white rounded-t-[2rem] sm:rounded-[1.5rem] w-full max-w-sm overflow-hidden animate-pop">
            <div class="bg-wa-teal p-5 text-white flex justify-between items-center shadow-sm">
                <h2 class="font-bold uppercase text-xs tracking-widest text-white">Post Your Item</h2>
                <button onclick="document.getElementById('sellModal').classList.add('hidden')" class="text-2xl text-white">&times;</button>
            </div>
            <form id="sellForm" class="p-6 space-y-4 max-h-[70vh] overflow-y-auto">
                <div class="tap relative w-full h-48 bg-gray-50 border-2 border-dashed border-gray-300 rounded-2xl overflow-hidden" onclick="document.getElementById('fileInput').click()">
                    <input type="file" id="fileInput" accept="image/*" multiple class="hidden">
                    <div id="uploadPlaceholder" class="absolute inset-0 flex flex-col items-center justify-center text-center z-10 transition-opacity duration-300">
                        <p class="text-6xl mb-2 opacity-50">📷</p>
                        <span class="text-xs font-bold text-gray-400 uppercase tracking-tighter">Tap to upload photos (Max 3)</span>
                    </div>
                    <div id="previewContainer" class="hidden absolute inset-x-0 bottom-0 flex gap-3 p-4 justify-start overflow-x-auto bg-gradient-to-t from-black/40 to-transparent z-20"></div>
                </div>

                <input type="text" id="title" placeholder="Item Title" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 text-sm outline-none focus:border-wa-teal transition" required>
                <div class="flex gap-2">
                    <input type="number" id="price" placeholder="₦ Price" class="w-1/2 bg-gray-50 border border-gray-200 rounded-xl p-3 text-sm outline-none focus:border-wa-teal transition" required>
                    <select id="type" class="w-1/2 bg-gray-50 border border-gray-200 rounded-xl p-3 text-sm outline-none">
                        <option value="Physical">Physical</option>
                        <option value="Digital">Digital</option>
                    </select>
                </div>
                <select id="campusSelect" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 text-sm outline-none focus:border-wa-teal transition" required>
                    <option value="" disabled selected>Select Your Campus</option>
                    <option value="UNILAG">UNILAG</option>
                    <option value="UI">UI Ibadan</option>
                    <option value="OAU">OAU Ife</option>
                    <option value="UNIBEN">UNIBEN</option>
                    <option value="TASUED">TASUED</option>
                    <option value="OOU">OOU</option>
                </select>
                <input type="tel" id="whatsapp" placeholder="WhatsApp (e.g. 080...)" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 text-sm outline-none focus:border-wa-teal transition" required>
                <button type="submit" id="submitBtn" class="tap w-full bg-wa-teal text-white py-4 rounded-xl font-bold uppercase text-xs tracking-widest shadow-lg">Post Ad Now</button>
            </form>
        </div>
    </div>

    <div id="verifiedModal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="glass bg-white rounded-[1.5rem] p-8 w-full max-w-sm text-center animate-pop">
            <h2 class="text-4xl mb-4">👑</h2>
            <h3 class="font-bold text-lg text-wa-teal uppercase tracking-tight">Verified Membership</h3>
            <p class="text-[11px] text-gray-500 my-4 leading-relaxed">Verified users get a trusted badge, appear at the top, and sell faster.</p>
            <div class="space-y-3">
                <a href="https://wa.me/2347068516779" class="tap block w-full bg-wa-teal text-white py-3.5 rounded-xl font-bold shadow-md">VERIFY NOW (₦5,000)</a>
                <button onclick="document.getElementById('verifiedModal').classList.add('hidden')" class="text-[10px] font-bold text-gray-400 uppercase">Maybe Later</button>
            </div>
        </div>
    </div>

    <script>
        const supabase = window.initSupabase?.() || null;
        let allProducts = [];
        let currentFilter = 'All';
        let currentCampus = 'All';

        // 1. CAMPUS CONFIGURATION
        const campuses = [
            { id: 'All', name: 'All', logo: '🌍' },
            { id: 'UNILAG', name: 'UNILAG', logo: 'https://ui-avatars.com/api/?name=U+L&background=008069&color=fff&bold=true' },
            { id: 'UI', name: 'UI Ibadan', logo: 'https://ui-avatars.com/api/?name=U+I&background=008069&color=fff&bold=true' },
            { id: 'OAU', name: 'OAU Ife', logo: 'https://ui-avatars.com/api/?name=O+A&background=008069&color=fff&bold=true' },
            { id: 'UNIBEN', name: 'UNIBEN', logo: 'https://ui-avatars.com/api/?name=U+B&background=008069&color=fff&bold=true' },
            { id: 'TASUED', name: 'TASUED', logo: 'https://ui-avatars.com/api/?name=T+A&background=008069&color=fff&bold=true' },
            { id: 'OOU', name: 'OOU', logo: 'https://ui-avatars.com/api/?name=O+O&background=008069&color=fff&bold=true' }
        ];

        function renderCampusList() {
            document.getElementById('campusList').innerHTML = campuses.map(c => `
                <button onclick="setCampus('${c.id}')" class="tap flex-shrink-0 flex items-center gap-2 px-4 py-1.5 rounded-full transition ${currentCampus === c.id ? 'bg-white text-wa-teal shadow-md' : 'bg-white/10 text-white border border-white/20'}">
                    ${c.id === 'All' ? '🌍' : `<img src="${c.logo}" class="w-4 h-4 rounded-full">`}
                    <span class="text-xs font-bold whitespace-nowrap">${c.name}</span>
                </button>
            `).join('');
        }

        window.setCampus = (id) => { currentCampus = id; renderCampusList(); loadMarket(); };

        // 2. FILTER LOGIC
        document.querySelectorAll('.type-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                currentFilter = this.dataset.filter;
                document.querySelectorAll('.type-btn').forEach(b => {
                    b.classList.remove('bg-wa-teal', 'text-white', 'shadow-sm');
                    b.classList.add('bg-gray-50', 'border-gray-200', 'text-gray-400');
                });
                this.classList.add('bg-wa-teal', 'text-white', 'shadow-sm');
                this.classList.remove('bg-gray-50', 'border-gray-200', 'text-gray-400');
                renderFeed();
            });
        });

        // 3. IMAGE PREVIEW (NUMBERED THUMBNAILS)
        document.getElementById('fileInput').onchange = (e) => {
            const container = document.getElementById('previewContainer');
            const placeholder = document.getElementById('uploadPlaceholder');
            container.innerHTML = '';
            const files = Array.from(e.target.files).slice(0, 3);
            if (files.length > 0) {
                placeholder.classList.add('opacity-20');
                container.classList.remove('hidden');
                files.forEach((file, index) => {
                    const wrapper = document.createElement('div');
                    wrapper.className = "relative flex-shrink-0 animate-fade";
                    const img = document.createElement('img');
                    img.src = URL.createObjectURL(file);
                    img.className = "w-24 h-32 object-cover rounded-lg shadow-lg border-2 border-white";
                    const badge = document.createElement('div');
                    badge.textContent = index + 1;
                    badge.className = "absolute -top-2 -left-2 bg-wa-teal text-white text-[10px] font-bold rounded-full w-6 h-6 flex items-center justify-center shadow-md";
                    wrapper.append(img, badge);
                    container.appendChild(wrapper);
                    img.onload = () => URL.revokeObjectURL(img.src);
                });
            } else {
                placeholder.classList.remove('opacity-20');
                container.classList.add('hidden');
            }
        };

        // 4. IMAGE COMPRESSION (LITE-WEIGHT UPLOAD)
        async function compressImage(file) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 1024;
                    let width = img.width;
                    let height = img.height;
                    if (width > MAX_WIDTH) { height *= (MAX_WIDTH / width); width = MAX_WIDTH; }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    canvas.toBlob(blob => resolve(new File([blob], file.name, { type: 'image/jpeg' })), 'image/jpeg', 0.75);
                };
                img.src = URL.createObjectURL(file);
            });
        }

        // 5. DATA PIPELINE
        async function loadMarket() {
            if (!supabase) return;
            let query = supabase.from('products').select('*').order('created_at', { ascending: false });
            if (currentCampus !== 'All') query = query.eq('campus', currentCampus);
            const { data } = await query;
            allProducts = data || [];
            renderFeed();

            const { data: adData } = await supabase.from('admin_settings').select('value').eq('key', 'global_alert').single();
            if (adData?.value) {
                document.getElementById('adBar').classList.remove('hidden');
                document.getElementById('adTrack').innerHTML = `<div class="marquee-item"><span>📢</span> <span>${adData.value}</span></div>`.repeat(15);
            }
        }

        function renderFeed() {
            const feed = document.getElementById('feed');
            const term = document.getElementById('searchInput')?.value.toLowerCase() || '';
            const filtered = allProducts
                .filter(p => currentFilter === 'All' || p.item_type === currentFilter)
                .filter(p => p.title.toLowerCase().includes(term));

            if (filtered.length === 0) {
                feed.innerHTML = '<div class="col-span-full text-center mt-20 text-gray-500 text-sm">No items found matching your filter.</div>';
                return;
            }

            feed.innerHTML = filtered.map(i => `
                <div class="product-card bg-white rounded-2xl shadow-sm overflow-hidden flex flex-col animate-fade">
                    <div class="h-40 bg-gray-200 relative">
                        <img src="${i.images?.[0] || 'https://placehold.co/400x300'}" loading="lazy" class="w-full h-full object-cover">
                        ${i.is_master ? '<span class="absolute top-2 left-2 bg-wa-light text-white text-[8px] px-2 py-1 rounded-full font-bold shadow-sm">VERIFIED</span>' : ''}
                        <span class="absolute bottom-2 right-2 bg-black/60 text-white text-[9px] px-2 py-1 rounded-md uppercase font-bold">${i.item_type}</span>
                    </div>
                    <div class="p-3 flex-1 flex flex-col">
                        <h3 class="font-bold text-sm line-clamp-2 text-gray-800">${i.title}</h3>
                        <p class="text-wa-teal font-extrabold text-lg mt-1">₦${Number(i.price).toLocaleString()}</p>
                        <a href="https://wa.me/${i.whatsapp_number.replace(/\D/g,'')}?text=Hi, I'm interested in ${encodeURIComponent(i.title)}" target="_blank" class="mt-auto w-full bg-wa-teal text-white text-center py-3 rounded-xl text-xs font-bold shadow-md">Message Seller</a>
                    </div>
                </div>`).join('');
        }

        // 6. SUBMISSION
        document.getElementById('sellForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const files = document.getElementById('fileInput').files;
            if (!files.length) return alert("Select images!");
            btn.disabled = true; btn.textContent = "COMPRESSING & POSTING...";

            try {
                let urls = [];
                for (let f of files) {
                    const compressed = await compressImage(f);
                    const name = `item_${Date.now()}_${Math.random().toString(36).substr(2, 6)}.jpg`;
                    await supabase.storage.from('item-images').upload(name, compressed);
                    urls.push(supabase.storage.from('item-images').getPublicUrl(name).data.publicUrl);
                }
                await supabase.from('products').insert({
                    title: document.getElementById('title').value.trim(),
                    price: document.getElementById('price').value,
                    item_type: document.getElementById('type').value,
                    campus: document.getElementById('campusSelect').value,
                    whatsapp_number: document.getElementById('whatsapp').value.replace(/\D/g, ''),
                    images: urls,
                    is_master: false
                });
                location.reload();
            } catch (err) { alert(err.message); btn.disabled = false; btn.textContent = "Post Ad Now"; }
        };

        document.getElementById('searchInput').addEventListener('input', renderFeed);
        renderCampusList(); setCampus('All');
    </script>
</body>
</html>
