<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Campus Market | Nigeria</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛍️</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="theme.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        .font-ui { font-family: 'Inter', sans-serif; }
        .bg-wa-teal { background-color: #008069; }
        .text-wa-teal { color: #008069; }
        .bg-wa-light { background-color: #25D366; }
    </style>
</head>
<body class="select-none text-gray-800 font-ui pb-24">

    <div id="adBar" class="hidden marquee-container">
        <div id="adTrack" class="marquee-track"></div>
    </div>

    <header class="bg-wa-teal text-white pt-4 pb-2 sticky top-0 z-40 shadow-lg backdrop-blur-md bg-opacity-95">
        <div class="flex justify-between items-center px-4 mb-4">
            <h1 class="font-bold text-xl tracking-tight flex items-center gap-2">
                CampusMarket <span class="text-[10px] bg-white text-wa-teal px-1.5 py-0.5 rounded font-extrabold shadow-sm">NG</span>
            </h1>
            <button onclick="document.getElementById('verifiedModal').classList.remove('hidden')" class="tap bg-white/20 backdrop-blur-md text-white px-3 py-1 rounded-full text-[10px] font-bold border border-white/30 flex items-center gap-1">
                👑 <span>PREMIUM</span>
            </button>
        </div>
        <div class="flex gap-3 overflow-x-auto px-4 pb-2 scrollbar-hide" id="campusList"></div>
    </header>

    <div id="filterBar" class="bg-white p-4 shadow-md border-b border-gray-100 sticky top-[110px] z-30">
        <input type="text" id="searchInput" placeholder="Search phones, books, hostels..." class="w-full bg-gray-100 p-3 rounded-xl text-sm mb-3 outline-none focus:ring-2 focus:ring-wa-teal transition">
        <div class="flex gap-2">
            <button onclick="filterType('All')" class="tap flex-1 bg-gray-50 border border-gray-200 py-2.5 rounded-full text-xs font-bold">ALL</button>
            <button onclick="filterType('Physical')" class="tap flex-1 bg-gray-50 border border-gray-200 py-2.5 rounded-full text-xs font-bold text-gray-400">PHYSICAL</button>
            <button onclick="filterType('Digital')" class="tap flex-1 bg-gray-50 border border-gray-200 py-2.5 rounded-full text-xs font-bold text-gray-400">DIGITAL</button>
        </div>
    </div>

    <main id="feed" class="p-3 grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 min-h-[60vh]"></main>

    <button onclick="document.getElementById('sellModal').classList.remove('hidden')" class="fab fixed bottom-6 right-6 bg-wa-teal text-white w-14 h-14 rounded-2xl flex items-center justify-center text-3xl shadow-xl active:scale-90 transition transform hover:rotate-90"><span>+</span></button>

    <div id="sellModal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 backdrop-blur-sm">
        <div class="glass bg-white rounded-t-[2rem] sm:rounded-[1.5rem] w-full max-w-sm overflow-hidden shadow-2xl animate-pop">
            <div class="bg-wa-teal p-5 text-white flex justify-between items-center">
                <h2 class="font-bold">POST ITEM</h2>
                <button onclick="document.getElementById('sellModal').classList.add('hidden')" class="text-2xl">&times;</button>
            </div>
            <form id="sellForm" class="p-6 space-y-4 max-h-[70vh] overflow-y-auto">
                <div class="tap w-full h-32 bg-gray-50 border-2 border-dashed border-gray-300 rounded-2xl flex flex-col items-center justify-center" onclick="document.getElementById('fileInput').click()">
                    <input type="file" id="fileInput" accept="image/*" multiple class="hidden">
                    <div id="uploadPlaceholder" class="text-center"><p class="text-2xl mb-1">📷</p><span class="text-[10px] font-bold uppercase text-gray-400">Upload (Max 3)</span></div>
                    <div id="previewContainer" class="hidden w-full h-full flex gap-2 p-2 overflow-x-auto"></div>
                </div>
                <input type="text" id="title" placeholder="Item Title" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 text-sm outline-none" required>
                <div class="flex gap-2">
                    <input type="number" id="price" placeholder="Price (₦)" class="w-1/2 bg-gray-50 border border-gray-200 rounded-xl p-3 text-sm outline-none" required>
                    <select id="type" class="w-1/2 bg-gray-50 border border-gray-200 rounded-xl p-3 text-sm outline-none"><option value="Physical">Physical</option><option value="Digital">Digital</option></select>
                </div>
                <select id="campusSelect" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 text-sm outline-none">
                    <option value="General">Select Campus</option>
                    <option value="UNILAG">UNILAG</option><option value="UI">UI Ibadan</option><option value="OAU">OAU Ife</option>
                </select>
                <input type="tel" id="whatsapp" placeholder="WhatsApp Number" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 text-sm outline-none" required>
                <button type="submit" class="tap w-full bg-wa-teal text-white py-3.5 rounded-xl font-bold">POST AD</button>
            </form>
        </div>
    </div>

    <div id="verifiedModal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="glass bg-white rounded-[1.5rem] p-8 w-full max-w-sm text-center animate-pop">
            <h2 class="text-4xl mb-2">👑</h2>
            <h3 class="font-bold text-lg text-wa-teal">Verified Account</h3>
            <p class="text-xs text-gray-500 my-4">Get the verified badge, post up to 15 items, and rank higher in searches.</p>
            <a href="https://wa.me/2347068516779" class="tap block w-full bg-wa-teal text-white py-3.5 rounded-xl font-bold">GET VERIFIED</a>
            <button onclick="document.getElementById('verifiedModal').classList.add('hidden')" class="mt-4 text-xs font-bold text-gray-400">CLOSE</button>
        </div>
    </div>

    <script>
        const supabase = window.initSupabase();
        let allProducts = []; let currentFilter = 'All'; let currentCampus = 'All';
        let currentPage = 0; const ITEMS_PER_PAGE = 8; let isLoading = false;

        const campuses = [
            { id: 'All', name: 'All', logo: '🌍' },
            { id: 'UNILAG', name: 'UNILAG', logo: 'https://ui-avatars.com/api/?name=U+L&background=fff&color=008069&bold=true' },
            { id: 'UI', name: 'UI Ibadan', logo: 'https://ui-avatars.com/api/?name=U+I&background=fff&color=008069&bold=true' },
            { id: 'OAU', name: 'OAU Ife', logo: 'https://ui-avatars.com/api/?name=O+A&background=fff&color=008069&bold=true' }
        ];

        function renderCampusList() {
            document.getElementById('campusList').innerHTML = campuses.map(c => {
                const active = currentCampus === c.id;
                const cls = active ? 'bg-white text-wa-teal shadow-md' : 'bg-white/10 text-white border border-white/20';
                const icon = c.id==='All' ? `<span>${c.logo}</span>` : `<img src="${c.logo}" class="w-4 h-4 rounded-full">`;
                return `<button onclick="setCampus('${c.id}')" class="tap flex-shrink-0 flex items-center gap-2 px-4 py-1.5 rounded-full transition ${cls}">${icon}<span class="text-xs font-bold">${c.name}</span></button>`;
            }).join('');
        }

        window.setCampus = (id) => { currentCampus=id; currentPage=0; allProducts=[]; renderCampusList(); loadMarket(); };
        window.filterType = (type) => { currentFilter=type; renderFeed(); };

        // 🆙 V8 TICKER LOGIC
        function updateAd(text) {
            const bar = document.getElementById('adBar');
            const track = document.getElementById('adTrack');
            if (text && text.trim() !== "") {
                bar.classList.remove('hidden');
                const content = `<div class="marquee-item"><span>📢</span><span>${text}</span></div>`;
                track.innerHTML = content.repeat(10);
            } else { bar.classList.add('hidden'); }
        }

        async function loadMarket() {
            if(isLoading) return; isLoading=true;
            const from = currentPage * ITEMS_PER_PAGE;
            const to = from + ITEMS_PER_PAGE - 1;
            let query = supabase.from('products').select('*').order('created_at', { ascending: false }).range(from, to);
            if (currentCampus !== 'All') query = query.eq('campus', currentCampus);
            const { data } = await query;
            if (data) { allProducts = [...allProducts, ...data]; currentPage++; renderFeed(); }
            isLoading = false;
        }

        function renderFeed() {
            const feed = document.getElementById('feed');
            let items = allProducts;
            if (currentFilter !== 'All') items = items.filter(i => i.item_type === currentFilter);
            
            feed.innerHTML = items.map(i => `
                <div class="tap bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden flex flex-col animate-fade">
                    <div class="h-40 bg-gray-50 overflow-hidden relative">
                        <img src="${i.images?.[0] || i.image_url}" class="w-full h-full object-cover">
                        <div class="absolute top-2 right-2 bg-black/50 text-white text-[9px] px-2 py-1 rounded-md backdrop-blur-md">${i.item_type}</div>
                    </div>
                    <div class="p-3 flex-1 flex flex-col">
                        <h3 class="font-bold text-xs truncate">${i.title}</h3>
                        <p class="text-wa-teal font-extrabold text-sm mt-1">₦${parseInt(i.price).toLocaleString()}</p>
                        <p class="text-[9px] text-gray-400 mt-1 uppercase font-bold tracking-wider">${i.campus}</p>
                        <a href="https://wa.me/${i.whatsapp_number}" target="_blank" class="tap mt-3 block w-full bg-gray-50 border border-gray-200 text-wa-teal py-2 rounded-xl text-[10px] font-bold text-center">MESSAGE</a>
                    </div>
                </div>
            `).join('');
        }

        async function init() {
            renderCampusList();
            const { data } = await supabase.from('admin_settings').select('value').eq('key', 'global_alert').single();
            if(data) updateAd(data.value);
            loadMarket();
        }

        document.getElementById('fileInput').addEventListener('change', (e) => {
            const container = document.getElementById('previewContainer');
            const placeholder = document.getElementById('uploadPlaceholder');
            placeholder.classList.add('hidden'); container.classList.remove('hidden'); container.innerHTML = '';
            Array.from(e.target.files).slice(0,3).forEach(f => {
                const img = document.createElement('img'); img.src = URL.createObjectURL(f);
                img.className = "h-full w-20 object-cover rounded-lg border shadow-sm";
                container.appendChild(img);
            });
        });

        init();
    </script>
</body>
</html>
