<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Digital WhatsApp Marketplace | Nigeria</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛍️</text></svg>">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        wa: { teal: '#075E54', light: '#128C7E', green: '#25D366', chat: '#ECE5DD', gold: '#FFD700' }
                    },
                    animation: {
                        'fade': 'fadeIn 0.4s ease-out forwards',
                        'spin-slow': 'spin 2s linear infinite'
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' }
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #ECE5DD; font-family: -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
        .fab { box-shadow: 0 4px 15px rgba(37, 211, 102, 0.5); }
        .filter-active { background-color: #128C7E !important; color: white !important; border-color: #128C7E !important; }
    </style>
</head>
<body class="pb-32 select-none">

    <header class="bg-wa-teal text-white p-4 sticky top-0 z-50 shadow-lg flex justify-between items-center">
        <div>
            <h1 class="font-bold text-lg tracking-wide uppercase flex items-center gap-2">
                MARKETPLACE <span class="text-xs bg-white text-wa-teal px-1 rounded font-extrabold">NG</span>
            </h1>
            <div class="flex items-center gap-1 opacity-90">
                <span class="w-2 h-2 bg-green-400 rounded-full animate-pulse"></span>
                <p class="text-[10px] font-medium">LIVE</p>
            </div>
        </div>
        <button onclick="toggleFilter()" class="text-xs font-bold bg-black bg-opacity-20 border border-white border-opacity-20 px-4 py-2 rounded-full hover:bg-opacity-40 transition backdrop-blur-sm">
            FILTER
        </button>
    </header>

    <div id="filterBar" class="hidden bg-white p-4 shadow-md border-b border-gray-200 sticky top-[60px] z-40">
        <input type="text" id="searchInput" placeholder="Search phones, courses..." class="w-full bg-gray-100 p-3 rounded-lg text-sm mb-3 focus:outline-none focus:ring-2 focus:ring-wa-light transition">
        <div class="flex gap-2">
            <button id="btnAll" onclick="filterFeed('All')" class="filter-btn flex-1 bg-gray-50 border border-gray-200 py-2 rounded-lg text-xs font-bold text-gray-600 transition filter-active">ALL</button>
            <button id="btnPhys" onclick="filterFeed('Physical')" class="filter-btn flex-1 bg-gray-50 border border-gray-200 py-2 rounded-lg text-xs font-bold text-gray-600 transition">PHYSICAL</button>
            <button id="btnDigi" onclick="filterFeed('Digital')" class="filter-btn flex-1 bg-gray-50 border border-gray-200 py-2 rounded-lg text-xs font-bold text-gray-600 transition">DIGITAL</button>
        </div>
    </div>

    <main id="feed" class="p-3 grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 min-h-[50vh]">
        <div class="col-span-full flex flex-col items-center justify-center mt-20 opacity-60">
            <div class="w-10 h-10 border-4 border-wa-teal border-t-transparent rounded-full animate-spin"></div>
            <p class="text-xs mt-3 font-bold text-wa-teal tracking-widest">LOADING MARKET...</p>
        </div>
    </main>

    <button onclick="document.getElementById('sellModal').classList.remove('hidden')" class="fab fixed bottom-8 right-6 bg-wa-green text-white w-16 h-16 rounded-full flex items-center justify-center text-4xl shadow-xl z-50 active:scale-90 transition-transform">
        <span class="mb-1">+</span>
    </button>

    <div id="sellModal" class="hidden fixed inset-0 bg-black bg-opacity-80 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl w-full max-w-sm overflow-hidden shadow-2xl relative">
            <div class="bg-wa-teal p-4 text-white flex justify-between items-center">
                <h2 class="font-bold tracking-wide">NEW LISTING</h2>
                <button onclick="document.getElementById('sellModal').classList.add('hidden')" class="text-2xl opacity-70 hover:opacity-100">&times;</button>
            </div>
            
            <form id="sellForm" class="p-5 space-y-4 max-h-[80vh] overflow-y-auto">
                <div class="relative w-full h-36 bg-gray-50 border-2 border-dashed border-gray-300 rounded-xl flex flex-col items-center justify-center cursor-pointer hover:bg-gray-100 transition overflow-hidden" onclick="document.getElementById('fileInput').click()">
                    <input type="file" id="fileInput" accept="image/*" class="hidden">
                    <img id="imagePreview" class="hidden absolute inset-0 w-full h-full object-cover">
                    <div id="uploadPlaceholder" class="text-center p-4">
                        <p class="text-3xl text-gray-300 mb-1">📷</p>
                        <span class="text-xs text-gray-500 font-bold uppercase">Add Photo</span>
                    </div>
                </div>

                <div class="space-y-3">
                    <input type="text" id="title" placeholder="Item Name" class="w-full bg-gray-50 border border-gray-200 rounded-lg p-3 text-sm focus:border-wa-teal focus:outline-none" required>
                    
                    <div class="flex gap-3">
                        <input type="number" id="price" placeholder="Price (₦)" class="flex-1 bg-gray-50 border border-gray-200 rounded-lg p-3 text-sm focus:border-wa-teal focus:outline-none" required inputmode="numeric">
                        <select id="type" class="flex-1 bg-gray-50 border border-gray-200 rounded-lg p-3 text-sm">
                            <option value="Physical">Physical</option>
                            <option value="Digital">Digital</option>
                        </select>
                    </div>

                    <input type="tel" id="whatsapp" placeholder="WhatsApp (e.g. 23480...)" class="w-full bg-gray-50 border border-gray-200 rounded-lg p-3 text-sm focus:border-wa-teal focus:outline-none" required>
                    
                    <div class="pt-2 border-t border-gray-100">
                        <label class="text-[10px] font-bold text-gray-300 uppercase tracking-widest">Business PIN (Optional)</label>
                        <input type="password" id="masterPin" placeholder="Admin Code" class="w-full bg-gray-50 border border-gray-200 rounded-lg p-2 text-xs focus:border-wa-gold focus:outline-none">
                    </div>
                </div>
                
                <button type="submit" class="w-full bg-wa-light text-white py-4 rounded-xl font-bold shadow-lg hover:bg-wa-teal transition transform active:scale-95 text-sm tracking-wide">
                    POST TO MARKET
                </button>
            </form>
        </div>
    </div>

    <a href="login.html" 
       title="Admin Access"
       class="fixed bottom-2 left-2 z-0 opacity-10 hover:opacity-100 transition-opacity duration-300 p-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
        </svg>
    </a>

    <script>
        // --- CONFIG ---
        const SUPABASE_URL = 'https://vimovhpweucvperwhyzi.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZpbW92aHB3ZXVjdnBlcndoeXppIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY0ODE1MjUsImV4cCI6MjA4MjA1NzUyNX0.u6KDe2RCwCcWdClkGA61q2LORqzmPU0KNP9tZTZfOfc';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // --- STATE ---
        let allProducts = [];
        let currentFilter = 'All';

        // --- 1. SEARCH LOGIC ---
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = allProducts.filter(p => 
                p.title.toLowerCase().includes(term) && 
                (currentFilter === 'All' || p.item_type === currentFilter)
            );
            renderFeed(filtered);
        });

        // --- 2. LOAD & RENDER ---
        async function loadMarket() {
            const { data, error } = await supabase.from('products').select('*').order('created_at', { ascending: false });
            
            if (error) {
                console.error(error);
                document.getElementById('feed').innerHTML = '<div class="col-span-full text-center mt-10 text-red-500 text-sm">Error loading market.</div>';
                return;
            }

            // ALGORITHM: Master items first
            const masters = data.filter(i => i.is_master);
            const regulars = data.filter(i => !i.is_master);
            allProducts = [...masters, ...regulars];
            
            filterFeed(currentFilter); // Initial render
        }

        function renderFeed(items) {
            const feed = document.getElementById('feed');
            if (items.length === 0) {
                feed.innerHTML = '<div class="col-span-full text-center mt-10 text-gray-400 text-sm">No items found.</div>';
                return;
            }
            feed.innerHTML = '';
            items.forEach((item, i) => {
                const isMaster = item.is_master;
                const badge = isMaster ? '<div class="absolute top-0 left-0 bg-wa-teal text-white text-[10px] font-bold px-2 py-1 rounded-br-lg z-10 shadow">★ VERIFIED</div>' : '';
                const msg = `Hi, I saw *${item.title}* on the Marketplace.`;
                const link = `https://wa.me/${item.whatsapp_number}?text=${encodeURIComponent(msg)}`;

                feed.innerHTML += `
                    <div class="bg-white rounded-xl shadow-sm overflow-hidden flex flex-col relative ${isMaster ? 'border-2 border-wa-teal' : 'border border-gray-100'} animate-fade" style="animation-delay: ${i * 50}ms">
                        ${badge}
                        <div class="h-36 bg-gray-100 relative">
                            <img src="${item.image_url}" class="w-full h-full object-cover" loading="lazy">
                        </div>
                        <div class="p-3 flex-1 flex flex-col">
                            <h3 class="font-bold text-gray-800 text-sm line-clamp-2">${item.title}</h3>
                            <p class="text-lg font-extrabold text-gray-900 mt-1">₦${parseInt(item.price).toLocaleString()}</p>
                            <a href="${link}" class="mt-auto w-full bg-green-50 text-green-700 border border-green-200 py-2 rounded-lg text-xs font-bold text-center hover:bg-green-100 transition">
                                CHAT SELLER
                            </a>
                        </div>
                    </div>
                `;
            });
        }

        // --- 3. FILTER UI ---
        window.filterFeed = function(type) {
            currentFilter = type;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('filter-active'));
            if(type === 'All') document.getElementById('btnAll').classList.add('filter-active');
            if(type === 'Physical') document.getElementById('btnPhys').classList.add('filter-active');
            if(type === 'Digital') document.getElementById('btnDigi').classList.add('filter-active');

            if (type === 'All') {
                renderFeed(allProducts);
            } else {
                renderFeed(allProducts.filter(i => i.item_type === type));
            }
        };

        // --- 4. SECURE SUBMIT ---
        document.getElementById('sellForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const originalText = btn.innerText;
            btn.innerText = "PROCESSING...";
            btn.disabled = true;

            try {
                // Image Upload
                const file = document.getElementById('fileInput').files[0];
                let imgUrl = 'https://placehold.co/400x300/128C7E/FFFFFF?text=No+Image';
                
                if (file) {
                    const fileName = `${Date.now()}_${Math.random().toString(36).substr(2, 9)}`;
                    const { error: upErr } = await supabase.storage.from('item-images').upload(fileName, file);
                    if (upErr) throw upErr;
                    imgUrl = supabase.storage.from('item-images').getPublicUrl(fileName).data.publicUrl;
                }

                // SECURE RPC CALL (Sends PIN to DB for verification)
                const { error } = await supabase.rpc('post_market_item', {
                    p_title: document.getElementById('title').value,
                    p_price: document.getElementById('price').value,
                    p_type: document.getElementById('type').value,
                    p_whatsapp: document.getElementById('whatsapp').value.replace(/[^0-9]/g, ''),
                    p_image: imgUrl,
                    p_pin: document.getElementById('masterPin').value
                });

                if (error) throw error;

                alert("Item Posted!");
                document.getElementById('sellModal').classList.add('hidden');
                e.target.reset();
                document.getElementById('imagePreview').classList.add('hidden');
                document.getElementById('uploadPlaceholder').classList.remove('hidden');
                loadMarket();

            } catch (err) {
                alert("Error: " + err.message);
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        });

        // --- UTILS ---
        document.getElementById('fileInput').addEventListener('change', (e) => {
            if (e.target.files[0]) {
                document.getElementById('imagePreview').src = URL.createObjectURL(e.target.files[0]);
                document.getElementById('imagePreview').classList.remove('hidden');
                document.getElementById('uploadPlaceholder').classList.add('hidden');
            }
        });
        function toggleFilter() { document.getElementById('filterBar').classList.toggle('hidden'); }

        // INIT
        loadMarket();
    </script>
</body>
</html>
