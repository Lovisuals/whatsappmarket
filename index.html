<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CampusMarket | Sentinel V12</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2225%22 fill=%22%23008069%22/><path d=%22M30 35h5l7 30h30l7-22H38%22 fill=%22none%22 stroke=%22white%22 stroke-width=%226%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/><path d=%22M75 15c-5 0-9 4-9 9 0 2 1 4 2 5l-2 7 8-2c2 1 4 1 5 1 5 0 9-4 9-9s-4-9-9-9z%22 fill=%22%2325D366%22/></svg>">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="theme.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f0f2f5; }
        
        /* Glassmorphism V2 */
        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.4); }
        .glass-dark { background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(20px); }

        /* Smooth Marquee for Revenue Ticker */
        .ticker-container { overflow: hidden; white-space: nowrap; position: relative; }
        .ticker-content { display: inline-block; animation: scroll-left 30s linear infinite; }
        @keyframes scroll-left { 0% { transform: translateX(100vw); } 100% { transform: translateX(-100%); } }

        /* Product Image Shimmer Placeholder */
        .shimmer { background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

        .scrollbar-hide::-webkit-scrollbar { display: none; }
        
        .spinner { border: 3px solid #f3f3f3; border-top: 3px solid #008069; border-radius: 50%; width: 18px; height: 18px; animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .animate-fade { animation: fadeIn 0.4s ease forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .animate-pop { animation: pop 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes pop { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body class="select-none text-gray-900 pb-24">

    <div id="adBar" class="hidden bg-black text-white py-2 ticker-container sticky top-0 z-[60]">
        <div id="adText" class="ticker-content px-4 text-[10px] font-black tracking-widest uppercase italic"></div>
    </div>

    <header class="glass sticky top-[30px] z-50 px-4 py-4 border-b flex flex-col gap-3">
        <div class="flex justify-between items-center">
            <h1 class="text-xl font-extrabold tracking-tighter text-wa-teal">CAMPUS<span class="text-black">MARKET</span></h1>
            <div class="flex items-center gap-3">
                <div id="quotaBadge" class="text-[8px] bg-gray-200 px-2 py-1 rounded-full font-bold">POSTS: 0/3</div>
                <button onclick="Sentinel.UI.toggleModal('verifiedModal', true)" class="bg-wa-teal text-white px-3 py-1 rounded-full text-[9px] font-black">GET 15 ADS/DAY</button>
            </div>
        </div>
        <div class="flex gap-2 overflow-x-auto scrollbar-hide pb-1" id="campusList"></div>
    </header>

    <div class="bg-white p-4 shadow-sm border-b border-gray-100 sticky top-[108px] z-30">
        <input type="text" id="searchInput" oninput="Sentinel.UI.renderFeed()" placeholder="Search items..." class="w-full bg-gray-100 p-3 rounded-xl text-sm mb-3 outline-none focus:ring-2 focus:ring-wa-teal transition">
    </div>

    <main id="feed" class="p-4 grid grid-cols-2 md:grid-cols-4 gap-4 min-h-[50vh]"></main>

    <button onclick="Sentinel.UI.toggleModal('sellModal', true)" class="fixed bottom-6 right-6 bg-wa-teal text-white w-16 h-16 rounded-2xl flex items-center justify-center text-4xl z-50 shadow-2xl transition hover:rotate-90">
        <span class="mb-1">+</span>
    </button>

    <div id="sellModal" class="hidden fixed inset-0 z-[110] glass-dark flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-[2.5rem] overflow-hidden shadow-2xl animate-pop">
            <div class="bg-wa-teal p-6 text-white flex justify-between items-center">
                <div>
                    <h2 class="text-lg font-black uppercase">Post Ad</h2>
                    <p id="quotaWarning" class="text-[9px] opacity-80"></p>
                </div>
                <button onclick="Sentinel.UI.toggleModal('sellModal', false)" class="text-2xl">&times;</button>
            </div>
            
            <form id="sellForm" onsubmit="Sentinel.Actions.handlePost(event)" class="p-6 space-y-4 max-h-[75vh] overflow-y-auto scrollbar-hide">
                <div class="grid grid-cols-1 gap-4">
                    <select id="postCampus" class="w-full p-4 bg-gray-100 rounded-2xl text-xs font-bold outline-none" required></select>
                    <input type="text" id="postTitle" placeholder="Item Name" class="w-full p-4 bg-gray-50 border rounded-2xl text-xs" required>
                    <input type="number" id="postPrice" placeholder="Price (₦)" class="w-full p-4 bg-gray-50 border rounded-2xl text-xs" required>
                    <select id="postType" class="w-full p-4 bg-gray-50 border rounded-2xl text-xs"><option value="Physical">Physical</option><option value="Digital">Digital</option></select>
                </div>

                <div class="relative w-full h-32 border-2 border-dashed rounded-3xl flex flex-col items-center justify-center cursor-pointer hover:bg-gray-50" onclick="document.getElementById('fileInput').click()">
                    <input type="file" id="fileInput" multiple accept="image/*" class="hidden" onchange="Sentinel.UI.handleImageSelect(event)">
                    <div id="previewContainer" class="flex gap-2 p-2 h-full overflow-hidden items-center justify-center">
                        <div id="previewLabel" class="text-center">
                            <p class="text-2xl">📷</p>
                            <p class="text-[9px] font-black text-gray-400 uppercase">Max 3 Images (Auto-Compressed)</p>
                        </div>
                    </div>
                </div>

                <input type="tel" id="postWhatsapp" placeholder="WhatsApp (234...)" class="w-full p-4 bg-gray-50 border rounded-2xl text-xs" required>
                <input type="password" id="masterPin" placeholder="Admin PIN (Optional)" class="w-full p-4 bg-yellow-50 border-yellow-100 border rounded-2xl text-xs">
                
                <button type="submit" id="submitBtn" class="w-full bg-wa-teal text-white py-4 rounded-xl font-black shadow-lg">POST AD NOW</button>
            </form>
        </div>
    </div>

    <div id="verifiedModal" class="hidden fixed inset-0 bg-black/60 z-[90] flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-[2rem] p-8 w-full max-w-sm text-center animate-pop shadow-2xl">
            <h2 class="text-4xl mb-3">👑</h2>
            <h3 class="font-bold text-xl text-wa-teal">Get Verified</h3>
            <p class="text-xs text-gray-500 my-4 italic">Gain instant trust and rank higher on the grid.</p>
            <a href="https://wa.me/2347068516779?text=I%20want%20to%20get%20Verified%20on%20CampusMarket" target="_blank" class="block w-full bg-wa-teal text-white py-4 rounded-xl font-bold shadow-lg">MESSAGE ADMIN</a>
            <button onclick="Sentinel.UI.toggleModal('verifiedModal', false)" class="mt-4 text-xs text-gray-400 font-medium uppercase">Maybe Later</button>
        </div>
    </div>

    <script>
        const Sentinel = {
            state: { 
                products: [], 
                campus: 'All', 
                filter: 'All',
                postCount: 0, 
                isVerified: false,
                lastResetDate: null
            },

            async init() {
                window.supabase = window.initSupabase?.();
                if (!window.supabase) return console.error("Sentinel Error: Supabase SDK not found.");

                this.checkQuota();
                this.UI.renderCampuses();
                await this.Actions.refreshMarket();
                this.Actions.initRealtime();
                this.Actions.loadTicker();
                
                console.log("🚀 Sentinel V12 Active & Synced");
            },

            checkQuota() {
                const today = new Date().toLocaleDateString('en-NG');
                const stored = JSON.parse(localStorage.getItem('campus_market_quota') || '{}');
                
                if (stored.date !== today) {
                    this.state.postCount = 0;
                    this.state.lastResetDate = today;
                    this.saveQuota();
                } else {
                    this.state.postCount = stored.count || 0;
                }
                this.UI.updateQuotaDisplay();
            },

            saveQuota() {
                localStorage.setItem('campus_market_quota', JSON.stringify({
                    date: this.state.lastResetDate || new Date().toLocaleDateString('en-NG'),
                    count: this.state.postCount
                }));
            },

            Actions: {
                async refreshMarket() {
                    let query = window.supabase.from('products').select('*').order('created_at', { ascending: false });
                    if (Sentinel.state.campus !== 'All') query = query.eq('campus', Sentinel.state.campus);
                    
                    const { data, error } = await query;
                    if (error) return console.error(error);
                    Sentinel.state.products = data || [];
                    Sentinel.UI.renderFeed();
                },

                async handlePost(e) {
                    e.preventDefault();
                    const max = Sentinel.state.isVerified ? 15 : 3;
                    
                    if (Sentinel.state.postCount >= max) {
                        alert(`Daily Limit Reached! Reset at 12 AM.`);
                        return;
                    }

                    const btn = document.getElementById('submitBtn');
                    btn.disabled = true;
                    btn.innerHTML = 'COMPRESSING... <div class="spinner"></div>';

                    try {
                        const files = document.getElementById('fileInput').files;
                        const imageUrls = [];

                        if (files.length === 0) {
                            imageUrls.push('https://placehold.co/400x300?text=No+Image');
                        } else {
                            for (let i = 0; i < Math.min(files.length, 3); i++) {
                                btn.innerHTML = `UPLOADING ${i+1}/${files.length}...`;
                                const compressedBlob = await this.processImage(files[i]);
                                const fileName = `p2p_${Date.now()}_${i}.jpg`;
                                
                                const { data, error: uploadError } = await window.supabase.storage
                                    .from('item-images')
                                    .upload(fileName, compressedBlob);
                                
                                if (uploadError) throw uploadError;
                                const { data: { publicUrl } } = window.supabase.storage.from('item-images').getPublicUrl(fileName);
                                imageUrls.push(publicUrl);
                            }
                        }

                        const payload = {
                            p_title: document.getElementById('postTitle').value,
                            p_price: parseFloat(document.getElementById('postPrice').value),
                            p_type: document.getElementById('postType').value,
                            p_whatsapp: document.getElementById('postWhatsapp').value.replace(/\D/g, ''),
                            p_images: imageUrls,
                            p_campus: document.getElementById('postCampus').value,
                            p_pin: document.getElementById('masterPin')?.value || null
                        };

                        const { error: rpcError } = await window.supabase.rpc('post_market_item', payload);
                        if (rpcError) throw rpcError;

                        Sentinel.state.postCount++;
                        Sentinel.saveQuota();
                        alert("Listing Activated!");
                        location.reload();

                    } catch (err) {
                        alert("Error: " + err.message);
                        btn.disabled = false;
                        btn.innerText = "RETRY POST";
                    }
                },

                processImage(file) {
                    return new Promise((resolve) => {
                        const reader = new FileReader();
                        reader.readAsDataURL(file);
                        reader.onload = (e) => {
                            const img = new Image();
                            img.src = e.target.result;
                            img.onload = () => {
                                const canvas = document.createElement('canvas');
                                const MAX_WIDTH = 800;
                                const scale = Math.min(MAX_WIDTH / img.width, 1);
                                canvas.width = img.width * scale;
                                canvas.height = img.height * scale;
                                const ctx = canvas.getContext('2d');
                                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                                canvas.toBlob((blob) => resolve(blob), 'image/jpeg', 0.6);
                            };
                        };
                    });
                },

                initRealtime() {
                    window.supabase.channel('products_sync')
                        .on('postgres_changes', { event: '*', schema: 'public', table: 'products' }, () => {
                            this.refreshMarket();
                        }).subscribe();
                },

                async loadTicker() {
                    const { data } = await window.supabase.from('admin_settings').select('value').eq('key', 'global_alert').maybeSingle();
                    if (data?.value) {
                        document.getElementById('adBar').classList.remove('hidden');
                        document.getElementById('adText').textContent = data.value;
                    }
                },

                setCampus(id) {
                    Sentinel.state.campus = id;
                    this.refreshMarket();
                    Sentinel.UI.renderCampuses();
                }
            },

            UI: {
                renderFeed() {
                    const feed = document.getElementById('feed');
                    const term = document.getElementById('searchInput').value.toLowerCase();
                    
                    const filtered = Sentinel.state.products.filter(p => {
                        return p.title.toLowerCase().includes(term);
                    });

                    feed.innerHTML = filtered.map(p => `
                        <div class="glass rounded-3xl overflow-hidden flex flex-col border border-white/40 animate-fade">
                            <div class="h-32 bg-gray-100 relative">
                                <img src="${p.images?.[0] || 'https://placehold.co/400x300'}" class="w-full h-full object-cover">
                                ${p.is_master ? '<div class="absolute top-2 left-2 bg-wa-teal text-white text-[7px] font-black px-2 py-1 rounded-full shadow-lg">VERIFIED</div>' : ''}
                            </div>
                            <div class="p-3 space-y-1">
                                <h3 class="font-bold text-[10px] truncate uppercase text-gray-500">${p.title}</h3>
                                <p class="text-wa-teal font-black text-xs">₦${Number(p.price).toLocaleString()}</p>
                                <a href="https://wa.me/${p.whatsapp_number}?text=I%20saw%20${encodeURIComponent(p.title)}%20on%20CampusMarket" target="_blank" class="block w-full bg-wa-teal text-white text-center py-2 rounded-xl text-[9px] font-black mt-2">CHAT TO BUY</a>
                            </div>
                        </div>
                    `).join('');
                },

                handleImageSelect(e) {
                    const container = document.getElementById('previewContainer');
                    const label = document.getElementById('previewLabel');
                    container.innerHTML = '';
                    if(e.target.files.length > 0) {
                        label.classList.add('hidden');
                        Array.from(e.target.files).slice(0, 3).forEach(file => {
                            const url = URL.createObjectURL(file);
                            container.innerHTML += `<img src="${url}" class="w-12 h-12 rounded-lg object-cover border-2 border-white shadow-sm">`;
                        });
                    }
                },

                updateQuotaDisplay() {
                    const max = Sentinel.state.isVerified ? 15 : 3;
                    document.getElementById('quotaBadge').textContent = `POSTS: ${Sentinel.state.postCount}/${max}`;
                    document.getElementById('quotaWarning').textContent = `Daily limit: ${Sentinel.state.postCount} of ${max} used.`;
                },

                renderCampuses() {
                    const camps = window.CampusConfig?.campuses || [];
                    document.getElementById('campusList').innerHTML = camps.map(c => `
                        <button onclick="Sentinel.Actions.setCampus('${c.id}')" class="flex-none px-5 py-2 rounded-full text-[10px] font-black border transition ${Sentinel.state.campus === c.id ? 'bg-wa-teal text-white border-wa-teal' : 'glass border-gray-100'}">${c.name}</button>
                    `).join('');
                    
                    const sellSelect = document.getElementById('postCampus');
                    if (sellSelect && sellSelect.innerHTML === "") {
                        sellSelect.innerHTML = camps.filter(c => c.id !== 'All').map(c => `<option value="${c.id}">${c.name}</option>`).join('');
                    }
                },

                toggleModal(id, show) {
                    const el = document.getElementById(id);
                    if (el) el.classList.toggle('hidden', !show);
                }
            }
        };

        window.Sentinel = Sentinel;
        document.addEventListener('DOMContentLoaded', () => Sentinel.init());
    </script>
</body>
</html>
