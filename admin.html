<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Ops | Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="theme.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>body { padding: 1.5rem; }</style>
</head>
<body class="admin-body text-sm bg-gray-100 font-ui">

    <div id="livePreviewBar" class="hidden mb-6 bg-wa-surface border border-gray-200 text-wa-teal text-xs font-bold py-2 overflow-hidden relative whitespace-nowrap shadow-sm rounded-lg">
        <div class="inline-block px-4 text-xs text-gray-400 font-mono absolute left-0 bg-white z-10 border-r">LIVE PREVIEW:</div>
        <div id="adText" class="inline-block animate-marquee pl-[100%]">Loading...</div>
    </div>

    <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
        <div>
            <h1 class="text-2xl font-bold text-gray-800 flex items-center gap-2">🛡️ CAMPUS OPS</h1>
            <p class="text-xs text-semantic-success font-bold flex items-center gap-1 mt-1"><span class="w-2 h-2 bg-semantic-success rounded-full animate-pulse"></span> SECURE CONNECTION</p>
        </div>
        <div class="flex gap-2">
             <button onclick="viewAuditLogs()" class="tap bg-campus-blue text-white px-4 py-2 rounded shadow font-bold text-xs flex items-center gap-2"><span>🕵️</span> AUDIT LOGS</button>
             <button onclick="viewBlacklist()" class="tap bg-gray-800 text-white px-4 py-2 rounded shadow font-bold text-xs flex items-center gap-2"><span>🚫</span> BLACKLIST</button>
             <button onclick="handleLogout()" class="tap bg-red-100 text-semantic-danger px-4 py-2 rounded shadow hover:bg-red-200 font-bold text-xs">LOGOUT</button>
        </div>
    </div>

    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
        <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-semantic-trust"><p class="text-semantic-muted text-[10px] font-bold uppercase">Total Posts</p><p id="countTotal" class="text-2xl font-bold">0</p></div>
        <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-semantic-warning"><p class="text-semantic-muted text-[10px] font-bold uppercase">Verified</p><p id="countVerified" class="text-2xl font-bold">0</p></div>
        <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-semantic-success"><p class="text-semantic-muted text-[10px] font-bold uppercase">Est. Revenue</p><p id="revenue" class="text-xl font-bold text-semantic-success">₦0</p></div>
        <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-purple-500"><p class="text-semantic-muted text-[10px] font-bold uppercase">System Status</p><p class="text-xl font-bold text-purple-600">ONLINE</p></div>
    </div>

    <div class="bg-white p-6 rounded-xl shadow-sm mb-6 border border-semantic-warning">
        <div class="flex justify-between items-center mb-4">
            <h3 class="font-bold text-sm text-yellow-700 flex items-center gap-2">📢 ADVERTISEMENT MANAGER</h3>
            <span id="liveIndicator" class="text-[10px] bg-gray-100 text-gray-500 px-2 py-1 rounded font-bold uppercase">NO ACTIVE AD</span>
        </div>
        
        <div class="flex gap-2 mb-6">
            <input id="newAdInput" class="border p-3 flex-1 rounded-lg text-sm outline-none focus:border-semantic-warning bg-gray-50" placeholder="Enter new advertisement text...">
            <button onclick="saveNewAd()" class="tap bg-semantic-warning text-white px-6 rounded-lg font-bold text-xs hover:bg-yellow-500 shadow-sm">SAVE TO LIST</button>
        </div>

        <div class="bg-gray-50 rounded-lg border border-gray-100 overflow-hidden">
            <table class="w-full text-left">
                <thead class="bg-gray-100 text-[10px] text-gray-400 uppercase font-bold">
                    <tr>
                        <th class="p-3">Ad Content</th>
                        <th class="p-3 w-32 text-center">Status</th>
                        <th class="p-3 w-20 text-right">Action</th>
                    </tr>
                </thead>
                <tbody id="adHistoryBody" class="divide-y divide-gray-100 text-sm">
                    </tbody>
            </table>
        </div>
    </div>

    <div class="bg-white rounded-xl shadow overflow-hidden">
        <div class="p-3 bg-gray-50 border-b"><input oninput="search(this.value)" placeholder="🔍 Search items..." class="w-full p-2 bg-white border rounded text-sm outline-none focus:border-semantic-trust"></div>
        <div class="overflow-x-auto">
            <table class="w-full text-left">
                <thead class="bg-gray-50 border-b text-semantic-muted text-[10px] uppercase"><tr><th class="p-3">Item</th><th class="p-3">Info</th><th class="p-3">Seller</th><th class="p-3">Status</th><th class="p-3 text-right">Action</th></tr></thead>
                <tbody id="tableBody" class="divide-y text-gray-600"></tbody>
            </table>
        </div>
    </div>

    <div id="blacklistModal" class="hidden fixed inset-0 bg-black/90 z-50 flex items-center justify-center p-4 backdrop-blur-sm"><div class="bg-white rounded-xl p-6 w-full max-w-md"><div class="flex justify-between mb-4"><h2 class="font-bold text-semantic-danger">🚫 Banned</h2><button onclick="document.getElementById('blacklistModal').classList.add('hidden')">&times;</button></div><ul id="blacklistList" class="max-h-60 overflow-y-auto mb-4 space-y-2 text-xs"></ul></div></div>
    <div id="auditModal" class="hidden fixed inset-0 bg-black/95 z-50 flex flex-col p-4 backdrop-blur-sm"><div class="bg-white rounded-xl w-full max-w-6xl mx-auto h-full flex flex-col shadow-2xl overflow-hidden"><div class="p-4 border-b bg-gray-50 flex justify-between items-center"><div><h2 class="text-lg font-bold text-gray-800">👮 AUDIT VAULT</h2><p class="text-[10px] text-gray-500 font-mono">CONFIDENTIAL</p></div><button onclick="document.getElementById('auditModal').classList.add('hidden')" class="bg-red-100 text-red-600 px-3 py-1 rounded font-bold text-xs">CLOSE</button></div><div class="flex-1 overflow-auto p-4 bg-gray-100"><table class="w-full text-left border-collapse bg-white shadow text-xs font-mono"><thead class="bg-gray-800 text-white sticky top-0"><tr><th class="p-2 border">TIME</th><th class="p-2 border">WHATSAPP</th><th class="p-2 border">IP</th><th class="p-2 border">GEO</th><th class="p-2 border">ISP</th><th class="p-2 border">DEVICE</th></tr></thead><tbody id="auditBody" class="divide-y"></tbody></table></div></div></div>
    <div id="imgModal" class="hidden fixed inset-0 bg-black/95 z-50 flex items-center justify-center p-4 cursor-pointer" onclick="this.classList.add('hidden')"><img id="modalImg" class="max-h-screen rounded border-4 border-white"></div>
    <audio id="ping" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"></audio>

    <script>
        const supabase = window.supabase.createClient('https://vimovhpweucvperwhyzi.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZpbW92aHB3ZXVjdnBlcndoeXppIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY0ODE1MjUsImV4cCI6MjA4MjA1NzUyNX0.u6KDe2RCwCcWdClkGA61q2LORqzmPU0KNP9tZTZfOfc');
        let data = [];
        let adHistory = [];
        let currentLiveAd = "";

        (async()=>{
            const {data:{user}} = await supabase.auth.getUser();
            if(!user || !(await supabase.from('admins').select('id').eq('id', user.id).single()).data) return location.href='login.html';
            
            await Promise.all([loadData(), loadAdSystem()]);
            
            // 1. PRODUCT Realtime
            supabase.channel('admin').on('postgres_changes',{event:'*',schema:'public',table:'products'}, p=>{
                if(p.eventType==='INSERT') { data.unshift(p.new); document.getElementById('ping').play().catch(()=>{}); render(data, p.new.id); }
                if(p.eventType==='DELETE') { data = data.filter(i=>i.id!==p.old.id); render(data); }
                if(p.eventType==='UPDATE') { const idx=data.findIndex(i=>i.id===p.new.id); if(idx!==-1) data[idx]=p.new; render(data); }
                updateStats();
            }).subscribe();

            // 2. AD Realtime (As per your request)
            supabase.channel('admin_ads').on('postgres_changes', { event: '*', schema: 'public', table: 'admin_settings' }, payload => {
                if(payload.new && payload.new.key === 'global_alert') {
                    currentLiveAd = payload.new.value;
                    renderAdManager();
                    updatePreviewBar(currentLiveAd);
                }
            }).subscribe();

        })();

        // --- AD SYSTEM LOGIC ---
        async function loadAdSystem() {
            // Get Live Ad
            const { data: live } = await supabase.from('admin_settings').select('value').eq('key', 'global_alert').single();
            currentLiveAd = live ? live.value : "";
            updatePreviewBar(currentLiveAd);
            
            // Get History
            const { data: hist } = await supabase.from('ad_history').select('*').order('created_at', { ascending: false });
            adHistory = hist || [];
            
            renderAdManager();
        }

        function updatePreviewBar(text) {
            const bar = document.getElementById('livePreviewBar');
            const txt = document.getElementById('adText');
            if(text && text.trim() !== "") {
                bar.classList.remove('hidden');
                txt.innerText = text;
            } else {
                bar.classList.add('hidden');
            }
        }

        function renderAdManager() {
            // Update Live Indicator
            const ind = document.getElementById('liveIndicator');
            if(currentLiveAd && currentLiveAd.trim() !== "") {
                ind.className = "text-[10px] bg-semantic-success text-white px-2 py-1 rounded font-bold uppercase animate-pulse";
                ind.innerText = "● LIVE ON SITE";
            } else {
                ind.className = "text-[10px] bg-gray-200 text-gray-500 px-2 py-1 rounded font-bold uppercase";
                ind.innerText = "OFF AIR";
            }

            // Render List
            const tbody = document.getElementById('adHistoryBody');
            tbody.innerHTML = adHistory.map(ad => {
                const isActive = ad.content === currentLiveAd;
                return `
                <tr class="hover:bg-yellow-50 transition">
                    <td class="p-3 text-gray-700 font-medium">${ad.content}</td>
                    <td class="p-3 text-center">
                        <button onclick="toggleAd('${ad.id}')" class="tap text-xs px-3 py-1 rounded-full font-bold border ${isActive ? 'bg-semantic-success text-white border-semantic-success' : 'bg-white text-gray-400 border-gray-200 hover:border-gray-400'}">
                            ${isActive ? '👁️ LIVE' : '⚪ OFF'}
                        </button>
                    </td>
                    <td class="p-3 text-right">
                        <button onclick="deleteAd('${ad.id}')" class="tap text-gray-400 hover:text-red-500 transition" title="Delete Permanent">
                            🗑️
                        </button>
                    </td>
                </tr>
                `;
            }).join('');
        }

        async function saveNewAd() {
            const txt = document.getElementById('newAdInput').value;
            if(!txt) return;
            const btn = document.querySelector('button[onclick="saveNewAd()"]'); btn.innerText = "...";
            
            // Save to History
            await supabase.from('ad_history').insert({ content: txt });
            document.getElementById('newAdInput').value = "";
            btn.innerText = "SAVE TO LIST";
            loadAdSystem(); // Refresh list
        }

        async function toggleAd(id) {
            const ad = adHistory.find(a => a.id === id);
            if(!ad) return;

            // Logic: If clicking the ACTIVE one, turn it OFF. If clicking INACTIVE, turn it ON.
            const newStatus = (ad.content === currentLiveAd) ? "" : ad.content;
            
            // Update Live Setting
            await supabase.from('admin_settings').upsert({ key: 'global_alert', value: newStatus });
            
            // Update local state immediately for UI snap
            currentLiveAd = newStatus;
            renderAdManager();
            updatePreviewBar(currentLiveAd);
        }

        async function deleteAd(id) {
            if(!confirm("Delete this ad from history?")) return;
            await supabase.from('ad_history').delete().eq('id', id);
            loadAdSystem();
        }

        // --- PRODUCT LOGIC ---
        async function loadData() { const { data: d } = await supabase.from('products').select('*').order('created_at',{ascending:false}); data = d || []; updateStats(); render(data); }
        function render(items, highId=null) {
            document.getElementById('tableBody').innerHTML = items.map(p => `
                <tr class="hover:bg-blue-50 transition border-b ${p.id===highId?'new-item':''}">
                    <td class="p-3"><img src="${p.image_url}" onclick="showImg('${p.image_url}')" class="w-8 h-8 rounded border object-cover cursor-zoom-in"></td>
                    <td class="p-3"><div class="font-bold text-xs">${p.title}</div><div class="text-[10px] text-gray-500">${p.campus} • ₦${Number(p.price).toLocaleString()}</div></td>
                    <td class="p-3 font-mono text-[10px] text-semantic-trust">${p.whatsapp_number}</td>
                    <td class="p-3">${p.is_master ? '<span class="bg-yellow-100 text-yellow-800 text-[9px] px-1 rounded border border-yellow-200">👑 VERIFIED</span>' : '<span class="bg-gray-100 text-gray-500 text-[9px] px-1 rounded">USER</span>'}</td>
                    <td class="p-3 text-right flex justify-end gap-1">
                        <button onclick="toggle('${p.id}',${!p.is_master})" class="text-[9px] border px-2 py-1 rounded font-bold hover:bg-gray-100">${p.is_master?'Unverify':'VERIFY'}</button>
                        <button onclick="ban('${p.whatsapp_number}')" class="text-[9px] bg-gray-800 text-white px-2 py-1 rounded font-bold hover:bg-black">BAN</button>
                    </td>
                </tr>`).join('');
        }
        function updateStats() {
            document.getElementById('countTotal').innerText = data.length;
            const ver = data.filter(i=>i.is_master).length;
            document.getElementById('countVerified').innerText = ver;
            document.getElementById('revenue').innerText = `₦${(ver*5000).toLocaleString()}`;
        }
        async function toggle(id, s) { await supabase.rpc('admin_toggle_verify',{p_id:id,p_status:s}); }
        async function ban(n) { const r=prompt('Reason?'); if(!r) return; await supabase.rpc('admin_ban_user',{p_number:n,p_reason:r}); alert('Banned.'); }
        
        async function viewAuditLogs() {
            const btn=document.querySelector('button[onclick="viewAuditLogs()"]'); btn.innerText="DECRYPTING...";
            const {data:logs, error} = await supabase.from('audit_trail').select('*').order('created_at',{ascending:false}).limit(100);
            if(error) { alert("Access Denied"); btn.innerHTML='<span>🕵️</span> AUDIT LOGS'; return; }
            document.getElementById('auditBody').innerHTML = logs.map(l => `<tr class="hover:bg-yellow-50"><td class="p-2 border text-gray-500">${new Date(l.created_at).toLocaleString()}</td><td class="p-2 border font-bold text-blue-800">${l.whatsapp_number}</td><td class="p-2 border text-red-600">${l.ip_address}</td><td class="p-2 border">${l.geo_location}</td><td class="p-2 border text-gray-600">${l.network_provider}</td><td class="p-2 border text-gray-400 truncate max-w-[100px]" title="${l.device_info}">${l.device_info}</td></tr>`).join('');
            document.getElementById('auditModal').classList.remove('hidden'); btn.innerHTML='<span>🕵️</span> AUDIT LOGS';
        }
        async function viewBlacklist() {
            const { data } = await supabase.from('blacklist').select('*');
            document.getElementById('blacklistList').innerHTML = data.map(b=>`<li class="flex justify-between p-2 bg-gray-50 border mb-1 rounded"><span>${b.whatsapp_number} (${b.reason})</span><button onclick="unban('${b.whatsapp_number}')" class="text-semantic-trust font-bold">UNBAN</button></li>`).join('');
            document.getElementById('blacklistModal').classList.remove('hidden');
        }
        async function unban(n) { if(confirm('Unban?')) { await supabase.from('blacklist').delete().eq('whatsapp_number',n); viewBlacklist(); } }
        async function handleLogout() { await supabase.auth.signOut(); location.href='login.html'; }
        function search(v) { render(data.filter(i=>JSON.stringify(i).toLowerCase().includes(v.toLowerCase()))); }
        function showImg(src) { document.getElementById('modalImg').src=src; document.getElementById('imgModal').classList.remove('hidden'); }
    </script>
</body>
</html>
