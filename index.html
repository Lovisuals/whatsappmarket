<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Campus Market | Nigeria</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23008069%22/><path d=%22M30 35h5l7 30h30l7-22H38%22 fill=%22none%22 stroke=%22white%22 stroke-width=%226%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/><circle cx=%2245%22 cy=%2275%22 r=%225%22 fill=%22white%22/><circle cx=%2270%22 cy=%2275%22 r=%225%22 fill=%22white%22/><path d=%22M75 15c-5 0-9 4-9 9 0 2 1 4 2 5l-2 7 8-2c2 1 4 1 5 1 5 0 9-4 9-9s-4-9-9-9z%22 fill=%22%2325D366%22/></svg>">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="theme.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        .animate-shake { animation: shake 0.5s; }
        @keyframes shake { 0%, 100% {transform: translateX(0);} 20%, 60% {transform: translateX(-10px);} 40%, 80% {transform: translateX(10px);} }
        .spinner { border: 2px solid rgba(255,255,255,0.3); border-left-color: #fff; border-radius: 50%; width: 18px; height: 18px; animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-wa-bg min-h-screen font-ui text-gray-800 select-none pb-24">

    <div id="adBar" class="hidden marquee-container bg-black text-white py-1">
        <div id="adTrack" class="marquee-track text-[10px] font-bold"></div>
    </div>

    <header class="bg-wa-teal text-white sticky top-0 z-40 shadow-lg">
        <div class="flex justify-between items-center px-4 py-3">
            <h1 class="font-bold text-xl tracking-tight">CampusMarket <span class="text-[10px] bg-white text-wa-teal px-1.5 py-0.5 rounded font-extrabold uppercase">NG</span></h1>
            <div class="flex gap-2 items-center">
                <button id="adminGateBtn" onclick="handleAdminGate()" class="opacity-20 hover:opacity-100 text-[8px] font-bold transition uppercase">Admin</button>
                <button onclick="openModal('verifiedModal')" class="tap bg-white/20 backdrop-blur-md text-white px-3 py-1 rounded-full text-[10px] font-bold border border-white/30 flex items-center gap-1">
                    👑 <span>PREMIUM</span>
                </button>
            </div>
        </div>
        <div class="flex gap-3 overflow-x-auto px-4 pb-3 scrollbar-hide" id="campusList"></div>
    </header>

    <div id="filterBar" class="bg-white p-4 shadow-md border-b border-gray-100 sticky top-[108px] z-30">
        <input type="text" id="searchInput" oninput="renderFeed()" placeholder="Search items..." class="w-full p-3 rounded-xl bg-gray-100 mb-3 text-sm outline-none focus:ring-2 focus:ring-wa-teal">
        <div class="flex gap-2">
            <button onclick="setTypeFilter('All')" id="btn-filter-All" class="type-btn tap flex-1 bg-wa-teal text-white py-2.5 rounded-full text-xs font-bold shadow-sm">ALL</button>
            <button onclick="setTypeFilter('Physical')" id="btn-filter-Physical" class="type-btn tap flex-1 bg-gray-50 border border-gray-200 py-2.5 rounded-full text-xs font-bold text-gray-400">PHYSICAL</button>
            <button onclick="setTypeFilter('Digital')" id="btn-filter-Digital" class="type-btn tap flex-1 bg-gray-50 border border-gray-200 py-2.5 rounded-full text-xs font-bold text-gray-400">DIGITAL</button>
        </div>
    </div>

    <main id="feed" class="p-3 grid grid-cols-2 md:grid-cols-4 gap-3 min-h-[60vh]"></main>

    <button id="addBtn" onclick="openModal('sellModal')" class="fixed bottom-6 right-6 bg-wa-teal text-white w-14 h-14 rounded-2xl flex items-center justify-center text-3xl shadow-xl active:scale-90 transition transform z-50">+</button>

    <script>
        const supabase = window.initSupabase?.() || null;
        let allProducts = [];
        let isAdmin = false;
        let currentFilter = 'All';
        let currentCampus = 'All';
        const campuses = ["All", "UNILAG", "LASU", "UNILORIN", "UI", "OAU", "ABU", "UNIBEN", "UNIPORT"];

        // --- 1. CORE UTILS (Globally Bound) ---
        window.openModal = id => { document.getElementById(id)?.classList.remove('hidden'); document.body.style.overflow = 'hidden'; }
        window.closeModal = id => { document.getElementById(id)?.classList.add('hidden'); document.body.style.overflow = 'auto'; }

        // --- 2. BOOTSTRAP ---
        (async function init() {
            if (!supabase) return;
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                isAdmin = await checkAdminStatus(session.user.id);
                if (isAdmin) document.getElementById('adminGateBtn').textContent = "DASHBOARD";
            }
            await loadMarket();
            renderCampusList();
            initTicker();
            initCampusSelect();
            setupRealtime();
        })();

        // --- 3. DATA & UI LOGIC ---
        async function loadMarket() {
            const { data } = await supabase.from('products').select('*').order('created_at', { ascending: false });
            allProducts = data || [];
            renderFeed();
        }

        window.renderFeed = () => {
            const feed = document.getElementById('feed');
            const term = (document.getElementById('searchInput')?.value || '').toLowerCase();
            const filtered = allProducts.filter(p => {
                const matchesType = currentFilter === 'All' || p.item_type === currentFilter;
                const matchesCampus = currentCampus === 'All' || p.campus === currentCampus;
                const matchesSearch = p.title.toLowerCase().includes(term);
                return matchesType && matchesCampus && matchesSearch;
            });
            feed.innerHTML = filtered.map(p => `
                <div class="bg-white rounded-2xl shadow-sm overflow-hidden flex flex-col border border-gray-100 animate-fade">
                    <img src="${p.images?.[0] || 'https://placehold.co/400x300'}" class="h-40 w-full object-cover">
                    <div class="p-3">
                        <h3 class="font-bold text-xs truncate">${p.title}</h3>
                        <p class="text-[9px] text-wa-teal font-extrabold uppercase">${p.campus}</p>
                        <div class="flex justify-between items-center mt-2">
                            <p class="font-black text-sm">₦${Number(p.price).toLocaleString()}</p>
                            <a href="https://wa.me/${p.whatsapp_number}" class="bg-wa-teal text-white p-2 rounded-xl">WA</a>
                        </div>
                    </div>
                </div>
            `).join('');
        };

        // --- 4. ADMIN & ACTIONS ---
        window.handleAdminGate = () => isAdmin ? window.openModal('adminOverlay') : window.openModal('loginModal');
        
        window.setTypeFilter = t => {
            currentFilter = t;
            document.querySelectorAll('.type-btn').forEach(b => b.classList.replace('bg-wa-teal', 'bg-gray-50'));
            document.getElementById('btn-filter-' + t).classList.replace('bg-gray-50', 'bg-wa-teal');
            renderFeed();
        };

        window.setCampusFilter = c => { currentCampus = c; renderCampusList(); renderFeed(); };

        // (Include your handleLogin, handlePostAd, and loadAdminData functions here)

        // --- CRITICAL: GLOBAL ATTACHMENT ---
        window.handleAdminGate = handleAdminGate;
        window.handleLogout = async () => { await supabase.auth.signOut(); location.reload(); };
        window.toggleVerify = async (id, cur) => { await supabase.from('products').update({ is_master: !cur }).eq('id', id); loadMarket(); };
    </script>
</body>
</html>
