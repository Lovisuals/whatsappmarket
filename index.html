<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Campus Market | Nigeria</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23008069%22/><path d=%22M30 35h5l7 30h30l7-22H38%22 fill=%22none%22 stroke=%22white%22 stroke-width=%226%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/><circle cx=%2245%22 cy=%2275%22 r=%225%22 fill=%22white%22/><circle cx=%2270%22 cy=%2275%22 r=%225%22 fill=%22white%22/><path d=%22M75 15c-5 0-9 4-9 9 0 2 1 4 2 5l-2 7 8-2c2 1 4 1 5 1 5 0 9-4 9-9s-4-9-9-9z%22 fill=%22%2325D366%22/></svg>">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script src="theme.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="select-none text-gray-800 font-ui bg-wa-bg pb-24">

    <div id="adBar" class="hidden marquee-container">
        <div id="adTrack" class="marquee-track"></div>
    </div>

    <header class="bg-wa-teal text-white pt-4 pb-2 sticky top-0 z-40 shadow-lg backdrop-blur-md bg-opacity-95">
        <div class="flex justify-between items-center px-4 mb-4">
            <h1 class="font-bold text-xl tracking-tight flex items-center gap-2">
                CampusMarket <span class="text-[10px] bg-white text-wa-teal px-1.5 py-0.5 rounded font-extrabold shadow-sm">NG</span>
            </h1>
            <button onclick="toggleModal('verifiedModal', true)" class="tap bg-white/20 backdrop-blur-md text-white px-3 py-1 rounded-full text-[10px] font-bold border border-white/30 flex items-center gap-1">
                👑 <span>PREMIUM</span>
            </button>
        </div>
        <div class="flex gap-3 overflow-x-auto px-4 pb-2 scrollbar-hide" id="campusList"></div>
    </header>

    <div id="filterBar" class="bg-white p-4 shadow-wa border-b border-gray-100 sticky top-[110px] z-30 animate-fade">
        <input type="text" id="searchInput" placeholder="Search phones, laptops, hostels..." class="w-full bg-gray-100 p-3 rounded-xl text-sm mb-3 outline-none focus:ring-2 focus:ring-wa-teal transition">
        <div class="flex gap-2">
            <button onclick="filterType('All', this)" class="type-btn tap flex-1 bg-wa-teal text-white py-2.5 rounded-full text-xs font-bold shadow-sm">ALL</button>
            <button onclick="filterType('Physical', this)" class="type-btn tap flex-1 bg-gray-50 border border-gray-200 py-2.5 rounded-full text-xs font-bold text-semantic-muted">PHYSICAL</button>
            <button onclick="filterType('Digital', this)" class="type-btn tap flex-1 bg-gray-50 border border-gray-200 py-2.5 rounded-full text-xs font-bold text-semantic-muted">DIGITAL</button>
        </div>
    </div>

    <main id="feed" class="p-3 grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 min-h-[60vh]"></main>

    <button onclick="toggleModal('sellModal', true)" class="fab fixed bottom-6 right-6 bg-wa-teal text-white w-14 h-14 rounded-2xl flex items-center justify-center text-3xl shadow-xl z-50">
        <span>+</span>
    </button>

    <div id="sellModal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-end sm:items-center justify-center backdrop-blur-sm p-0 sm:p-4">
        <div class="glass bg-white rounded-t-[2rem] sm:rounded-[1.5rem] w-full max-w-sm overflow-hidden animate-pop">
            <div class="bg-wa-teal p-5 text-white flex justify-between items-center shadow-md">
                <h2 class="font-bold uppercase text-xs tracking-widest">Post Your Item</h2>
                <button onclick="toggleModal('sellModal', false)" class="text-2xl">&times;</button>
            </div>
            <form id="sellForm" class="p-6 space-y-4 max-h-[70vh] overflow-y-auto">
                <div class="tap w-full h-32 bg-gray-50 border-2 border-dashed border-gray-300 rounded-2xl flex flex-col items-center justify-center relative overflow-hidden" onclick="document.getElementById('fileInput').click()">
                    <input type="file" id="fileInput" accept="image/*" multiple class="hidden">
                    <div id="uploadPlaceholder" class="text-center"><p class="text-2xl mb-1">📷</p><span class="text-[10px] font-bold text-semantic-muted uppercase">Upload (Max 3)</span></div>
                    <div id="previewContainer" class="hidden w-full h-full flex gap-2 p-2 overflow-x-auto bg-gray-50 absolute inset-0"></div>
                </div>
                <input type="text" id="title" placeholder="What are you selling?" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 text-sm outline-none" required>
                <div class="flex gap-2">
                    <input type="number" id="price" placeholder="₦ Price" class="w-1/2 bg-gray-50 border border-gray-200 rounded-xl p-3 text-sm outline-none" required>
                    <select id="type" class="w-1/2 bg-gray-50 border border-gray-200 rounded-xl p-3 text-sm outline-none"><option value="Physical">Physical</option><option value="Digital">Digital</option></select>
                </div>
                <select id="campusSelect" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 text-sm outline-none" required>
                    <option value="" disabled selected>Select Your Campus</option>
                    <option value="UNILAG">UNILAG</option><option value="UI">UI Ibadan</option><option value="OAU">OAU Ife</option><option value="UNIBEN">UNIBEN</option><option value="LASU">LASU</option>
                </select>
                <input type="tel" id="whatsapp" placeholder="WhatsApp Number" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 text-sm outline-none" required>
                <button type="submit" id="submitBtn" class="tap w-full bg-wa-teal text-white py-4 rounded-xl font-bold uppercase text-xs tracking-widest shadow-lg">Post Ad Now</button>
            </form>
        </div>
    </div>

    <div id="verifiedModal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="glass bg-white rounded-[1.5rem] p-8 w-full max-w-sm text-center animate-pop">
            <h2 class="text-4xl mb-4">👑</h2>
            <h3 class="font-bold text-lg text-wa-teal uppercase tracking-tight">Verified Membership</h3>
            <p class="text-[11px] text-semantic-muted my-4 leading-relaxed">Verified users get a trusted badge, appear at the top, and post more items daily.</p>
            <div class="space-y-3">
                <a href="https://wa.me/2347068516779" class="tap block w-full bg-wa-teal text-white py-3.5 rounded-xl font-bold shadow-md">VERIFY NOW (₦5,000)</a>
                <button onclick="toggleModal('verifiedModal', false)" class="text-[10px] font-bold text-semantic-muted uppercase tracking-widest">Maybe Later</button>
            </div>
        </div>
    </div>

    <script>
        const supabase = window.initSupabase();
        let allProducts = [];
        let currentFilter = 'All';
        let currentCampus = 'All';

        const campuses = [
            { id: 'All', name: 'All', logo: '🌍' },
            { id: 'UNILAG', name: 'UNILAG', logo: 'https://ui-avatars.com/api/?name=U+L&background=fff&color=008069&bold=true' },
            { id: 'UI', name: 'UI Ibadan', logo: 'https://ui-avatars.com/api/?name=U+I&background=fff&color=008069&bold=true' },
            { id: 'OAU', name: 'OAU Ife', logo: 'https://ui-avatars.com/api/?name=O+A&background=fff&color=008069&bold=true' }
        ];

        // --- UI UTILS ---
        function toggleModal(id, show) {
            const el = document.getElementById(id);
            if (show) el.classList.remove('hidden');
            else el.classList.add('hidden');
        }

        function renderCampusList() {
            document.getElementById('campusList').innerHTML = campuses.map(c => `
                <button onclick="setCampus('${c.id}')" class="tap flex-shrink-0 flex items-center gap-2 px-4 py-1.5 rounded-full transition ${currentCampus===c.id?'bg-white text-wa-teal shadow-md':'bg-white/10 text-white border border-white/20'}">
                    ${c.id==='All'?`<span>${c.logo}</span>`:`<img src="${c.logo}" class="w-4 h-4 rounded-full">`}
                    <span class="text-xs font-bold whitespace-nowrap">${c.name}</span>
                </button>
            `).join('');
        }

        window.setCampus = (id) => { currentCampus = id; renderCampusList(); loadMarket(); };

        window.filterType = (type, btn) => { 
            currentFilter = type; 
            document.querySelectorAll('.type-btn').forEach(b => {
                b.className = "type-btn tap flex-1 bg-gray-50 border border-gray-200 py-2.5 rounded-full text-xs font-bold text-semantic-muted";
            });
            btn.className = "type-btn tap flex-1 bg-wa-teal text-white py-2.5 rounded-full text-xs font-bold shadow-sm";
            renderFeed(); 
        };

        // --- ADAPTIVE TICKER ---
        function updateAd(text) {
            const bar = document.getElementById('adBar');
            const track = document.getElementById('adTrack');
            if (text && text.trim() !== "") {
                bar.classList.remove('hidden');
                const content = `<div class="marquee-item"><span>📢</span><span>${text}</span></div>`;
                const repeatCount = Math.max(4, Math.ceil((window.innerWidth * 2) / 200));
                track.innerHTML = content.repeat(repeatCount);
                const duration = Math.min(60, Math.max(15, track.scrollWidth / 50));
                track.style.animationDuration = `${duration}s`;
            } else { bar.classList.add('hidden'); }
        }

        // --- DATA LOGIC ---
        async function loadMarket() {
            let query = supabase.from('products').select('*').order('created_at', { ascending: false });
            if (currentCampus !== 'All') query = query.eq('campus', currentCampus);
            const { data } = await query;
            if (data) { allProducts = data; renderFeed(); }
        }

        function renderFeed() {
            const feed = document.getElementById('feed');
            const term = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allProducts.filter(p => (currentFilter === 'All' || p.item_type === currentFilter) && p.title.toLowerCase().includes(term));
            
            if (filtered.length === 0) {
                feed.innerHTML = `<div class="col-span-full text-center py-20 text-semantic-muted text-xs">No items found matching your filters.</div>`;
                return;
            }

            feed.innerHTML = filtered.map(i => `
                <div class="product-card tap animate-fade bg-white rounded-2xl overflow-hidden shadow-wa border border-gray-100 flex flex-col">
                    <div class="relative h-40 bg-gray-50">
                        <img loading="lazy" src="${i.images?.[0] || 'https://placehold.co/400x300?text=No+Image'}" class="w-full h-full object-cover">
                        ${i.is_master ? '<span class="absolute top-2 left-2 bg-wa-light text-white text-[8px] px-2 py-1 rounded-full font-bold shadow-sm">VERIFIED</span>' : ''}
                        <span class="absolute bottom-2 right-2 bg-black/50 text-white text-[8px] px-2 py-1 rounded-md backdrop-blur-md uppercase font-bold">${i.item_type}</span>
                    </div>
                    <div class="p-3 flex-1 flex flex-col">
                        <h3 class="font-bold text-xs truncate">${i.title}</h3>
                        <p class="text-wa-teal font-extrabold text-sm mt-1">₦${Number(i.price).toLocaleString()}</p>
                        <p class="text-[9px] text-semantic-muted uppercase font-bold mt-1">${i.campus}</p>
                        <a href="https://wa.me/${(i.whatsapp_number || '').replace(/\D/g,'')}" target="_blank" class="tap mt-3 block w-full bg-wa-surface border border-gray-200 text-wa-teal py-2 rounded-xl text-[10px] font-bold text-center">MESSAGE</a>
                    </div>
                </div>
            `).join('');
        }

        // --- SUBMISSION & PREVIEW ---
        document.getElementById('fileInput').addEventListener('change', (e) => {
            const container = document.getElementById('previewContainer');
            const placeholder = document.getElementById('uploadPlaceholder');
            container.innerHTML = '';
            if (e.target.files.length > 0) {
                placeholder.classList.add('hidden'); container.classList.remove('hidden');
                Array.from(e.target.files).slice(0, 3).forEach(f => {
                    const url = URL.createObjectURL(f);
                    const img = document.createElement('img');
                    img.src = url; img.className = "h-full w-20 object-cover rounded-lg border shadow-sm flex-shrink-0";
                    img.onload = () => URL.revokeObjectURL(url);
                    container.appendChild(img);
                });
            } else { placeholder.classList.remove('hidden'); container.classList.add('hidden'); }
        });

        document.getElementById('sellForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const files = document.getElementById('fileInput').files;
            const campus = document.getElementById('campusSelect').value;
            if (!files.length) return alert("Please upload at least one image.");

            btn.disabled = true; btn.innerText = "UPLOADING...";
            try {
                let imageUrls = [];
                for (let file of files) {
                    const path = `products/${Date.now()}_${Math.random().toString(36).substr(2, 9)}.${file.name.split('.').pop()}`;
                    const { error: upErr } = await supabase.storage.from('item-images').upload(path, file);
                    if (upErr) throw upErr;
                    imageUrls.push(supabase.storage.from('item-images').getPublicUrl(path).data.publicUrl);
                }

                const { error: insErr } = await supabase.from('products').insert([{
                    title: document.getElementById('title').value,
                    price: parseInt(document.getElementById('price').value),
                    item_type: document.getElementById('type').value,
                    campus: campus,
                    whatsapp_number: document.getElementById('whatsapp').value.replace(/\D/g, ''),
                    images: imageUrls,
                    is_master: false
                }]);
                if (insErr) throw insErr;

                alert("Success! Your ad is awaiting moderation.");
                location.reload();
            } catch (err) { alert("Error: " + err.message); btn.disabled = false; btn.innerText = "Post Ad Now"; }
        });

        // --- INIT ---
        document.getElementById('searchInput').addEventListener('input', renderFeed);
        (async function init() {
            renderCampusList();
            const { data } = await supabase.from('admin_settings').select('value').eq('key', 'global_alert').single();
            if (data) updateAd(data.value);
            loadMarket();
        })();
    </script>
</body>
</html>
