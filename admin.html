<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Ban Hammer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>body { background-color: #f3f4f6; }</style>
</head>
<body class="p-6 text-sm">

    <div class="flex justify-between items-center mb-6">
        <div>
            <h1 class="text-2xl font-bold text-gray-800">🛡️ Admin Console</h1>
            <p class="text-xs text-gray-500">Security Level: High</p>
        </div>
        <div class="flex gap-3">
             <button onclick="viewBlacklist()" class="bg-gray-800 text-white px-4 py-2 rounded hover:bg-black font-bold text-xs">VIEW BANNED</button>
             <button onclick="handleLogout()" class="bg-red-100 text-red-600 px-4 py-2 rounded hover:bg-red-200 font-bold text-xs">LOGOUT</button>
        </div>
    </div>

    <div id="stats" class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6"></div>

    <div class="bg-white rounded-xl shadow overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full text-left">
                <thead class="bg-gray-100 border-b border-gray-200 text-gray-500 uppercase text-xs">
                    <tr>
                        <th class="p-4">Image</th>
                        <th class="p-4">Item Details</th>
                        <th class="p-4">Seller</th>
                        <th class="p-4">Status</th>
                        <th class="p-4 text-right">Actions</th>
                    </tr>
                </thead>
                <tbody id="tableBody" class="divide-y divide-gray-100">
                    <tr><td colspan="5" class="p-6 text-center text-gray-400">Loading Market Data...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <div id="blacklistModal" class="hidden fixed inset-0 bg-black bg-opacity-90 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-lg p-6 w-full max-w-md">
            <h2 class="text-xl font-bold mb-4 text-red-600">🚫 Banned Numbers</h2>
            <ul id="blacklistList" class="max-h-60 overflow-y-auto space-y-2 mb-4"></ul>
            <button onclick="document.getElementById('blacklistModal').classList.add('hidden')" class="w-full bg-gray-200 py-2 rounded font-bold">Close</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://vimovhpweucvperwhyzi.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZpbW92aHB3ZXVjdnBlcndoeXppIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY0ODE1MjUsImV4cCI6MjA4MjA1NzUyNX0.u6KDe2RCwCcWdClkGA61q2LORqzmPU0KNP9tZTZfOfc';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // --- 1. DEFENSE IN DEPTH: PAGE PROTECTION ---
        (async () => {
            const { data: { user } } = await supabase.auth.getUser();
            if (!user) return location.href = 'login.html';

            const { data: admin } = await supabase.from('admins').select('id').eq('id', user.id).single();
            if (!admin) {
                await supabase.auth.signOut();
                location.href = 'login.html';
            } else {
                loadData();
            }
        })();

        // --- 2. DATA LOADING ---
        async function loadData() {
            const { data } = await supabase.from('products').select('*').order('created_at', { ascending: false });
            
            // Stats
            document.getElementById('stats').innerHTML = `
                <div class="bg-white p-4 rounded border-l-4 border-blue-500"><p class="text-xs text-gray-400 font-bold uppercase">Total</p><p class="text-2xl font-bold">${data.length}</p></div>
                <div class="bg-white p-4 rounded border-l-4 border-yellow-500"><p class="text-xs text-gray-400 font-bold uppercase">Verified</p><p class="text-2xl font-bold">${data.filter(i=>i.is_master).length}</p></div>
                <div class="bg-white p-4 rounded border-l-4 border-red-500"><p class="text-xs text-gray-400 font-bold uppercase">Spam Check</p><p class="text-xl font-bold text-green-600">Active</p></div>
                <div class="bg-white p-4 rounded border-l-4 border-purple-500"><p class="text-xs text-gray-400 font-bold uppercase">Admins</p><p class="text-xl font-bold">1</p></div>
            `;

            // Table
            document.getElementById('tableBody').innerHTML = data.map(p => `
                <tr class="hover:bg-gray-50 transition">
                    <td class="p-4"><img src="${p.image_url}" class="w-10 h-10 rounded object-cover border"></td>
                    <td class="p-4">
                        <div class="font-bold text-gray-800">${p.title}</div>
                        <div class="text-xs text-gray-500">₦${Number(p.price).toLocaleString()} • ${p.item_type}</div>
                    </td>
                    <td class="p-4 font-mono text-blue-600">${p.whatsapp_number}</td>
                    <td class="p-4">${p.is_master ? '✅' : 'user'}</td>
                    <td class="p-4 text-right flex justify-end gap-2">
                        <button onclick="toggleVerify('${p.id}', ${!p.is_master})" class="px-2 py-1 text-xs border rounded hover:bg-gray-100">Verify</button>
                        <button onclick="deleteItem('${p.id}')" class="px-2 py-1 text-xs bg-red-50 text-red-600 border border-red-200 rounded hover:bg-red-100">Del</button>
                        <button onclick="banUser('${p.whatsapp_number}')" class="px-2 py-1 text-xs bg-gray-800 text-white rounded hover:bg-black font-bold">BAN</button>
                    </td>
                </tr>
            `).join('');
        }

        // --- 3. ACTIONS ---
        async function toggleVerify(id, state) {
            await supabase.from('products').update({ is_master: state }).eq('id', id);
            loadData();
        }

        async function deleteItem(id) {
            if(!confirm("Delete item?")) return;
            await supabase.from('products').delete().eq('id', id);
            loadData();
        }

        async function banUser(number) {
            const reason = prompt(`Ban ${number}? Enter reason (or leave empty):`);
            if (reason === null) return;

            // 1. Add to blacklist
            const { error } = await supabase.from('blacklist').insert({ whatsapp_number: number, reason: reason });
            
            if (error) {
                alert("Error banning: " + error.message);
            } else {
                // 2. Nuke all their existing items
                await supabase.from('products').delete().eq('whatsapp_number', number);
                alert(`User ${number} BANNED and all their items deleted.`);
                loadData();
            }
        }

        async function viewBlacklist() {
            const { data } = await supabase.from('blacklist').select('*');
            const list = document.getElementById('blacklistList');
            list.innerHTML = data.length ? '' : '<li class="text-gray-500 text-center">No banned numbers</li>';
            
            data.forEach(b => {
                list.innerHTML += `
                    <li class="flex justify-between items-center bg-gray-50 p-2 rounded">
                        <span class="font-mono text-sm">${b.whatsapp_number}</span>
                        <button onclick="unban('${b.whatsapp_number}')" class="text-xs text-blue-600 hover:underline">Unban</button>
                    </li>`;
            });
            document.getElementById('blacklistModal').classList.remove('hidden');
        }

        async function unban(number) {
            if(!confirm(`Unban ${number}?`)) return;
            await supabase.from('blacklist').delete().eq('whatsapp_number', number);
            viewBlacklist(); // Refresh list
        }

        async function handleLogout() {
            await supabase.auth.signOut();
            location.href = 'login.html';
        }
    </script>
</body>
</html>
