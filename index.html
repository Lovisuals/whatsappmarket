<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Campus Market | Nigeria</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛍️</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="theme.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        .marquee-container { overflow: hidden; white-space: nowrap; position: relative; }
        .marquee-content { display: inline-block; animation: scroll-left 25s linear infinite; }
        @keyframes scroll-left { 0% { transform: translateX(100vw); } 100% { transform: translateX(-100%); } }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .spinner { border: 3px solid #f3f3f3; border-top: 3px solid #008069; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; margin: 0 auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .animate-fade { animation: fadeIn 0.4s ease forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="select-none text-gray-800 bg-gray-50 font-ui pb-24">

    <div id="adBar" class="hidden bg-white border-b border-gray-200 text-wa-teal text-[10px] font-bold py-2 marquee-container z-50">
        <div id="adText" class="marquee-content px-4"></div>
    </div>

    <header class="bg-wa-teal text-white pt-4 pb-2 sticky top-0 z-40 shadow-lg">
        <div class="flex justify-between items-center px-4 mb-4">
            <h1 class="font-bold text-xl tracking-tight">CampusMarket <span class="text-[10px] bg-white text-wa-teal px-1.5 py-0.5 rounded font-extrabold shadow-sm">NG</span></h1>
            <div class="flex items-center gap-3">
                 <button id="adminGateBtn" onclick="AppAction.handleAdminGate()" class="opacity-30 hover:opacity-100 text-[8px] font-bold uppercase tracking-widest">Admin</button>
                 <button onclick="UIController.toggleModal('verifiedModal', true)" class="tap bg-white/20 backdrop-blur-md text-white px-3 py-1 rounded-full text-[10px] font-bold border border-white/30 flex items-center gap-1">👑 PREMIUM</button>
            </div>
        </div>
        <div class="flex gap-3 overflow-x-auto px-4 pb-2 scrollbar-hide" id="campusList"></div>
    </header>

    <div class="bg-white p-4 shadow-sm border-b border-gray-100 sticky top-[108px] z-30">
        <input type="text" id="searchInput" oninput="AppAction.handleSearch()" placeholder="Search items..." class="w-full bg-gray-100 p-3 rounded-xl text-sm mb-3 outline-none focus:ring-2 focus:ring-wa-teal transition">
        <div class="flex gap-2">
            <button id="filter-All" onclick="AppAction.setTypeFilter('All')" class="tap flex-1 bg-wa-teal text-white py-2.5 rounded-full text-xs font-bold shadow-sm">ALL</button>
            <button id="filter-Physical" onclick="AppAction.setTypeFilter('Physical')" class="tap flex-1 bg-gray-50 border border-gray-100 py-2.5 rounded-full text-xs font-bold text-gray-400">PHYSICAL</button>
            <button id="filter-Digital" onclick="AppAction.setTypeFilter('Digital')" class="tap flex-1 bg-gray-50 border border-gray-100 py-2.5 rounded-full text-xs font-bold text-gray-400">DIGITAL</button>
        </div>
    </div>

    <main id="feed" class="p-3 grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 min-h-[60vh]"></main>

    <button onclick="UIController.toggleModal('sellModal', true)" class="fixed bottom-6 right-6 bg-wa-teal text-white w-14 h-14 rounded-2xl flex items-center justify-center text-3xl z-50 shadow-xl active:scale-90 transition">+</button>

    <div id="sellModal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-[1.5rem] w-full max-w-sm overflow-hidden animate-pop">
            <div class="bg-wa-teal p-5 text-white flex justify-between items-center">
                <h2 class="font-bold">POST NEW AD</h2>
                <button onclick="UIController.toggleModal('sellModal', false)" class="text-2xl">&times;</button>
            </div>
            <form id="sellForm" onsubmit="AppAction.handlePost(event)" class="p-6 space-y-4">
                <input type="file" id="fileInput" accept="image/*" multiple class="hidden" onchange="UIController.handlePreview(event)">
                <div class="w-full h-24 bg-gray-50 border-2 border-dashed rounded-xl flex items-center justify-center cursor-pointer overflow-hidden" onclick="document.getElementById('fileInput').click()" id="previewBox">
                    <span class="text-xs text-gray-400 font-bold uppercase">📷 Tap to Upload Images</span>
                </div>
                <input type="text" id="title" placeholder="What are you selling?" class="w-full p-3 bg-gray-100 rounded-xl outline-none text-sm" required>
                <div class="flex gap-2">
                    <input type="number" id="price" placeholder="Price (₦)" class="w-1/2 p-3 bg-gray-100 rounded-xl outline-none text-sm" required>
                    <select id="type" class="w-1/2 p-3 bg-gray-100 rounded-xl outline-none text-sm">
                        <option value="Physical">Physical</option>
                        <option value="Digital">Digital</option>
                    </select>
                </div>
                <select id="sellCampus" class="w-full p-3 bg-gray-100 rounded-xl outline-none text-sm" required></select>
                <input type="tel" id="whatsapp" placeholder="WhatsApp (234...)" class="w-full p-3 bg-gray-100 rounded-xl outline-none text-sm" required>
                <input type="password" id="masterPin" placeholder="Admin PIN (Optional)" class="w-full p-3 bg-yellow-50 rounded-xl outline-none text-sm border border-yellow-200">
                <button type="submit" id="submitBtn" class="w-full bg-wa-teal text-white py-3.5 rounded-xl font-bold">SUBMIT AD</button>
            </form>
        </div>
    </div>

    <div id="verifiedModal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-[2rem] p-8 w-full max-w-sm text-center animate-pop">
            <h2 class="text-4xl mb-4">👑</h2>
            <h3 class="font-bold text-lg text-wa-teal">Join Verified Sellers</h3>
            <p class="text-xs text-gray-500 my-4">Get the badge, hide your number, and rank higher for just ₦5,000.</p>
            <a href="https://wa.me/2347068516779" class="block w-full bg-wa-teal text-white py-4 rounded-xl font-bold shadow-md">CONTACT ADMIN</a>
            <button onclick="UIController.toggleModal('verifiedModal', false)" class="text-[10px] font-bold text-gray-400 uppercase mt-4">Close</button>
        </div>
    </div>

    <script>
        // 1. STATE MANAGER
        const AppState = {
            products: [],
            campus: 'All',
            filter: 'All',
            isAdmin: false,
            page: 0,
            limit: 12,
            hasMore: true
        };

        // 2. SERVICE LAYER (SUPABASE)
        const MarketService = {
            async fetchItems() {
                let query = supabase.from('products').select('*').order('created_at', { ascending: false })
                    .range(AppState.page * AppState.limit, (AppState.page + 1) * AppState.limit - 1);
                
                if (AppState.campus !== 'All') query = query.eq('campus', AppState.campus);
                
                const { data, error } = await query;
                if (error) throw error;
                return data;
            },
            async uploadImages(files) {
                const urls = [];
                for (const file of Array.from(files).slice(0, 3)) {
                    const name = `item_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`;
                    await supabase.storage.from('item-images').upload(name, file);
                    urls.push(supabase.storage.from('item-images').getPublicUrl(name).data.publicUrl);
                }
                return urls;
            },
            async postItem(payload) {
                return await supabase.rpc('post_market_item', payload);
            }
        };

        // 3. UI CONTROLLER (DOM)
        const UIController = {
            renderFeed(append = false) {
                const feed = document.getElementById('feed');
                const term = document.getElementById('searchInput').value.toLowerCase();
                
                const filtered = AppState.products.filter(p => {
                    const matchType = AppState.filter === 'All' || p.item_type === AppState.filter;
                    const matchSearch = p.title.toLowerCase().includes(term);
                    return matchType && matchSearch;
                });

                const html = filtered.map(p => this.createCard(p)).join('');
                append ? feed.innerHTML += html : feed.innerHTML = html;
            },
            createCard(p) {
                const waLink = `https://wa.me/${p.whatsapp_number}?text=Interested%20in%20${encodeURIComponent(p.title)}`;
                return `
                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden flex flex-col animate-fade">
                    <div class="h-40 relative">
                        <img src="${p.images?.[0] || 'https://placehold.co/400x300'}" class="w-full h-full object-cover">
                        ${p.is_master ? '<span class="absolute top-2 left-2 bg-green-500 text-white text-[8px] px-2 py-1 rounded-full font-bold">VERIFIED</span>' : ''}
                        <span class="absolute bottom-2 right-2 bg-black/50 text-white text-[9px] px-2 py-1 rounded-md uppercase">${p.item_type}</span>
                    </div>
                    <div class="p-3">
                        <h3 class="font-bold text-xs truncate text-gray-800">${p.title}</h3>
                        <p class="text-wa-teal font-black text-sm mt-1">₦${Number(p.price).toLocaleString()}</p>
                        <p class="text-[9px] text-gray-400 mt-1 uppercase">${p.campus}</p>
                        <a href="${waLink}" target="_blank" class="block w-full bg-wa-teal/10 text-wa-teal text-center py-2 rounded-xl text-[10px] font-bold mt-3 hover:bg-wa-teal hover:text-white transition">MESSAGE</a>
                    </div>
                </div>`;
            },
            renderCampuses() {
                const list = document.getElementById('campusList');
                const campuses = window.CampusConfig?.campuses || [{id:'All', name:'All'}];
                list.innerHTML = campuses.map(c => `
                    <button onclick="AppAction.setCampus('${c.id}')" class="flex-none px-4 py-1.5 rounded-full text-xs font-bold border transition ${AppState.campus === c.id ? 'bg-white text-wa-teal border-white shadow-md' : 'bg-white/10 text-white border-white/20'}">
                        ${c.name}
                    </button>
                `).join('');
            },
            toggleModal(id, show) {
                document.getElementById(id).classList.toggle('hidden', !show);
            },
            handlePreview(e) {
                const box = document.getElementById('previewBox');
                if (e.target.files.length) {
                    box.innerHTML = `<img src="${URL.createObjectURL(e.target.files[0])}" class="w-full h-full object-cover">`;
                }
            }
        };

        // 4. EVENT HUB (ACTIONS)
        window.AppAction = {
            async init() {
                const supabaseClient = window.initSupabase?.() || window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                window.supabase = supabaseClient;

                // Auth Check
                const { data: { session } } = await supabase.auth.getSession();
                if (session) {
                    const { data: admin } = await supabase.from('admins').select('id').eq('id', session.user.id).maybeSingle();
                    AppState.isAdmin = !!admin;
                    if (AppState.isAdmin) document.getElementById('adminGateBtn').textContent = "DASHBOARD";
                }

                // Initial Load
                UIController.renderCampuses();
                UIController.toggleModal('feed', false); // Ensure feed isn't hidden
                this.refreshMarket();
                this.initRealtime();
                this.loadTicker();

                // Build sell campus select
                const campusSelect = document.getElementById('sellCampus');
                campusSelect.innerHTML = window.CampusConfig.campuses.filter(c => c.id !== 'All').map(c => `<option value="${c.id}">${c.name}</option>`).join('');
            },

            async refreshMarket() {
                try {
                    const data = await MarketService.fetchItems();
                    AppState.products = data;
                    UIController.renderFeed();
                } catch (e) { console.error("Refresh failed", e); }
            },

            setCampus(id) {
                AppState.campus = id;
                AppState.page = 0;
                UIController.renderCampuses();
                this.refreshMarket();
            },

            setTypeFilter(type) {
                AppState.filter = type;
                document.querySelectorAll('.type-btn').forEach(btn => {
                    btn.classList.replace('bg-wa-teal', 'bg-gray-50');
                    btn.classList.replace('text-white', 'text-gray-400');
                });
                document.getElementById('filter-' + type).classList.replace('bg-gray-50', 'bg-wa-teal');
                document.getElementById('filter-' + type).classList.replace('text-gray-400', 'text-white');
                UIController.renderFeed();
            },

            handleSearch() { UIController.renderFeed(); },

            async handlePost(e) {
                e.preventDefault();
                const btn = document.getElementById('submitBtn');
                btn.disabled = true; btn.textContent = "UPLOADING...";

                try {
                    const images = await MarketService.uploadImages(document.getElementById('fileInput').files);
                    const payload = {
                        p_title: document.getElementById('title').value,
                        p_price: document.getElementById('price').value,
                        p_type: document.getElementById('type').value,
                        p_whatsapp: document.getElementById('whatsapp').value,
                        p_images: images,
                        p_campus: document.getElementById('sellCampus').value,
                        p_pin: document.getElementById('masterPin').value || null
                    };

                    const { error } = await MarketService.postItem(payload);
                    if (error) throw error;
                    
                    alert("Success! Your ad is live.");
                    UIController.toggleModal('sellModal', false);
                    e.target.reset();
                    this.refreshMarket();
                } catch (err) {
                    alert("Post Error: " + err.message);
                } finally {
                    btn.disabled = false; btn.textContent = "SUBMIT AD";
                }
            },

            async loadTicker() {
                const { data } = await supabase.from('admin_settings').select('value').eq('key', 'global_alert').single();
                if (data?.value) {
                    document.getElementById('adBar').classList.remove('hidden');
                    document.getElementById('adText').textContent = data.value;
                }
            },

            initRealtime() {
                supabase.channel('public').on('postgres_changes', { event: '*', schema: 'public', table: 'products' }, () => this.refreshMarket()).subscribe();
            },

            handleAdminGate() {
                // If admin, they probably want to see the audit logs or delete items
                // You can add an admin dashboard modal later
                if (AppState.isAdmin) alert("Admin Dashboard Logic: Fetching Audit Logs...");
                else alert("Admin Login Required");
            }
        };

        // Bootstrap on Load
        document.addEventListener('DOMContentLoaded', () => AppAction.init());
    </script>
</body>
</html>
