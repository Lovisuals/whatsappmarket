<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Campus Market | Nigeria</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="theme.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-wa-bg font-ui pb-24 select-none">

    <div id="adBar" class="hidden marquee-container"><div id="adTrack" class="marquee-track"></div></div>

    <header class="bg-wa-teal text-white pt-4 pb-2 sticky top-0 z-40 shadow-lg">
        <div class="flex justify-between items-center px-4 mb-4">
            <h1 class="font-bold text-xl">CampusMarket <span class="text-[10px] bg-white text-wa-teal px-1.5 py-0.5 rounded font-extrabold">NG</span></h1>
            <button onclick="toggleModal('verifiedModal', true)" class="bg-white/20 px-3 py-1 rounded-full text-[10px] font-bold border border-white/30">👑 PREMIUM</button>
        </div>
        <div class="flex gap-3 overflow-x-auto px-4 pb-2 scrollbar-hide" id="campusList"></div>
    </header>

    <div id="filterBar" class="bg-white p-4 shadow-wa sticky top-[110px] z-30">
        <input type="text" id="searchInput" placeholder="Search..." class="w-full bg-gray-100 p-3 rounded-xl text-sm mb-3 outline-none">
        <div class="flex gap-2">
            <button onclick="filterType('All', this)" class="type-btn flex-1 bg-wa-teal text-white py-2 rounded-full text-xs font-bold shadow-md">ALL</button>
            <button onclick="filterType('Physical', this)" class="type-btn flex-1 bg-gray-50 text-gray-400 py-2 rounded-full text-xs font-bold">PHYSICAL</button>
            <button onclick="filterType('Digital', this)" class="type-btn flex-1 bg-gray-50 text-gray-400 py-2 rounded-full text-xs font-bold">DIGITAL</button>
        </div>
    </div>

    <main id="feed" class="p-3 grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 min-h-[60vh]"></main>

    <button onclick="toggleModal('sellModal', true)" class="fab fixed bottom-6 right-6 bg-wa-teal text-white w-14 h-14 rounded-2xl flex items-center justify-center text-3xl shadow-xl z-50">+</button>

    <div id="sellModal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 backdrop-blur-sm">
        <div class="bg-white rounded-t-[2rem] sm:rounded-[1.5rem] w-full max-w-sm overflow-hidden animate-fade">
            <div class="bg-wa-teal p-5 text-white flex justify-between items-center">
                <h2 class="font-bold text-xs uppercase tracking-widest">Post Ad</h2>
                <button onclick="toggleModal('sellModal', false)" class="text-2xl">&times;</button>
            </div>
            <form id="sellForm" class="p-6 space-y-4 max-h-[70vh] overflow-y-auto">
                <div class="w-full h-32 bg-gray-50 border-2 border-dashed border-gray-300 rounded-2xl flex flex-col items-center justify-center relative cursor-pointer" onclick="document.getElementById('fileInput').click()">
                    <input type="file" id="fileInput" accept="image/*" multiple class="hidden">
                    <div id="uploadPlaceholder" class="text-center text-gray-400 text-[10px] font-bold">📷 UPLOAD MAX 3</div>
                    <div id="previewContainer" class="hidden w-full h-full flex gap-2 p-2 absolute inset-0 bg-white rounded-2xl"></div>
                </div>
                <input type="text" id="title" placeholder="Title" class="w-full bg-gray-50 p-3 rounded-xl text-sm outline-none" required>
                <div class="flex gap-2">
                    <input type="number" id="price" placeholder="₦ Price" class="w-1/2 bg-gray-50 p-3 rounded-xl text-sm outline-none" required>
                    <select id="type" class="w-1/2 bg-gray-50 p-3 rounded-xl text-sm outline-none cursor-pointer"><option value="Physical">Physical</option><option value="Digital">Digital</option></select>
                </div>
                <select id="campusSelect" class="w-full bg-gray-50 p-3 rounded-xl text-sm outline-none cursor-pointer" required>
                    <option value="" disabled selected>Select Campus</option>
                    <option value="UNILAG">UNILAG</option><option value="UI">UI Ibadan</option><option value="OAU">OAU Ife</option>
                </select>
                <input type="tel" id="whatsapp" placeholder="WhatsApp Number" class="w-full bg-gray-50 p-3 rounded-xl text-sm outline-none" required>
                <button type="submit" id="submitBtn" class="w-full bg-wa-teal text-white py-4 rounded-xl font-bold uppercase text-xs shadow-lg active:scale-95 transition">Post Ad Now</button>
            </form>
        </div>
    </div>

    <div id="verifiedModal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-[1.5rem] p-8 w-full max-w-sm text-center animate-fade">
            <h2 class="text-4xl mb-4">👑</h2>
            <h3 class="font-bold text-wa-teal uppercase">Verified Membership</h3>
            <p class="text-[11px] text-gray-500 my-4">Rank higher and sell faster with a trusted badge.</p>
            <a href="https://wa.me/2347068516779" class="block w-full bg-wa-teal text-white py-3.5 rounded-xl font-bold shadow-md">VERIFY NOW (₦5,000)</a>
            <button onclick="toggleModal('verifiedModal', false)" class="mt-4 text-[10px] font-bold text-gray-400 uppercase tracking-widest">Maybe Later</button>
        </div>
    </div>

    <script>
        const supabase = window.initSupabase();
        let allProducts = [];
        let currentFilter = 'All';
        let currentCampus = 'All';

        function toggleModal(id, show) {
            document.getElementById(id).classList.toggle('hidden', !show);
        }

        function renderCampuses() {
            document.getElementById('campusList').innerHTML = window.CampusConfig.campuses.map(c => `
                <button onclick="setCampus('${c.id}')" class="flex-shrink-0 flex items-center gap-2 px-4 py-1.5 rounded-full text-xs font-bold transition ${currentCampus===c.id?'bg-white text-wa-teal shadow-md':'bg-white/10 text-white'}">
                    ${c.id==='All'?'🌍':`<img src="${c.logo}" class="w-4 h-4 rounded-full">`} ${c.name}
                </button>
            `).join('');
        }

        window.setCampus = (id) => { currentCampus = id; renderCampuses(); loadMarket(); };

        window.filterType = (type, btn) => {
            currentFilter = type;
            document.querySelectorAll('.type-btn').forEach(b => b.className = "type-btn flex-1 bg-gray-50 text-gray-400 py-2 rounded-full text-xs font-bold");
            btn.className = "type-btn flex-1 bg-wa-teal text-white py-2 rounded-full text-xs font-bold shadow-md";
            renderFeed();
        };

        async function loadMarket() {
            let query = supabase.from('products').select('*').order('created_at', { ascending: false });
            if (currentCampus !== 'All') query = query.eq('campus', currentCampus);
            const { data, error } = await query;
            if (error) return window.CampusWatchdog.report('FETCH_ERR', error.message);
            allProducts = data || [];
            renderFeed();
        }

        function renderFeed() {
            const feed = document.getElementById('feed');
            const term = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allProducts.filter(p => (currentFilter === 'All' || p.item_type === currentFilter) && p.title.toLowerCase().includes(term));
            
            if(filtered.length === 0) {
                feed.innerHTML = `<div class="col-span-full text-center py-20 text-gray-400 text-xs">No items found.</div>`;
                return;
            }

            feed.innerHTML = filtered.map(i => `
                <div class="bg-white rounded-2xl overflow-hidden shadow-wa border border-gray-100 animate-fade flex flex-col transition active:scale-95">
                    <div class="relative h-40 bg-gray-50">
                        <img loading="lazy" src="${i.images?.[0] || 'https://placehold.co/400'}" class="w-full h-full object-cover">
                        ${i.is_master ? '<span class="absolute top-2 left-2 bg-wa-light text-white text-[8px] px-2 py-1 rounded-full font-bold shadow-sm">VERIFIED</span>' : ''}
                    </div>
                    <div class="p-3 flex-1 flex flex-col">
                        <h3 class="font-bold text-xs truncate">${i.title}</h3>
                        <p class="text-wa-teal font-extrabold text-sm mt-1">₦${Number(i.price).toLocaleString()}</p>
                        <a href="https://wa.me/${(i.whatsapp_number||'').replace(/\D/g,'')}" target="_blank" class="mt-3 block w-full bg-wa-surface border border-gray-200 text-wa-teal py-2 rounded-xl text-[10px] font-bold text-center">MESSAGE</a>
                    </div>
                </div>
            `).join('');
        }

        document.getElementById('fileInput').onchange = (e) => {
            const container = document.getElementById('previewContainer');
            container.innerHTML = '';
            if (e.target.files.length) {
                container.classList.remove('hidden');
                Array.from(e.target.files).slice(0, 3).forEach(f => {
                    const img = document.createElement('img');
                    img.src = URL.createObjectURL(f);
                    img.className = "h-full w-20 object-cover rounded-lg border flex-shrink-0";
                    container.appendChild(img);
                });
            }
        };

        document.getElementById('sellForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const files = document.getElementById('fileInput').files;
            if (!files.length) return alert("Please upload images.");
            
            btn.disabled = true; btn.innerText = "POSTING...";
            try {
                let urls = [];
                for (let f of files) {
                    const path = `products/${Date.now()}_${f.name.replace(/\s/g,'_')}`;
                    const { error: upErr } = await supabase.storage.from('item-images').upload(path, f);
                    if (upErr) throw upErr;
                    urls.push(supabase.storage.from('item-images').getPublicUrl(path).data.publicUrl);
                }
                const { error } = await supabase.from('products').insert({
                    title: document.getElementById('title').value,
                    price: parseInt(document.getElementById('price').value),
                    item_type: document.getElementById('type').value,
                    campus: document.getElementById('campusSelect').value,
                    whatsapp_number: document.getElementById('whatsapp').value.replace(/\D/g,''),
                    images: urls
                });
                if (error) throw error;
                location.reload();
            } catch (err) { alert(err.message); btn.disabled = false; btn.innerText = "Post Ad Now"; }
        };

        document.getElementById('searchInput').addEventListener('input', renderFeed);
        window.onload = () => { renderCampuses(); loadMarket(); };
    </script>
</body>
</html>
