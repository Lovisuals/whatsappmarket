<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CampusMarket | Sentinel V12</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2225%22 fill=%22%23008069%22/><path d=%22M30 35h5l7 30h30l7-22H38%22 fill=%22none%22 stroke=%22white%22 stroke-width=%226%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/><path d=%22M75 15c-5 0-9 4-9 9 0 2 1 4 2 5l-2 7 8-2c2 1 4 1 5 1 5 0 9-4 9-9s-4-9-9-9z%22 fill=%22%2325D366%22/></svg>">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="theme.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f0f2f5; }
        
        /* Glassmorphism V2 */
        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.4); }
        .glass-dark { background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(20px); }

        /* Smooth Marquee for Revenue Ticker */
        .ticker-container { overflow: hidden; white-space: nowrap; position: relative; }
        .ticker-content { display: inline-block; animation: scroll-left 30s linear infinite; }
        @keyframes scroll-left { 0% { transform: translateX(100vw); } 100% { transform: translateX(-100%); } }

        /* Product Image Shimmer */
        .shimmer { background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

        .scrollbar-hide::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="select-none text-gray-900 pb-24">

    <div id="adBar" class="hidden bg-black text-white py-2 ticker-container sticky top-0 z-[60]">
        <div id="adText" class="ticker-content px-4 text-[10px] font-black tracking-widest uppercase italic"></div>
    </div>

    <header class="glass sticky top-[30px] z-50 px-4 py-4 border-b flex flex-col gap-3">
        <div class="flex justify-between items-center">
            <h1 class="text-xl font-extrabold tracking-tighter text-wa-teal">CAMPUS<span class="text-black">MARKET</span></h1>
            <div class="flex items-center gap-3">
                <div id="quotaBadge" class="text-[8px] bg-gray-200 px-2 py-1 rounded-full font-bold">POSTS: 0/3</div>
                <button onclick="UIController.toggleModal('verifiedModal', true)" class="bg-wa-teal text-white px-3 py-1 rounded-full text-[9px] font-black">GET 15 ADS/DAY</button>
            </div>
        </div>
        <div class="flex gap-2 overflow-x-auto scrollbar-hide pb-1" id="campusList"></div>
    </header>

    <main id="feed" class="p-4 grid grid-cols-2 md:grid-cols-4 gap-4 min-h-[50vh]"></main>

    <button onclick="UIController.handleFabClick()" class="fixed bottom-6 right-6 bg-wa-teal text-white w-16 h-16 rounded-2xl flex items-center justify-center text-4xl z-50 shadow-2xl transition hover:rotate-90">
        <span class="mb-1">+</span>
    </button>

    <div id="sellModal" class="hidden fixed inset-0 z-[110] glass-dark flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-[2.5rem] overflow-hidden shadow-2xl animate-pop">
            <div class="bg-wa-teal p-6 text-white flex justify-between items-center">
                <div>
                    <h2 class="text-lg font-black uppercase">Post Ad</h2>
                    <p id="quotaWarning" class="text-[9px] opacity-80"></p>
                </div>
                <button onclick="UIController.toggleModal('sellModal', false)" class="text-2xl">&times;</button>
            </div>
            
            <form onsubmit="Sentinel.Actions.handlePost(event)" class="p-6 space-y-4 max-h-[75vh] overflow-y-auto scrollbar-hide">
                <div class="grid grid-cols-1 gap-4">
                    <select id="postCampus" class="w-full p-4 bg-gray-100 rounded-2xl text-xs font-bold outline-none" required></select>
                    <input type="text" id="postTitle" placeholder="Item Name (e.g., Fairly used Laptop)" class="w-full p-4 bg-gray-50 border rounded-2xl text-xs" required>
                    <input type="number" id="postPrice" placeholder="Price (₦)" class="w-full p-4 bg-gray-50 border rounded-2xl text-xs" required>
                </div>

                <div class="relative w-full h-32 border-2 border-dashed rounded-3xl flex flex-col items-center justify-center cursor-pointer hover:bg-gray-50" onclick="document.getElementById('fileInput').click()">
                    <input type="file" id="fileInput" multiple accept="image/*" class="hidden" onchange="UIController.handleImageSelect(event)">
                    <div id="previewContainer" class="flex gap-2 p-2 h-full overflow-hidden">
                        <div class="text-center">
                            <p class="text-2xl">📷</p>
                            <p class="text-[9px] font-black text-gray-400 uppercase">Max 3 Images (Auto-Compressed)</p>
                        </div>
                    </div>
                </div>

                <input type="tel" id="postWhatsapp" placeholder="Your WhatsApp (e.g., 23480...)" class="w-full p-4 bg-gray-50 border rounded-2xl text-xs" required>
                <button type="submit" id="submitBtn" class="w-full bg-wa-teal text-white py-4 rounded-2xl font-black shadow-lg">POST AD NOW</button>
            </form>
        </div>
    </div>

    <script>
        const Sentinel = {
            state: { 
                products: [], 
                campus: 'All', 
                postCount: 0, 
                isVerified: false,
                lastResetDate: null
            },

            async init() {
                window.supabase = window.initSupabase?.();
                this.checkQuota();
                this.UI.renderCampuses();
                await this.Actions.refreshMarket();
                this.Actions.initRealtime();
                this.Actions.loadTicker();
            },

            checkQuota() {
                const today = new Date().toLocaleDateString('en-NG');
                const storedData = JSON.parse(localStorage.getItem('campus_market_quota') || '{}');
                
                // Reset at 12 AM Nigerian Time
                if (storedData.date !== today) {
                    this.state.postCount = 0;
                    this.state.lastResetDate = today;
                    this.saveQuota();
                } else {
                    this.state.postCount = storedData.count || 0;
                }
                
                this.UI.updateQuotaDisplay();
            },

            saveQuota() {
                localStorage.setItem('campus_market_quota', JSON.stringify({
                    date: this.state.lastResetDate || new Date().toLocaleDateString('en-NG'),
                    count: this.state.postCount
                }));
            },

            Actions: {
                async refreshMarket() {
                    let query = window.supabase.from('products').select('*').order('created_at', { ascending: false });
                    if (Sentinel.state.campus !== 'All') query = query.eq('campus', Sentinel.state.campus);
                    const { data } = await query;
                    Sentinel.state.products = data || [];
                    Sentinel.UI.renderFeed();
                },

                async handlePost(e) {
                    e.preventDefault();
                    const maxPosts = Sentinel.state.isVerified ? 15 : 3;
                    
                    if (Sentinel.state.postCount >= maxPosts) {
                        alert(`Quota reached! ${Sentinel.state.isVerified ? 'Premium' : 'Free'} users are limited to ${maxPosts} ads/day. Reset at 12 AM.`);
                        return;
                    }

                    const btn = document.getElementById('submitBtn');
                    btn.disabled = true; btn.textContent = "COMPRESSING...";

                    try {
                        const files = document.getElementById('fileInput').files;
                        const imageUrls = [];
                        
                        for (let i = 0; i < Math.min(files.length, 3); i++) {
                            btn.textContent = `UPLOADING ${i+1}/3...`;
                            const compressed = await this.compressImage(files[i]);
                            const name = `p2p_${Date.now()}_${i}`;
                            await window.supabase.storage.from('item-images').upload(name, compressed);
                            imageUrls.push(window.supabase.storage.from('item-images').getPublicUrl(name).data.publicUrl);
                        }

                        const { error } = await window.supabase.rpc('post_market_item', {
                            p_title: document.getElementById('postTitle').value,
                            p_price: document.getElementById('postPrice').value,
                            p_whatsapp: document.getElementById('postWhatsapp').value.replace(/\D/g,''),
                            p_images: imageUrls,
                            p_campus: document.getElementById('postCampus').value,
                            p_type: 'Physical'
                        });

                        if (error) throw error;

                        Sentinel.state.postCount++;
                        Sentinel.saveQuota();
                        location.reload();

                    } catch (err) { alert(err.message); btn.disabled = false; btn.textContent = "RETRY POST"; }
                },

                compressImage(file) {
                    return new Promise((resolve) => {
                        const reader = new FileReader();
                        reader.readAsDataURL(file);
                        reader.onload = (event) => {
                            const img = new Image();
                            img.src = event.target.result;
                            img.onload = () => {
                                const canvas = document.createElement('canvas');
                                const ctx = canvas.getContext('2d');
                                const scale = Math.min(800 / img.width, 1);
                                canvas.width = img.width * scale;
                                canvas.height = img.height * scale;
                                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                                canvas.toBlob((blob) => resolve(blob), 'image/jpeg', 0.6); // 60% quality
                            };
                        };
                    });
                },

                async loadTicker() {
                    const { data } = await window.supabase.from('admin_settings').select('value').eq('key', 'global_alert').single();
                    if (data?.value) {
                        document.getElementById('adBar').classList.remove('hidden');
                        document.getElementById('adText').textContent = data.value;
                    }
                }
            },

            UI: {
                renderFeed() {
                    const feed = document.getElementById('feed');
                    feed.innerHTML = Sentinel.state.products.map(p => `
                        <div class="glass rounded-3xl overflow-hidden flex flex-col animate-fade border">
                            <div class="h-32 bg-gray-100 relative">
                                <img src="${p.images?.[0]}" class="w-full h-full object-cover">
                                ${p.is_master ? '<div class="absolute top-2 left-2 bg-wa-teal text-white text-[7px] font-black px-2 py-0.5 rounded-full">VERIFIED</div>' : ''}
                            </div>
                            <div class="p-3 space-y-1">
                                <h3 class="font-bold text-[10px] truncate uppercase text-gray-600">${p.title}</h3>
                                <p class="text-wa-teal font-black text-xs">₦${Number(p.price).toLocaleString()}</p>
                                <a href="https://wa.me/${p.whatsapp_number}" target="_blank" class="block w-full bg-wa-teal text-white text-center py-2 rounded-xl text-[9px] font-black mt-2">CHAT TO BUY</a>
                            </div>
                        </div>
                    `).join('');
                },
                updateQuotaDisplay() {
                    const max = Sentinel.state.isVerified ? 15 : 3;
                    document.getElementById('quotaBadge').textContent = `POSTS: ${Sentinel.state.postCount}/${max}`;
                    document.getElementById('quotaWarning').textContent = `Daily limit: ${Sentinel.state.postCount} of ${max} items used.`;
                },
                renderCampuses() {
                    const camps = window.CampusConfig?.campuses || [];
                    document.getElementById('campusList').innerHTML = camps.map(c => `
                        <button onclick="Sentinel.Actions.setCampus('${c.id}')" class="flex-none px-5 py-2 rounded-full text-[10px] font-black border ${Sentinel.state.campus === c.id ? 'bg-wa-teal text-white border-wa-teal' : 'bg-white border-gray-200'}">${c.name}</button>
                    `).join('');
                    document.getElementById('postCampus').innerHTML = camps.filter(c => c.id !== 'All').map(c => `<option value="${c.id}">${c.name}</option>`).join('');
                }
            }
        };

        window.Sentinel = Sentinel;
        document.addEventListener('DOMContentLoaded', () => Sentinel.init());
    </script>
</body>
</html>
