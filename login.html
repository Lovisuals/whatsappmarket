<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script src="theme.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="h-screen flex items-center justify-center p-4 bg-gray-100">

    <div class="bg-white rounded-xl shadow-2xl w-full max-w-sm p-8 border-t-4 border-campus-blue animate-fade">
        <div class="text-center mb-8">
            <div class="inline-block p-3 bg-blue-50 rounded-full text-campus-blue mb-3 text-2xl">🛡️</div>
            <h1 class="text-2xl font-bold text-gray-800">Admin Portal</h1>
            <p class="text-xs text-gray-400 uppercase tracking-widest mt-1">Authorized Personnel Only</p>
        </div>

        <form id="loginForm" class="space-y-5">
            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Email</label>
                <input type="email" id="email" class="w-full bg-gray-50 border border-gray-300 p-3 rounded-lg focus:border-campus-blue outline-none transition" placeholder="admin@market.ng" required>
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Password</label>
                <input type="password" id="password" class="w-full bg-gray-50 border border-gray-300 p-3 rounded-lg focus:border-campus-blue outline-none transition" placeholder="••••••••" required>
            </div>
            
            <div id="errorBox" class="hidden bg-red-50 text-red-600 text-xs p-3 rounded-lg text-center border border-red-100 font-bold"></div>
            
            <button type="submit" id="submitBtn" class="w-full bg-campus-blue text-white font-bold py-3.5 rounded-lg hover:bg-blue-800 transition shadow-lg">
                SECURE LOGIN
            </button>
        </form>
        <p class="text-center mt-6 text-[10px] text-gray-300">System Activity Logged • IP Recorded</p>
    </div>

    <script>
        const SUPABASE_URL = 'https://vimovhpweucvperwhyzi.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZpbW92aHB3ZXVjdnBlcndoeXppIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY0ODE1MjUsImV4cCI6MjA4MjA1NzUyNX0.u6KDe2RCwCcWdClkGA61q2LORqzmPU0KNP9tZTZfOfc';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        (async () => {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) checkAdminStatus(session.user.id);
        })();

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const errorBox = document.getElementById('errorBox');
            btn.innerHTML = '<span class="animate-pulse">VERIFYING...</span>'; btn.disabled = true; errorBox.classList.add('hidden');

            const { data, error } = await supabase.auth.signInWithPassword({
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            });

            if (error) {
                showError(error.message);
                btn.textContent = 'SECURE LOGIN'; btn.disabled = false;
                return;
            }
            await checkAdminStatus(data.user.id);
        });

        async function checkAdminStatus(userId) {
            const { data: admin } = await supabase.from('admins').select('id').eq('id', userId).single();
            if (admin) window.location.href = 'admin.html';
            else {
                await supabase.auth.signOut();
                showError("Access Denied: Not an Admin.");
                document.getElementById('submitBtn').disabled = false;
                document.getElementById('submitBtn').textContent = 'SECURE LOGIN';
            }
        }

        function showError(msg) {
            const box = document.getElementById('errorBox');
            box.textContent = msg; box.classList.remove('hidden');
            document.querySelector('.bg-white').classList.add('animate-shake');
            setTimeout(() => document.querySelector('.bg-white').classList.remove('animate-shake'), 500);
        }
    </script>
</body>
</html>
