<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Campus Market | Nigeria</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛍️</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="theme.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="select-none text-gray-800">

    <div id="adBar" class="hidden bg-wa-surface border-b border-gray-200 text-wa-teal text-xs font-bold py-2 overflow-hidden relative whitespace-nowrap shadow-sm z-50">
        <div id="adText" class="inline-block animate-marquee pl-[100%]">Loading...</div>
    </div>

    <header class="bg-wa-teal text-white pt-4 pb-2 sticky top-0 z-50 shadow-lg backdrop-blur-md bg-opacity-95">
        <div class="flex justify-between items-center px-4 mb-4">
            <h1 class="font-bold text-xl tracking-tight flex items-center gap-2">
                CampusMarket <span class="text-[10px] bg-white text-wa-teal px-1.5 py-0.5 rounded font-extrabold shadow-sm">NG</span>
            </h1>
            <div class="flex items-center gap-3">
                 <button onclick="document.getElementById('verifiedModal').classList.remove('hidden')" class="tap bg-wa-light/20 backdrop-blur-md text-white px-3 py-1 rounded-full text-[10px] font-bold border border-white/30 flex items-center gap-1 hover:bg-wa-light/30 transition">
                    👑 <span>PREMIUM</span>
                 </button>
            </div>
        </div>
        <div class="flex gap-3 overflow-x-auto px-4 pb-2 scrollbar-hide" id="campusList"></div>
    </header>

    <div id="filterBar" class="hidden bg-wa-surface p-4 shadow-md border-b border-gray-100 sticky top-[110px] z-40 animate-fade">
        <input type="text" id="searchInput" placeholder="Search..." class="w-full bg-gray-100 p-3 rounded-xl text-sm mb-3 focus:ring-2 focus:ring-wa-teal outline-none transition placeholder-semantic-muted">
        <div class="flex gap-2">
            <button id="btnAll" onclick="filterFeed('All')" class="tap flex-1 bg-gray-50 border border-gray-200 py-2.5 rounded-full text-xs font-bold shadow-sm">ALL</button>
            <button id="btnPhys" onclick="filterFeed('Physical')" class="tap flex-1 bg-gray-50 border border-gray-200 py-2.5 rounded-full text-xs font-bold text-semantic-muted">PHYSICAL</button>
            <button id="btnDigi" onclick="filterFeed('Digital')" class="tap flex-1 bg-gray-50 border border-gray-200 py-2.5 rounded-full text-xs font-bold text-semantic-muted">DIGITAL</button>
        </div>
    </div>

    <main id="feed" class="p-3 grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 min-h-[60vh]">
        </main>

    <button onclick="document.getElementById('sellModal').classList.remove('hidden')" class="fab fixed bottom-6 right-6 bg-wa-teal text-white w-14 h-14 rounded-2xl flex items-center justify-center text-3xl z-50 shadow-xl active:scale-90 transition transform hover:scale-105 hover:rotate-90"><span class="mb-1">+</span></button>

    <div id="sellModal" class="hidden fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4 backdrop-blur-sm"><div class="glass bg-white/95 rounded-[1.5rem] w-full max-w-sm overflow-hidden shadow-2xl relative animate-fade"><div class="bg-wa-teal p-5 text-white flex justify-between items-center shadow-md"><h2 class="font-bold tracking-wide">POST ITEM</h2><button onclick="document.getElementById('sellModal').classList.add('hidden')" class="tap text-2xl hover:text-red-200">&times;</button></div><form id="sellForm" class="p-6 space-y-4 max-h-[80vh] overflow-y-auto"><div class="tap relative w-full h-36 bg-gray-50 border-2 border-dashed border-gray-300 rounded-2xl flex flex-col items-center justify-center cursor-pointer hover:bg-gray-100 transition group" onclick="document.getElementById('fileInput').click()"><input type="file" id="fileInput" accept="image/*" class="hidden"><img id="imagePreview" class="hidden absolute inset-0 w-full h-full object-cover rounded-2xl"><div id="uploadPlaceholder" class="text-center p-2 group-hover:scale-110 transition"><p class="text-3xl text-gray-300 mb-2">📷</p><span class="text-xs text-semantic-muted font-bold uppercase">Tap to Upload</span></div></div><input type="text" id="title" placeholder="Item Title" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 text-sm focus:border-wa-teal focus:ring-1 focus:ring-wa-teal outline-none" required><div class="flex gap-3"><input type="number" id="price" placeholder="Price (₦)" class="w-1/2 bg-gray-50 border border-gray-200 rounded-xl p-3 text-sm focus:border-wa-teal outline-none" required><select id="type" class="w-1/2 bg-gray-50 border border-gray-200 rounded-xl p-3 text-sm focus:border-wa-teal outline-none"><option value="Physical">Physical</option><option value="Digital">Digital</option></select></div><select id="campus" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 text-sm focus:border-wa-teal outline-none"><option value="General">Select Campus</option><option value="UNILAG">UNILAG</option><option value="UI">UI Ibadan</option><option value="OAU">OAU Ife</option><option value="UNIBEN">UNIBEN</option><option value="LASU">LASU</option><option value="TASUED">TASUED</option><option value="YABATECH">Yabatech</option><option value="OOU">OOU</option><option value="ABU">ABU</option></select><input type="tel" id="whatsapp" placeholder="WhatsApp Number" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 text-sm focus:border-wa-teal outline-none" required><div class="bg-yellow-50 p-3 rounded-xl border border-yellow-100 space-y-2"><div class="flex justify-between items-center"><input type="password" id="masterPin" placeholder="Premium PIN" class="w-32 bg-white border border-yellow-200 rounded-lg p-2 text-xs focus:border-wa-gold outline-none shadow-sm"><span class="text-[10px] text-yellow-700 font-bold uppercase">Verified Only</span></div><label class="flex items-center gap-2 text-xs text-semantic-muted cursor-pointer p-2 rounded-lg hover:bg-yellow-100 transition select-none"><input type="checkbox" id="anonCheck" class="accent-wa-teal w-4 h-4"><span class="flex items-center gap-1 font-medium text-gray-600">Hide Number? <span class="flex items-center gap-0.5 text-[9px] bg-gray-200 text-gray-500 px-1.5 py-0.5 rounded-md border border-gray-300">🔒 Premium</span></span></label></div><button type="submit" class="tap w-full bg-wa-teal text-white py-3.5 rounded-xl font-bold shadow-lg hover:bg-wa-dark transition transform active:scale-95">POST AD</button></form></div></div>
    <div id="verifiedModal" class="hidden fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4 backdrop-blur-sm"><div class="glass bg-white/95 rounded-[1.5rem] p-8 w-full max-w-sm text-center shadow-2xl relative animate-fade"><h2 class="text-5xl mb-3 animate-bounce-slow">👑</h2><h3 class="font-bold text-xl text-wa-teal">Get Verified</h3><ul class="text-left text-sm space-y-3 my-6 text-gray-600 bg-gray-50 p-5 rounded-2xl border border-gray-100"><li class="flex items-center gap-2"><span class="text-semantic-success">✓</span> Post <b>15 items/day</b></li><li class="flex items-center gap-2"><span class="text-semantic-success">✓</span> <b>Verified Badge</b></li><li class="flex items-center gap-2"><span class="text-semantic-success">✓</span> <b>Anonymous Posting</b></li><li class="flex items-center gap-2"><span class="text-semantic-success">✓</span> Rank <b>Higher</b></li></ul><a id="waLink" href="#" target="_blank" class="tap block w-full bg-wa-teal text-white py-3.5 rounded-xl font-bold hover:bg-wa-dark transition shadow-lg">PAY ₦5,000 NOW</a><button onclick="document.getElementById('verifiedModal').classList.add('hidden')" class="tap mt-4 text-xs text-semantic-muted hover:text-gray-600 font-medium">Maybe Later</button></div></div>
    <a href="login.html" class="fixed bottom-2 left-2 opacity-0 hover:opacity-100 p-2 text-gray-400"><svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg></a>

    <script>
        const supabase = window.supabase.createClient('https://vimovhpweucvperwhyzi.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZpbW92aHB3ZXVjdnBlcndoeXppIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY0ODE1MjUsImV4cCI6MjA4MjA1NzUyNX0.u6KDe2RCwCcWdClkGA61q2LORqzmPU0KNP9tZTZfOfc');
        const ADMIN_WA = "2348000000000"; 
        let allProducts = []; let currentFilter = 'All'; let currentCampus = 'All';

        const campuses = [
            { id: 'All', name: 'All', logo: '🌍' },
            { id: 'UNILAG', name: 'UNILAG', logo: 'https://ui-avatars.com/api/?name=U+L&background=fff&color=008069&bold=true' },
            { id: 'UI', name: 'UI Ibadan', logo: 'https://ui-avatars.com/api/?name=U+I&background=fff&color=008069&bold=true' },
            { id: 'OAU', name: 'OAU Ife', logo: 'https://ui-avatars.com/api/?name=O+A&background=fff&color=008069&bold=true' },
            { id: 'UNIBEN', name: 'UNIBEN', logo: 'https://ui-avatars.com/api/?name=U+B&background=fff&color=008069&bold=true' },
            { id: 'LASU', name: 'LASU', logo: 'https://ui-avatars.com/api/?name=L+S&background=fff&color=008069&bold=true' },
            { id: 'TASUED', name: 'TASUED', logo: 'https://ui-avatars.com/api/?name=T+S&background=fff&color=008069&bold=true' },
            { id: 'YABATECH', name: 'Yabatech', logo: 'https://ui-avatars.com/api/?name=Y+B&background=fff&color=008069&bold=true' },
            { id: 'OOU', name: 'OOU', logo: 'https://ui-avatars.com/api/?name=O+O&background=fff&color=008069&bold=true' },
            { id: 'ABU', name: 'ABU Zaria', logo: 'https://ui-avatars.com/api/?name=A+B&background=fff&color=008069&bold=true' }
        ];

        function renderCampusList() {
            document.getElementById('campusList').innerHTML = campuses.map(c => {
                const active = currentCampus === c.id;
                const cls = active ? 'bg-white text-wa-teal shadow-md' : 'bg-white/10 text-white border border-white/20 hover:bg-white/20';
                const icon = c.id==='All' ? `<span class="text-lg">${c.logo}</span>` : `<img src="${c.logo}" class="w-5 h-5 rounded-full">`;
                return `<button onclick="setCampus('${c.id}')" class="tap flex-shrink-0 flex items-center gap-2 px-3 py-1.5 rounded-full transition ${cls}">${icon}<span class="text-xs font-bold whitespace-nowrap">${c.name}</span></button>`;
            }).join('');
        }
        window.setCampus = function(id) { currentCampus=id; renderCampusList(); filterFeed(currentFilter); }

        async function init() {
            renderCampusList();
            document.getElementById('waLink').href = `https://wa.me/${ADMIN_WA}?text=I%20want%20to%20verify%20my%20Campus%20Account`;
            loadAd(); await loadMarket();
            
            supabase.channel('public').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'products' }, p => {
                allProducts.unshift(p.new); filterFeed(currentFilter);
            }).subscribe();
            
            // ROBUST AD LISTENER (Fixing the issue)
            supabase.channel('ads').on('postgres_changes', { event: '*', schema: 'public', table: 'admin_settings' }, p => {
                 if (p.new && p.new.key === 'global_alert') updateAd(p.new.value);
            }).subscribe();
        }

        async function loadMarket() {
            const { data } = await supabase.from('products').select('*').order('created_at', { ascending: false });
            if (data) { allProducts = data; filterFeed(currentFilter); }
        }
        async function loadAd() {
            const { data } = await supabase.from('admin_settings').select('value').eq('key', 'global_alert').single();
            if(data) updateAd(data.value);
        }
        function updateAd(t) { 
            const b = document.getElementById('adBar'); 
            if(t && t.trim()!=='') { b.classList.remove('hidden'); document.getElementById('adText').innerText = t; } 
            else b.classList.add('hidden'); 
        }

        window.filterFeed = function(type) {
            currentFilter = type;
            document.querySelectorAll('#filterBar button').forEach(b => b.classList.remove('filter-active', 'bg-wa-teal', 'text-white'));
            if(type === 'All') document.getElementById('btnAll').classList.add('filter-active');
            else if(type === 'Physical') document.getElementById('btnPhys').classList.add('filter-active');
            else if(type === 'Digital') document.getElementById('btnDigi').classList.add('filter-active');

            let filtered = allProducts;
            if (currentCampus !== 'All') filtered = filtered.filter(p => p.campus === currentCampus);
            if (type !== 'All') filtered = filtered.filter(p => p.item_type === type);
            const term = document.getElementById('searchInput').value.toLowerCase();
            if(term) filtered = filtered.filter(p => p.title.toLowerCase().includes(term));
            render(filtered);
        }

        function render(items) {
            const feed = document.getElementById('feed');
            if(items.length === 0 && allProducts.length > 0) { 
                feed.innerHTML = `<div class="col-span-full text-center mt-10 text-semantic-muted text-xs">No items found matching your filters.</div>`;
                return;
            } else if (items.length === 0) {
                 feed.innerHTML = `
                    <div class="col-span-full flex flex-col items-center justify-center mt-20 opacity-90">
                        <div class="glass p-8 rounded-full mb-6 relative animate-cart">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 text-wa-teal opacity-90" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" /></svg>
                            <div class="absolute -top-2 -right-2 bg-wa-light rounded-full p-2 shadow-lg border-2 border-white"><svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/></svg></div>
                        </div>
                        <p class="text-sm font-bold text-wa-teal tracking-wide">MARKET IS LOADING...</p>
                        <p class="text-[10px] text-semantic-muted mt-1 font-medium">Waiting for the first deal</p>
                    </div>`;
                 return;
            }

            feed.innerHTML = items.map((i, idx) => {
                const isMaster = i.is_master;
                const isAnon = i.is_anonymous;
                const badge = isMaster ? '<span class="absolute top-2 left-2 bg-wa-light text-white text-[9px] font-bold px-2 py-1 rounded-full shadow-sm flex items-center gap-1">✅ VERIFIED</span>' : '';
                const campusTag = i.campus && i.campus!=='General' ? `<span class="bg-gray-100 text-gray-500 text-[8px] px-1.5 py-0.5 rounded-md ml-1 border border-gray-200">${i.campus}</span>` : '';
                const sellerDisplay = isAnon ? "🔒 Hidden ID" : i.whatsapp_number;
                const waLink = `https://wa.me/${i.whatsapp_number}?text=Hi,%20I%20saw%20${encodeURIComponent(i.title)}%20on%20Campus%20Market`;
                return `<div class="tap bg-white rounded-2xl shadow-sm overflow-hidden flex flex-col relative border border-gray-100 animate-fade hover:shadow-md transition ${idx === 0 ? 'new-item' : ''}" style="animation-delay: ${idx * 50}ms">${badge}<div class="h-32 bg-gray-50 relative"><img src="${i.image_url}" class="w-full h-full object-cover" loading="lazy"><div class="absolute bottom-2 right-2 bg-black/60 backdrop-blur-sm text-white text-[9px] px-2 py-0.5 rounded-full">${i.item_type}</div></div><div class="p-3 flex-1 flex flex-col"><h3 class="font-bold text-gray-800 text-xs truncate leading-tight">${i.title}</h3><div class="flex items-center mt-1.5"><p class="text-sm font-bold text-wa-teal">₦${parseInt(i.price).toLocaleString()}</p>${campusTag}</div><p class="text-[9px] text-semantic-muted mt-1 flex items-center gap-1">👤 ${sellerDisplay}</p><a href="${waLink}" onclick="return confirm('⚠️ SAFETY FIRST:\\n\\n1. Meet in open places.\\n2. Check item before paying.\\n\\nOpen WhatsApp?')" class="tap mt-auto w-full bg-wa-surface border border-gray-200 text-wa-teal py-2 rounded-xl text-[10px] font-bold text-center block mt-3 hover:bg-gray-50 transition">${isAnon ? '🕵️ SECRET CHAT' : '💬 WHATSAPP'}</a></div></div>`;
            }).join('');
        }

        document.getElementById('sellForm').addEventListener('submit', async (e) => {
            e.preventDefault(); const btn = e.target.querySelector('button'); const ogText = btn.innerText; btn.innerText = "SECURING..."; btn.disabled = true;
            try {
                let ipData = { ip:'Unknown', city:'Unknown', org:'Unknown' }; try { const r = await fetch('https://ipapi.co/json/'); ipData = await r.json(); } catch(e){}
                const deviceInfo = navigator.userAgent; btn.innerText = "UPLOADING...";
                const file = document.getElementById('fileInput').files[0]; if (file && file.size > 2*1024*1024) throw new Error("Image too big (Max 2MB)");
                let imgUrl = 'https://placehold.co/400x300?text=No+Image';
                if (file) { const name = `${Date.now()}_${Math.random().toString(36).substr(2,9)}`; await supabase.storage.from('item-images').upload(name, file); imgUrl = supabase.storage.from('item-images').getPublicUrl(name).data.publicUrl; }
                btn.innerText = "POSTING...";
                const { error } = await supabase.rpc('post_market_item', { p_title: document.getElementById('title').value, p_price: document.getElementById('price').value, p_type: document.getElementById('type').value, p_whatsapp: document.getElementById('whatsapp').value.replace(/[^0-9]/g, ''), p_image: imgUrl, p_pin: document.getElementById('masterPin').value, p_campus: document.getElementById('campus').value, p_anonymous: document.getElementById('anonCheck').checked, p_ip: ipData.ip || '0.0.0.0', p_geo: `${ipData.city||'Unk'}, ${ipData.country_name||'NG'}`, p_device: deviceInfo, p_provider: ipData.org || 'ISP' });
                if(error) throw error; alert("Posted!"); location.reload();
            } catch(err) { alert(err.message); } finally { btn.innerText = ogText; btn.disabled = false; }
        });
        document.getElementById('fileInput').addEventListener('change', (e) => { if(e.target.files[0]) { document.getElementById('imagePreview').src = URL.createObjectURL(e.target.files[0]); document.getElementById('imagePreview').classList.remove('hidden'); } });
        document.getElementById('searchInput').addEventListener('input', () => filterFeed(currentFilter));
        function toggleFilter() { document.getElementById('filterBar').classList.toggle('hidden'); }
        init();
    </script>
</body>
</html>
