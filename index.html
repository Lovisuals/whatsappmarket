<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Campus Market | Nigeria</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23008069%22/><path d=%22M30 35h5l7 30h30l7-22H38%22 fill=%22none%22 stroke=%22white%22 stroke-width=%226%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/><circle cx=%2245%22 cy=%2275%22 r=%225%22 fill=%22white%22/><circle cx=%2270%22 cy=%2275%22 r=%225%22 fill=%22white%22/><path d=%22M75 15c-5 0-9 4-9 9 0 2 1 4 2 5l-2 7 8-2c2 1 4 1 5 1 5 0 9-4 9-9s-4-9-9-9z%22 fill=%22%2325D366%22/></svg>">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="theme.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="select-none text-gray-800 font-ui bg-wa-bg pb-24">
    <header class="bg-wa-teal text-white pt-4 pb-2 sticky top-0 z-40 shadow-lg backdrop-blur-md bg-opacity-95">
        <div class="flex justify-between items-center px-4 mb-4">
            <h1 class="font-bold text-xl tracking-tight">
                CampusMarket <span class="text-[10px] bg-white text-wa-teal px-1.5 py-0.5 rounded font-extrabold">NG</span>
            </h1>
            <div class="flex items-center gap-2">
                <button id="adminGateBtn" onclick="window.handleAdminGate()" class="opacity-20 hover:opacity-100 text-[8px] text-white transition font-bold uppercase">Admin</button>
            </div>
        </div>
        <div class="flex gap-3 overflow-x-auto px-4 pb-2 scrollbar-hide" id="campusList"></div>
    </header>

    <div class="bg-white p-4 shadow-md border-b border-gray-100 sticky top-[110px] z-30">
        <input type="text" id="searchInput" oninput="window.renderFeed()" placeholder="Search items..." class="w-full bg-gray-100 p-3 rounded-xl text-sm mb-3 outline-none focus:ring-2 focus:ring-wa-teal transition">
    </div>

    <main id="feed" class="p-3 grid grid-cols-2 md:grid-cols-4 gap-3 min-h-[60vh]"></main>

    <button id="addBtn" onclick="window.openModal('sellModal')" class="fixed bottom-6 right-6 bg-wa-teal text-white w-14 h-14 rounded-2xl flex items-center justify-center text-3xl shadow-xl active:scale-90 transition transform z-50">+</button>

    <!-- Sell Modal with Image Upload -->
    <div id="sellModal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-[2rem] p-8 w-full max-w-sm shadow-2xl animate-pop overflow-y-auto max-h-[90vh]">
            <h2 class="text-xl font-bold mb-4 text-center">Post Item</h2>
            <form id="sellForm" onsubmit="window.handlePostAd(event)" class="space-y-4">
                <input type="text" id="sellTitle" placeholder="Title" class="w-full p-4 bg-gray-50 rounded-xl border outline-none" required>
                <input type="number" id="sellPrice" placeholder="Price (₦)" class="w-full p-4 bg-gray-50 rounded-xl border outline-none" required>
                <select id="sellCampus" class="w-full p-4 bg-gray-50 rounded-xl border outline-none" required></select>
                <input type="tel" id="sellWhatsapp" placeholder="WhatsApp (234...)" class="w-full p-4 bg-gray-50 rounded-xl border outline-none" required>
                <div class="space-y-2">
                    <label class="text-sm font-bold">Images (up to 3)</label>
                    <input type="file" id="sellImages" accept="image/*" multiple class="w-full">
                    <div id="imagePreview" class="grid grid-cols-3 gap-2 mt-2"></div>
                </div>
                <button type="submit" id="postBtn" class="w-full bg-wa-teal text-white py-4 rounded-xl font-bold">POST NOW</button>
            </form>
            <button onclick="window.closeModal('sellModal')" class="w-full text-gray-400 text-[10px] font-bold uppercase mt-4">Cancel</button>
        </div>
    </div>

    <!-- Login Modal -->
    <div id="loginModal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-[2rem] p-8 w-full max-w-sm shadow-2xl animate-pop">
            <h2 class="text-xl font-bold mb-4 text-center">Admin Verify</h2>
            <form id="loginForm" onsubmit="window.handleLogin(event)" class="space-y-4">
                <input type="email" id="loginEmail" placeholder="Email" class="w-full p-4 bg-gray-50 rounded-xl border outline-none" required>
                <input type="password" id="loginPass" placeholder="Password" class="w-full p-4 bg-gray-50 rounded-xl border outline-none" required>
                <button type="submit" class="w-full bg-wa-teal text-white py-4 rounded-xl font-bold">ENTER</button>
            </form>
            <button onclick="window.closeModal('loginModal')" class="w-full text-gray-400 text-[10px] uppercase mt-4">Cancel</button>
        </div>
    </div>

    <!-- Admin Dashboard Overlay -->
    <div id="adminOverlay" class="hidden fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-6 w-full max-w-4xl shadow-2xl max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold">Admin Dashboard</h2>
                <button onclick="window.closeModal('adminOverlay'); supabase.auth.signOut()" class="text-red-600 font-bold">Logout</button>
            </div>
            <div id="adminFeed" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
        </div>
    </div>

    <script>
        const supabase = window.initSupabase?.() || null;
        let allProducts = [];
        let isAdmin = false;
        let currentUserId = null;

        // UI Utilities
        window.openModal = id => document.getElementById(id)?.classList.remove('hidden');
        window.closeModal = id => document.getElementById(id)?.classList.add('hidden');

        window.handleAdminGate = () => isAdmin ? openModal('adminOverlay') : openModal('loginModal');

        // Auth
        window.handleLogin = async e => {
            e.preventDefault();
            const { data, error } = await supabase.auth.signInWithPassword({
                email: document.getElementById('loginEmail').value,
                password: document.getElementById('loginPass').value
            });
            if (error) return alert(error.message);

            const { data: admin } = await supabase.from('admins').select('id').eq('id', data.user.id).single();
            if (!admin) {
                await supabase.auth.signOut();
                return alert("Access Denied");
            }
            isAdmin = true;
            currentUserId = data.user.id;
            closeModal('loginModal');
            document.getElementById('adminGateBtn').textContent = "DASHBOARD";
            alert("Welcome Admin");
            renderAdminFeed();
        };

        // Image Compression Helper
        const compressImage = file => new Promise(resolve => {
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const maxWidth = 1024;
                let width = img.width;
                let height = img.height;
                if (width > maxWidth) {
                    height = (maxWidth / width) * height;
                    width = maxWidth;
                }
                canvas.width = width;
                canvas.height = height;
                ctx.drawImage(img, 0, 0, width, height);
                canvas.toBlob(blob => resolve(URL.createObjectURL(blob)), 'image/jpeg', 0.7);
            };
            img.src = URL.createObjectURL(file);
        });

        // Post Ad with Images
        window.handlePostAd = async e => {
            e.preventDefault();
            const btn = document.getElementById('postBtn');
            btn.disabled = true;
            btn.textContent = "POSTING...";

            const files = document.getElementById('sellImages').files;
            let images = [];
            if (files.length > 0) {
                for (let file of Array.from(files).slice(0,3)) {
                    images.push(await compressImage(file));
                }
            }

            const payload = {
                title: document.getElementById('sellTitle').value.trim(),
                price: Number(document.getElementById('sellPrice').value),
                campus: document.getElementById('sellCampus').value,
                whatsapp_number: document.getElementById('sellWhatsapp').value.trim(),
                images: images,
                is_master: false
            };

            const { error } = await supabase.from('products').insert(payload);
            if (error) alert(error.message);
            else {
                alert("Posted Successfully!");
                closeModal('sellModal');
                e.target.reset();
                document.getElementById('imagePreview').innerHTML = '';
            }
            btn.disabled = false;
            btn.textContent = "POST NOW";
        };

        // Render Feed (Public + Admin)
        const renderProductCard = (p, adminMode = false) => `
            <div class="product-card bg-white rounded-2xl shadow-sm overflow-hidden flex flex-col border border-gray-100">
                <img src="${p.images?.[0] || 'https://placehold.co/400x300'}" class="h-40 w-full object-cover">
                <div class="p-3 flex-1 flex flex-col">
                    <h3 class="font-bold text-xs truncate">${p.title}</h3>
                    <p class="text-wa-teal font-black text-sm mt-1">₦${Number(p.price).toLocaleString()}</p>
                    ${p.is_master ? '<span class="text-[8px] bg-green-100 text-green-600 px-2 py-0.5 rounded-full font-bold mt-2">VERIFIED</span>' : ''}
                    ${adminMode ? `
                    <div class="mt-auto pt-3 flex gap-2">
                        <button onclick="window.toggleVerify(${p.id}, ${!p.is_master})" class="flex-1 bg-${p.is_master ? 'red' : 'green'}-600 text-white py-2 rounded-xl text-xs font-bold">
                            ${p.is_master ? 'UNVERIFY' : 'VERIFY'}
                        </button>
                        <button onclick="window.deleteProduct(${p.id})" class="flex-1 bg-red-600 text-white py-2 rounded-xl text-xs font-bold">DELETE</button>
                    </div>` : ''}
                </div>
            </div>`;

        window.renderFeed = () => {
            const term = (document.getElementById('searchInput')?.value || '').toLowerCase();
            const filtered = allProducts.filter(p => p.title.toLowerCase().includes(term));
            document.getElementById('feed').innerHTML = filtered.map(p => renderProductCard(p, false)).join('');
        };

        const renderAdminFeed = () => {
            document.getElementById('adminFeed').innerHTML = allProducts.map(p => renderProductCard(p, true)).join('');
        };

        // Admin Actions with Audit Log
        window.toggleVerify = async (productId, verify) => {
            const { error } = await supabase.from('products').update({ is_master: verify }).eq('id', productId);
            if (!error) {
                await supabase.from('audit_logs').insert({
                    admin_id: currentUserId,
                    product_id: productId,
                    action: verify ? 'verify' : 'unverify',
                    timestamp: new Date().toISOString()
                });
                loadMarket();
            }
        };

        window.deleteProduct = async productId => {
            if (!confirm('Delete this product?')) return;
            const { error } = await supabase.from('products').delete().eq('id', productId);
            if (!error) {
                await supabase.from('audit_logs').insert({
                    admin_id: currentUserId,
                    product_id: productId,
                    action: 'delete',
                    timestamp: new Date().toISOString()
                });
                loadMarket();
            }
        };

        // Load & Realtime
        async function loadMarket() {
            if (!supabase) return;
            const { data } = await supabase.from('products').select('*').order('created_at', { ascending: false });
            allProducts = data || [];
            renderFeed();
            if (isAdmin) renderAdminFeed();
        }

        // Realtime Subscription
        function subscribeRealtime() {
            if (!supabase) return;
            supabase.channel('public:products')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'products' }, payload => {
                    loadMarket();
                })
                .subscribe();
        }

        // Init
        (async () => {
            if (!supabase) {
                window.CampusWatchdog?.report('SDK_FAIL', 'Supabase init failed');
                return;
            }

            // Populate Campuses
            const campusList = document.getElementById('campusList');
            const campusSelect = document.getElementById('sellCampus');
            const options = window.CampusConfig?.campuses || [];
            campusList.innerHTML = options.map(c => `
                <button class="tap px-4 py-2 bg-white/20 rounded-full text-sm font-bold">${c.logo || ''} ${c.name}</button>
            `).join('');
            campusSelect.innerHTML = options.filter(c => c.id !== 'All').map(c => `<option value="${c.id}">${c.name}</option>`).join('');

            // Session Check
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                const { data: admin } = await supabase.from('admins').select('id').eq('id', session.user.id).single().catch(() => ({ data: null }));
                if (admin) {
                    isAdmin = true;
                    currentUserId = session.user.id;
                    document.getElementById('adminGateBtn').textContent = "DASHBOARD";
                }
            }

            await loadMarket();
            subscribeRealtime();
        })();
    </script>
</body>
</html>
